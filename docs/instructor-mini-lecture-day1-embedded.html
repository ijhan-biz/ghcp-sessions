<template id="embedded-source-034"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C53</strong><span>SDLC 하네스 실제 사례</span><span>GitHub Spec Kit — /specify → /plan → /tasks → /implement</span></p><div><div><div>CASE C1 · 공식 저장소</div><h3>GitHub Spec Kit — /specify → /plan → /tasks → /implement</h3><div><span>Spec-driven</span> <span>슬래시 워크플로우</span> <span>30+ 에이전트 지원</span> <span>taskstoissues</span></div></div><div><p>📦 <b>공개 저장소:</b> <a href="https://github.com/github/spec-kit" target="_blank" rel="noopener noreferrer">github/spec-kit</a></p>
<p><b>개요.</b> <code>github/spec-kit</code> 는 에이전트를 <b>명세 우선</b> 레일에 태우는 툴킷이다. <code>specify init</code> 이 선택한 에이전트에 슬래시 커맨드(프롬프트 템플릿)를 설치하고, 에이전트는 <b>헌법→명세→계획→작업분해</b> 를 거치기 전엔 코드를 쓰지 않는다. 이것이 "workflow 층 하네스"의 정석이다.</p>
<h4>설치 · 워크플로우</h4>
<pre><code><span># 설치(고정 릴리스) 또는 일회성 실행</span>
uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@vX.Y.Z
uvx --from git+https://github.com/github/spec-kit.git@vX.Y.Z specify init my-project

<span># 에이전트를 골라 프로젝트에 하네스 설치</span>
specify init my-project --integration copilot   <span># 또는 claude / codex / cursor-agent / gemini ...</span></code></pre><pre><code>/speckit.constitution   # 모든 개발을 지배하는 원칙/가이드라인 생성·갱신
/speckit.specify        # 기능 설명 -&gt; 구조화된 PRD(spec.md). feature 번호·git 브랜치 자동 생성
/speckit.clarify        # 미명세 영역 질의·해소 (plan 전 권장)
/speckit.plan           # spec + 헌법 제약 -&gt; 기술 아키텍처(data-model, contracts, research)
/speckit.tasks          # plan -&gt; 실행 가능한 tasks.md. 독립 작업은 [P] 병렬 표시
/speckit.analyze        # 산출물 간 일관성·커버리지 교차 분석
/speckit.checklist      # 요구사항 완결성·명확성·일관성 검증용 커스텀 체크리스트 생성
/speckit.implement      # tasks.md 전체 실행
/speckit.converge       # 코드베이스를 spec/plan/tasks와 대조해 남은 작업을 새 task로 추가
/speckit.taskstoissues  # 작업 목록 -&gt; GitHub Issues 로 변환(프로젝트관리 층과 연결)</code></pre>
<h4>생성되는 구조 = 폐루프의 기록물</h4>
<pre><code>my-project/
├── .specify/
│   ├── templates/              # SDD 커맨드 템플릿(오버라이드/preset/extension 우선순위 스택)
│   └── scripts/{bash,powershell}/
└── specs/
    └── 003-chat-system/        # /speckit.specify 가 만든 자동 번호 브랜치
        ├── spec.md             # user story·acceptance criteria
        ├── plan.md             # /speckit.plan
        ├── research.md         # (자동) 라이브러리 비교 등
        ├── data-model.md
        ├── contracts/          # API/이벤트 계약
        └── tasks.md            # [P] 병렬 마커 포함 실행 목록</code></pre>
<p><b>Agentic SDLC 매핑.</b> 헌법=거버넌스, spec=요구사항 기록, plan=설계, tasks=작업분해, implement=구현, taskstoissues=프로젝트관리 환류. spec을 git에 버전드로 남겨 <b>명세가 단일 기준(system of record)</b> 이 된다. 조직은 extension/preset으로 컴플라이언스 게이트·도메인 용어를 얹는다.</p>
<div><h4>팀 하네스 맥락 · 결과 · 에피소드</h4><ul><li><b>맥락:</b> SDD가 권력 구조를 뒤집음 — "코드가 명세를 섬긴다. PRD는 구현의 가이드가 아니라 <b>구현을 생성하는 원천</b>." <code>/speckit</code> 체인을 끝내기 전엔 코드를 못 씀.</li><li><b>결과:</b> 문서 사이트 기준 30+ 통합(2026-07-07 문서 기준 <b>33개 명명 에이전트</b> + Generic), 커뮤니티 <i>(자가보고)</i> 105 확장·60+ 저자·22 preset. 최신 v0.12.5.</li><li><b>에피소드:</b> spec-driven.md의 시간 비교 — 전통 방식 문서화 ~12시간 vs SDD 커맨드로 <b>15분에 명세+계획</b> 완성. (참고: GitHub 엔지니어링 블로그 URL은 조사 시점 미발견 — 저장소·docs가 1차 근거.)</li></ul><p>💰 <b>토큰 절약 포인트:</b> <b>명세를 파일로 고정</b> 해 "매번 다시 설명하는" 토큰을 없앤다. 헌법·spec·plan·tasks를 <code>specs/</code> 에 버전드로 남기면, 세션이 바뀌어도 에이전트가 요구사항·아키텍처·작업분해를 <b>재서술 없이 단일 기준(system of record)으로 재사용</b> 한다 — 긴 요구사항을 매 대화에서 프롬프트로 반복 입력할 필요가 없다. 또 <code>/speckit</code> 체인을 끝내기 전엔 코드를 못 쓰게 강제하므로, 명세 없이 잘못 구현했다가 <b>버리고 다시 짜는 재작업 토큰</b> 을 앞단에서 차단한다.</p><p><b>보강 출처</b> · web: github.com/github/spec-kit(spec-driven.md)·github.github.io/spec-kit · 내부: 050·024</p></div><div><b>출처</b> · github.com/github/spec-kit(README·spec-driven.md·docs/installation·docs/reference/integrations) · github.github.io/spec-kit. <span>참고</span> 별도 GitHub 엔지니어링 블로그 URL은 조사 시점 404 — 저장소를 1차 근거로 인용. 지원 에이전트 30+.</div><p><a href="../../../ref/harness-gen-output/053-agentic-sdlc-harness-engineering-real-cases-2026-07-10.html#toc" target="_blank" rel="noopener noreferrer">↑ 목차</a></p>
</div></div></article></template>

<template id="embedded-source-036"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>P31</strong><span>AI 보조 SDLC 플레이북</span><span>9. Data and Approval Boundaries</span></p><section>
      <h2>9. Data and Approval Boundaries</h2>
      <div>
        <div><h3>GitHub SDLC baseline</h3><p>issues, milestones, ADR, branches, PR, Actions, security scan, release note, runbook, backlog를 GitHub SDLC에 남긴다.</p></div>
        <div><h3>Optional Azure reference architecture</h3><p>identity, deployment target, monitoring, policy, cost controls가 필요한 경우에만 Azure reference architecture를 lane으로 추가한다.</p></div>
        <div><h3>Approval boundary</h3><p>AI generated draft가 있더라도 merge, release, publish, rollback authorization은 사람만 가진다.</p></div>
      </div>
      <table>
        <thead><tr><th>Boundary</th><th>Allowed</th><th>Approval required</th><th>Not allowed</th></tr></thead>
        <tbody>
          <tr><td>Read</td><td>repo, docs, approved workshop material, source set</td><td>private incident raw log, customer data</td><td>secret/plaintext credential exposure</td></tr>
          <tr><td>Write</td><td>draft docs, scaffold, tests, PR descriptions</td><td>main merge, policy changes, environment updates</td><td>destructive write without gate</td></tr>
          <tr><td>Execute</td><td>local safe scripts, tests, lint, checks</td><td>deploy, migration, external write API</td><td>unapproved production writes</td></tr>
          <tr><td>Publish</td><td>internal demo artifact</td><td>customer-facing release, public post, formal architecture adoption</td><td>agent self-publish</td></tr>
        </tbody>
      </table>
      <div>Decision reversibility(역할 피드백 iter 7): 결정을 one-way door(되돌리기 어려움)와 two-way door(쉽게 되돌림)로 구분한다. two-way door는 AI draft로 빠르게 실험하고, one-way door(architecture, 데이터 모델, 외부 계약, 릴리스)는 사람 승인을 반드시 거친다.</div>
      <div>AI red lines quick card(역할 피드백 iter 10): (1) merge·release·publish·rollback 승인, (2) 보안 go/no-go, (3) architecture·데이터 모델 결정, (4) 고객데이터·비밀 취급 — 이 4가지는 AI에 위임하지 않는다. 나머지 draft 작업은 위임하되 사람 검토를 거친다.</div>
    </section></article></template>

    <p><strong>일관성 질문:</strong> S1~S4가 모두 같은 <code>{ app, start, end }</code> 입력, <code>idleGapMs</code> 의 <code>&gt;</code> /<code>==</code> 경계, <code>[{ start, end, count }]</code> 출력을 말하나요? 각 AC에 테스트 이름이 있고, 원본 창 제목·URL이 fixture나 출력에 없나요?</p>
    <p><strong>S5 원칙:</strong> 여기서는 새 기능을 추가하지 않습니다. 앞 단계에 없던 아이디어는 <code>unknown</code> 또는 stretch backlog로 보내고, Day2 core 계약만 하나로 묶습니다.</p>
  </div>
  <div><div>정리 프롬프트</div>
<pre><code>[작업] 아래 흩어진 산출물을 Feature Spec Pack v1로 합쳐라.
[포함] 비식별 스펙, AC, Context Manifest, Plan(2~4단계), Test Matrix, Risk/Gate.
[제약] 새 요구사항 추가 금지(있으면 unknown으로 표기), 민감정보 금지.
[출력] 단일 마크다운(파일명 <strong>spec.md</strong>), 섹션 제목 포함.</code></pre></div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>S1~S4 산출물을 새 요구 추가 없이 하나의 <code>spec.md</code> 로 연결한다.</li><li>core·stretch·out을 분리하고 must-have AC에 테스트 이름을 연결한다.</li><li>받는 사람이 설명 없이 Day2를 시작할 수 있는지 자가 판정한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>spec.md

  [x] Context Manifest

<template id="embedded-source-041"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L33</strong><span>장기 실행 AI 업무 플레이북</span><span>2. 수행 방법(아키텍처/운영 패턴)</span></p><section>
      <h2>2. 수행 방법(아키텍처/운영 패턴)</h2>
      <div>
        <div><h3>A. 루프형 오케스트레이션</h3><p>수집 → 정규화 → 생성 → 검증 → 승인 단계를 반복한다. 각 단계는 artifact와 로그를 남기고, 실패 시 해당 단계로만 롤백한다.</p></div>
        <div><h3>B. 배치 + 이벤트 혼합</h3><p>정기 배치(야간/주간)와 이벤트 트리거(이슈 발생)를 분리해 운영한다. 비용 예측은 배치, 긴급 대응은 이벤트로 다룬다.</p></div>
        <div><h3>C. Human-in-the-loop</h3><p>고위험 결과(대외 배포, 정책 변경, 고객 응답)는 항상 사람 승인 후 반영한다. 승인자·만료시간·예외사유를 함께 기록한다.</p></div>
        <div><h3>D. 하네스 우선 검증</h3><p>사실검증과 구조검증을 분리한다. lint/schema/link/checklist는 자동, 고위험 claim은 수동 검증으로 운영한다.</p></div>
      </div>
      <h3>실행 스택 예시(벤더 중립)</h3>
      <table>
        <thead><tr><th>레이어</th><th>필수 구성</th><th>권장 구성</th><th>비고</th></tr></thead>
        <tbody>
          <tr><td>오케스트레이션</td><td>상태머신/워크플로 엔진</td><td>체크포인트 해시 + 재개 정책</td><td>작업 장기화 시 필수</td></tr>
          <tr><td>모델 라우팅</td><td>기본/고급 모델 분리</td><td>비용 임계치 기반 자동 다운시프트</td><td>비용 폭주 방지</td></tr>
          <tr><td>근거 저장</td><td>source ledger</td><td>claim-source-grade 매트릭스</td><td>감사 추적성 강화</td></tr>
          <tr><td>관측성</td><td>성공률/지연/비용 로그</td><td>burn-rate 대시보드 + 알람</td><td>SLO 기반 운영</td></tr>

      <h2>11. Practical Templates</h2>
      <h3>Issue Template</h3>
      <table><thead><tr><th>Field</th><th>Required Content</th><th>Copilot Use</th></tr></thead><tbody>
        <tr><td>Problem</td><td>사용자/시스템 영향, 현재 동작, 원하는 동작</td><td>요약과 누락 질문</td></tr>
        <tr><td>Acceptance Criteria</td><td>검증 가능한 조건, tests, docs, rollback</td><td>test matrix 생성</td></tr>
        <tr><td>Risk Tier</td><td>data/security/deploy/billing 여부</td><td>risk checklist 초안</td></tr>
        <tr><td>Agent Scope</td><td>허용 파일, 금지 파일, tool boundary</td><td>context manifest</td></tr>
      </tbody></table>
      <h3>Pull Request Checklist</h3>
      <ul>
        <li>Issue/ADR/source set 링크가 있다.</li>
        <li>AI-generated or AI-assisted label이 있다.</li>
        <li>Copilot output은 사람이 읽고 수정했다.</li>
        <li>Required checks, security scan, test owner review가 완료됐다.</li>
        <li>Rollback owner, trigger, RTO, completion criteria가 있다.</li>
        <li>가격/모델/API/preview/tenant claim은 release-time recheck required로 표시했다.</li>
      </ul>

<template id="embedded-source-044"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>W17</strong><span>Copilot 고급 업무 흐름 가이드</span><span>5. Branching and Worktrees</span></p><section><h2>5. Branching and Worktrees</h2><p>GHCP에서 대화 분기는 Git 격리로 바꾸는 편이 안전하다. 실험은 branch, worktree, draft PR, checkpoint commit으로 분리하고, 원래 흐름으로 돌아갈 때는 PR/issue/handoff note를 읽는다.</p><pre><code>git switch -c experiment/ui-verify; git worktree add ../repo-ui-verify experiment/ui-verify; gh pr create --draft --title "Experiment: UI verification loop"</code></pre></section></article></template>
<template id="embedded-source-045"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>H21</strong><span>하네스 역사와 핵심 개념</span><span>5. Operating Model</span></p><section>
      <h2>5. Operating Model</h2>
      <p>이 저장소의 하네스 운영은 문서를 예쁘게 만드는 절차가 아니라, 반복 가능한 발행 루프다. 특히 고객-facing 자료는 “생성한 뒤 검토”가 아니라 “근거 경계와 실패 조건을 먼저 고정한 뒤 생성”으로 이동한다.</p>
      <div>
        <div>
          <h3>Recommended Loop</h3>
          <ol>
            <li><strong>Read</strong>: ref, output, ADR, scripts, rounds에서 관련 corpus를 찾는다.</li>
            <li><strong>Analyze</strong>: Fact, Interpretation, Forecast와 source type을 분리한다.</li>
            <li><strong>Learn</strong>: 반복되는 실패와 금지 표현을 checker 조건으로 바꾼다.</li>
            <li><strong>Fix</strong>: HTML, source set, checker, package script를 함께 보정한다.</li>
            <li><strong>Result</strong>: PASS/FAIL, 잔여 리스크, reviewer action을 남긴다.</li>
          </ol>
        </div>
        <div>
          <h3>Operating Rules</h3>
          <ul>
            <li>must-have 제약은 자연어 설명으로만 두지 않고 checker에 넣는다.</li>
            <li>source set은 보고서의 부록이 아니라 report wording rule의 입력이다.</li>
            <li>하네스 실패는 품질 사건이며, 우회가 아니라 원인 기록과 수정 대상이다.</li>
            <li>외부 공유 전에는 product owner와 research owner가 release-time recheck를 완료한다.</li>
          </ul>
        </div>
      </div>
      <div>이 문서 자체의 gate는 <code>check:harness-history-report</code> 다. checker는 구조, 필수 섹션, source boundary, 금지 과장, SLO/rollback 표, package wiring을 확인한다.</div>
    </section></article></template>

const stage=document.querySelector('#stage'),counter=document.querySelector('#counter'),chapterLabel=document.querySelector('#chapter-label'),progressFill=document.querySelector('#progress-fill'),prevButton=document.querySelector('#prev-button'),nextButton=document.querySelector('#next-button'),notesDrawer=document.querySelector('#notes-drawer'),notesContent=document.querySelector('#notes-content'),overview=document.querySelector('#overview'),help=document.querySelector('#help');let current=0;
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function visual(v){const items=v.items.map(x=>'<div class="visual-item"><strong>'+esc(x.label)+'</strong><span>'+esc(x.detail)+'</span></div>').join('');return '<div class="visual '+esc(v.type)+'" style="--count:'+v.items.length+'"><p class="visual-title">'+esc(v.title)+'</p><div class="visual-items">'+items+'</div></div>'}
function markup(s){const links=s.sources.map(id=>'<a class="tag embedded-source-link" href="'+sourceHref(s.id,id)+'" data-embedded-source="'+esc(s.id+'|'+id)+'" target="_blank" rel="noopener noreferrer" title="'+esc(SOURCES[id].title)+' · 내장 근거 열기">'+esc(id)+'</a>').join('');const caveats=s.caveats.map(id=>'<span class="tag caveat">'+esc(id)+'</span>').join('');const terms=s.terms?.length?'<div class="term-line">'+s.terms.map(x=>'<span class="term"><strong>'+esc(x[0])+'</strong>('+esc(x[1])+')</span>').join('')+'</div>':'';const caseStrip=s.caseStudy?'<div class="case-strip"><strong>REF CASE · '+esc(s.caseStudy.name)+'</strong><span>'+esc(s.caseStudy.text)+'</span></div>':'';const close=s.question?'<div class="teaching-close"><strong>청중 질문 · '+esc(s.question)+'</strong><span>학습자 활동 인계 · '+esc(s.handoff)+'</span></div>':'';const classes='slide content'+(s.caseStudy?' has-case':'')+(s.question?' has-close':'');return '<article class="'+classes+'" data-slide-id="'+esc(s.id)+'"><div class="section-rail"></div><header class="slide-head"><p class="kicker">'+esc(s.session)+' · '+esc(s.phase)+'</p>'+terms+'<h1 class="title">'+esc(s.title)+'</h1><p class="claim">'+esc(s.claim)+'</p></header><div class="slide-body"><ul class="bullets">'+s.bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="visual-column">'+visual(s.visual)+caseStrip+close+'</div></div><footer class="slide-foot"><div class="source-tags">'+links+'</div><div class="caveat-tags">'+caveats+'</div></footer></article>'}
function notes(s){const links=s.sources.map(id=>'<li><a class="embedded-source-link" href="'+sourceHref(s.id,id)+'" data-embedded-source="'+esc(s.id+'|'+id)+'" target="_blank" rel="noopener noreferrer"><strong>'+id+'</strong> · '+esc(SOURCES[id].title)+'</a></li>').join('');const cv=s.caveats.length?'<h3>경계</h3><ul>'+s.caveats.map(id=>'<li><strong>'+id+'</strong> · '+esc(CAVEATS[id])+'</li>').join('')+'</ul>':'';notesContent.innerHTML='<h3>강사 발화</h3><p>'+esc(s.cue)+'</p>'+(s.caseStudy?'<h3>ref 사례</h3><p><strong>'+esc(s.caseStudy.name)+'</strong> · '+esc(s.caseStudy.text)+'</p>':'')+(s.question?'<h3>청중 질문</h3><p>'+esc(s.question)+'</p><h3>활동 인계</h3><p>'+esc(s.handoff)+'</p>':'')+'<h3>참조 링크</h3><ul>'+links+'</ul>'+cv}
function render(){const s=SLIDES[current];stage.innerHTML=markup(s);counter.textContent=String(current+1).padStart(2,'0')+' / '+SLIDES.length;chapterLabel.textContent=s.session+' · '+s.phase;progressFill.style.width=((current+1)/SLIDES.length*100)+'%';prevButton.disabled=current===0;nextButton.disabled=current===SLIDES.length-1;document.title=String(current+1).padStart(2,'0')+' · '+s.title+' — '+DAY;history.replaceState(null,'','#'+s.id);notes(s);document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('current',i===current))}
function go(i){current=Math.max(0,Math.min(SLIDES.length-1,i));render()}function hash(){const id=location.hash.slice(1),i=SLIDES.findIndex(x=>x.id===id);if(i>=0)current=i;render()}function close(){overview.classList.remove('open');help.classList.remove('open');notesDrawer.classList.remove('open')}
function buildOverview(){document.querySelector('#overview-groups').innerHTML=SESSION_GROUPS.map(g=>'<section class="overview-group"><h3>'+g+'</h3><div class="thumb-grid">'+SLIDES.map((s,i)=>({s,i})).filter(x=>x.s.session===g).map(x=>'<button class="thumb" type="button" data-i="'+x.i+'"><small>'+String(x.i+1).padStart(2,'0')+' · '+x.s.phase+'</small><strong>'+esc(x.s.title)+'</strong></button>').join('')+'</div></section>').join('');document.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.i));close()}))}
function buildPrint(){document.querySelector('#print-root').innerHTML=SLIDES.map(s=>'<div class="print-slide">'+markup(s)+'</div>').join('')}
prevButton.addEventListener('click',()=>go(current-1));nextButton.addEventListener('click',()=>go(current+1));document.querySelector('#overview-button').addEventListener('click',()=>overview.classList.add('open'));document.querySelector('#notes-button').addEventListener('click',()=>notesDrawer.classList.toggle('open'));document.querySelector('#theme-button').addEventListener('click',()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark');document.querySelector('#print-button').addEventListener('click',()=>window.print());document.querySelector('#help-button').addEventListener('click',()=>help.classList.add('open'));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',close));window.addEventListener('hashchange',hash);window.addEventListener('keydown',e=>{if(!sourceViewer.hidden)return;if(e.key==='Escape')return close();if(e.key.toLowerCase()==='o')return overview.classList.toggle('open');if(e.key.toLowerCase()==='n')return notesDrawer.classList.toggle('open');if(e.key.toLowerCase()==='t')return document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';if(e.key.toLowerCase()==='p'){e.preventDefault();return window.print()}if(e.key==='Home')return go(0);if(e.key==='End')return go(SLIDES.length-1);if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();return go(current+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});buildOverview();buildPrint();hash();
</script></body></html>
