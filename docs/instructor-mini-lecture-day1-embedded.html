<header>
  <div>DAY 1 · SESSION 0 · 09:00–09:40 (40m)</div>
  <h1>OT &amp; 로컬 환경 점검 — 돌아갈 baseline부터 만든다</h1>
  <p>2일 전체 흐름과 "이 과정의 약속"을 공유하고, 실습 내내 의지할 <strong>로컬 환경</strong> 을 smoke test로 검증한 뒤, 문제가 생겨도 되돌아올 수 있는 <strong>baseline 브랜치</strong> 를 만듭니다.</p>
  <div><span>관련: 환경 점검·교정 스크립트(setup)</span> <span><strong>EN-14</strong> Smoke test</span> <span><strong>EN-18</strong> Green/Yellow/Red</span> <span><strong>HE-14</strong> Local-only</span> <span><strong>EN-15</strong> Fallback</span></div>
</header>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li>2일 과정의 산출물 줄기와 전원 공통 <code>activity-log/sessionize</code> slice를 이해한다.</li>
    <li>VS Code · Copilot · Git · Node 를 <strong>환경 점검·교정 스크립트</strong> 로 점검·자동 교정하고 <strong>Green/Yellow/Red</strong> 를 자가 판정한다(<span>EN-18</span>).</li>
    <li>실습 브랜치와 baseline 테스트 결과를 남겨 <strong>되돌아올 지점</strong> 을 확보한다.</li>
  </ul>
</section>

<section>
  <h2>첫 8분 OT — 2일 전체 프로그램을 먼저 읽는 법</h2>
  <p>이 과정은 매시간 새 과제를 끝내는 모음이 아니라, <strong>같은 공통 기능을 이틀 동안 한 줄기로 완성하는 과정</strong> 입니다. 모든 참가자는 <code>sample-project-activity-log</code> 의 <code>sessionize</code> slice를 기준으로 준비·구현·검증 증거를 차례로 쌓습니다.</p>
  <div>
    <span>스펙 카드</span> <span>→</span>
    <span>User Story·AC</span> <span>→</span>
    <span>Context Manifest</span> <span>→</span>
    <span>Plan·Test Matrix</span> <span>→</span>
    <span>하네스·로컬 게이트</span> <span>→</span>
    <span>test-first 구현·검증</span> <span>→</span>
    <span>리뷰 패킷</span> <span>→</span>
    <span>Custom Skill·공유</span>
  </div>

  <table>
    <caption>Day 1과 Day 2의 역할 — 준비와 구현의 경계</caption>
    <thead><tr><th>구간</th><th>핵심 질문</th><th>실제로 하는 일</th><th>경계</th></tr></thead>
    <tbody>
      <tr><td><strong>Day 1</strong> <br>좋은 입력 만들기</td><td>무엇을, 어떤 범위와 기준으로 바꿀 것인가?</td><td>스펙·프롬프트·AC·허용 범위·Plan·Test Matrix를 만들고 <strong>Feature Spec Pack v1</strong> 로 묶습니다.</td><td><code>sessionize</code> 공통 구현은 아직 하지 않습니다. Day 1의 산출물이 Day 2 구현의 입력입니다.</td></tr>
      <tr><td><strong>Day 2</strong> <br>안전하게 실행하기</td><td>어떻게 구현하고, 실패를 감지하고, 검증할 것인가?</td><td>하네스·로컬 게이트를 적용하고 D2·S4에서 실패 테스트를 켠 뒤 <code>sessionize</code> 를 test-first로 구현합니다.</td><td>구현·통합·리뷰 패킷·Custom Skill·공유까지 완료합니다.</td></tr>
    </tbody>
  </table>

  <div><strong>“실습 2”를 읽는 법:</strong> 하나의 고유한 <em>2번 실습</em> 을 계속 반복하는 뜻이 아닙니다. 번호는 <strong>각 세션 안에서 다시 시작</strong> 합니다. 예를 들어 D1·S1의 실습 2는 스펙 작성, D1·S2의 실습 2는 요구사항 정제, D1·S3의 실습 2는 Context Manifest 작성입니다. 실제 test-first 구현은 <strong>D2·S4의 실습 2</strong> 에서 합니다.</div>
  <div><strong>D1에서 D2를 미리 언급하는 이유:</strong> “지금 구현하라”는 지시가 아니라, <strong>지금 만든 산출물이 다음에 어디에 쓰이는지</strong> 알려주는 연결 표시입니다. 공통 <code>activity-log/sessionize</code> 경로에서는 D1에 준비 산출물만 완성하고, 구현은 D2의 지정된 단계까지 보류합니다.</div>
  <div><strong>이틀 뒤 남는 것:</strong> Feature Spec Pack v1 · 검증 가능한 구현 · 로컬 리뷰 패킷 · Custom Skill/Agent · 전원 handoff 1건. Day 1에는 정식 발표 없이 메모만 쌓고, D2·S7에서 대표 3명이 공유하며 전원은 handoff를 제출합니다.</div>
</section>

<section>
  <h2>이 세션의 활동별 권장 모델</h2>
  <table>
    <caption>D1·S0 활동 · 책임 주체 · 권장 모델</caption>
    <thead><tr><th>활동</th><th>주체·과업군</th><th>권장 모델</th><th>한 줄 이유</th></tr></thead>

</section>

<section>
  <h2>미니강의 — 왜 환경 점검부터 하는가</h2>
  <p>이 과정은 <strong>로컬 전용(local-only, <span>HE-14</span>)</strong> 입니다. Codespaces·GitHub PR/Actions를 쓰지 않고 개인 PC의 VS Code·Git·Node에서 모든 실습을 합니다. 따라서 첫 시간에 환경이 흔들리면 이틀 내내 흔들립니다.</p>
  <div><strong>Local-only의 정확한 뜻:</strong> 코드 실행·테스트·검증·제출물은 로컬에서 만든다는 의미입니다. Copilot에 보내는 <em>질의 자체</em> 는 조직 정책에 따라 서비스로 전송될 수 있으므로, 고객정보·키/토큰·반출 금지 로그는 입력하지 않습니다(<span>OR-12</span> 데이터 경계 · <span>OR-13</span> 민감정보).<p></p></div>
  <h3>환경 점검·교정 스크립트 (Dev Container 없이)</h3>
  <p>참가자 PC마다 Node 버전·OS·전역 패키지가 달라 "제 PC에선 되는데요"가 반복됩니다. 이 과정은 현재 터미널의 환경을 직접 점검합니다. <code>setup-mac.sh</code> /<code>setup-windows.bat</code> 는 Node·git·VS Code를 확인하고, <code>labs</code> 10/2와 <code>activity-log</code> 5/2를 모두 smoke-test해야 READY로 판정합니다.</p>
</section>

<section>
  <h2>실습 — Smoke test &amp; baseline</h2>
  <div><div>STEP 1 · 도구 점검</div>
  <p>터미널에서 아래를 실행해 버전이 출력되는지 확인합니다(<span>EN-14</span>).</p>
<pre><code>code --version
git --version
node -v &amp;&amp; npm -v</code></pre></div>

  <div><div>STEP 2 · 환경 점검·교정 스크립트 실행</div>
  <p>컨테이너 없이, 현재 터미널에서 환경 점검·교정 스크립트를 실행합니다. 누락 도구·구버전 Node를 자동으로 바로잡습니다.</p>
<pre><code># macOS
bash setup-mac.sh           # 점검 + 자동 교정
# Windows (명령 프롬프트)
setup-windows.bat           # 점검 + 자동 교정
# 교정 없이 점검만: --check</code></pre></div>

  <div><div>STEP 3 · baseline 테스트 &amp; 실습 브랜치</div>
  <p>지금 통과하는 상태를 기록해 둬야 나중에 "내가 깬 건지 원래 그런지" 알 수 있습니다.</p>
<pre><code>npm test                          # baseline 결과를 메모
git checkout -b lab/copilot-workbook   # 로컬 전용 브랜치 (OR-15)
git status</code></pre></div>

  <div><div>STEP 4 · Copilot 동작 확인</div>
  <p>Copilot Chat(<span>CF-01</span>)에 한 줄 질의해 응답이 오는지, Inline 제안(<span>CF-11</span>)이 뜨는지 확인합니다. Chat은 Agent 모드가 안 될 때 1차 fallback 경로입니다.</p></div>
  <div><strong>VS Code Copilot 기능 전체 지도:</strong> 환경이 준비됐으면, VS Code에서 쓸 수 있는 Copilot 기능(채팅 표면 · Agent/Plan/Ask · 자동완성 · 컨텍스트 · 도구/MCP · 커스터마이징 등)을 <a href="../program-sessions-2026-06-27/docs/vscode-features.html" target="_blank" rel="noopener noreferrer">VS Code Copilot 기능 가이드</a> 에서 한눈에 확인하세요.</div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>프로젝트 루트에서 환경·테스트 명령을 직접 실행한다.</li><li><code>pass / skip / fail</code> 을 구분하고 되돌아올 baseline을 기록한다.</li><li>실패가 있으면 구현을 시작하지 않고 환경 또는 실행 위치부터 교정한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>준비도: GREEN
baseline: 5 pass / 2 skip / 0 fail
workspace: sample-project-activity-log
다음 checkpoint: d1-s1</code></pre><p>명령 출력 문구는 Node 버전에 따라 달라도 세 상태와 프로젝트 루트가 같으면 됩니다.</p></div>
  </div>
  <div><strong>예시 해석:</strong> skip 2개는 성공도 결함도 아닌 Day2의 미실행 학습 경로입니다. 이 세션에서는 <code>fail 0</code> 과 재현 가능한 baseline이 핵심입니다.</div>
</section>

<section>

  <ul>
    <li>Node 18 미만으로 테스트 실패 → 교정 모드(<code>--check</code> 없이)로 다시 실행해 자동 업그레이드합니다.</li>
    <li>baseline을 안 남기고 바로 코드 변경 → 회귀 판단 불가. 반드시 STEP 3을 먼저.</li>

<section>
  <h2>공유 포인트 (D2·S7로 연결)</h2>
  <div>오늘의 환경 상태(Green/Yellow/Red)와 막힌 지점을 <strong>한 줄</strong> 로 기록하세요. 마지막 날 "환경 셋업에서 무엇이 어려웠고 어떻게 풀었는가"는 동료에게 가장 도움이 되는 공유 주제입니다.</div>
</section>

<section>
  <h2>실습 예제 시나리오 — 결제(부가세) 기능</h2>
  <p>Day1 미니강의는 <strong>설명 예제</strong> 로 결제 VAT 계산(<code>calcVat()</code>)을 씁니다. 그러나 학생이 직접 작성하고 16개 checkpoint로 검증받는 산출물은 전원 공통 <code>sample-project-activity-log/sessionize</code> 입니다.</p>
  <table>
    <caption>결제(부가세) 예제 — 무엇 · 규칙 · 언제 쓰나</caption>
    <thead><tr><th>구분</th><th>내용</th></tr></thead>
    <tbody>
      <tr><td><strong>무슨 기능</strong></td><td>주문/청구 금액에 대해 부가세를 계산하는 순수 함수 <code>calcVat(금액, 옵션)</code>.</td></tr>
      <tr><td><strong>규칙(도메인)</strong></td><td>일반 품목 <strong>VAT 10%</strong> · 면세 품목(도서·일부 식품 등) <strong>VAT 0%</strong> · 음수 금액은 <strong>오류</strong> (방어).</td></tr>
      <tr><td><strong>언제 쓰나(실무)</strong></td><td>이커머스 장바구니 결제, 구독 청구서, POS 영수증, 정산 배치 — <strong>최종 청구액을 확정할 때</strong> 세금을 계산. 예: 장바구니 합계 = 상품가 + <code>calcVat(상품가)</code>.</td></tr>
      <tr><td><strong>왜 예제로 좋나</strong></td><td>규칙이 명확해 AC(정상 10%·예외 음수·경계 면세 0)가 자연스럽고, <strong>순수 함수</strong> 라 로컬 테스트가 쉬우며, "세금 오류 = 돈·신뢰 문제"라 <strong>회귀 리스크</strong> 가 실감납니다.</td></tr>
    </tbody>
  </table>
  <div><strong>두 가지 역할 구분:</strong> ① <strong>설명 데모</strong> = <code>labs/calcVat</code> 10/2. ② <strong>학습 checkpoint</strong> = 전원 공통 <code>sample-project-activity-log</code> 5/2에서 시작해 7/0까지 진행. 개인 프로젝트 적용은 공통 GREEN 후 또는 D+7입니다.</div>
</section>

<section>
  <h2>이 세션의 실행 코드 (Hands-on)</h2>
  <p>이 세션의 목표는 <strong>오늘 실습을 시작할 수 있는 로컬 baseline</strong> 을 만드는 것입니다. 아래 세 명령으로 (1) 환경 준비도를 점검하고, (2) 통과 상태(baseline)를 기록하고, (3) 작업 브랜치를 팝니다.</p>
  <div><strong>두 baseline을 구분해 확인:</strong> setup readiness는 labs와 activity-log를 모두 보고, 학습 checkpoint는 activity-log의 5/2/0을 사용합니다.</div>
<pre><code>cd labs
npm run env      # ① 환경 준비도 자가 점검 (Green/Yellow/Red)
npm test         # 설명 데모 baseline: 10/2/0
cd ../sample-project-activity-log
npm run lab -- doctor                  # 학습 baseline: 5/2/0
npm run lab -- check d1-s0
git checkout -b lab/copilot-workbook</code></pre>

<template id="embedded-source-002"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>P31</strong><span>AI 보조 SDLC 플레이북</span><span>6. End-to-End Lifecycle</span></p><section>
      <h2>6. End-to-End Lifecycle</h2>
      <p>전주기 lifecycle은 discover, align, scope, design, build, verify, review, release-readiness, operate, learn 순서로 관리한다. 각 phase는 workshop day와 맞물리지만, 실제 운영에서는 반복 loop로 돌아간다.</p>
      <div>
        <div><h3>Discover → Align → Scope</h3><p>문제 정의, 이해관계자 조정, 우선순위, success metric, excluded scope를 정한다. Day 1의 대부분이 여기에 해당한다.</p></div>
        <div><h3>Design → Build → Verify</h3><p>설계 대안, scaffold, build loop, tests, static checks를 정한다. Day 2의 중심이며 AI builder와 developer가 함께 움직인다.</p></div>
        <div><h3>Review → Release-readiness</h3><p>human review, QA, security reviewer, publish gate, rollback owner, release checklist를 통과시킨다.</p></div>
        <div><h3>Operate → Learn</h3><p>runbook, on-call handoff, SLI/SLO, incident 대응, retro, backlog refresh로 닫힌 루프를 완성한다.</p></div>
      </div>
      <div>Shift-left 강조(역할 피드백 반영): value, quality, security, operability의 씨앗은 Discover/Align 단계에서 함께 심는다. 품질 약속은 비전에서, 데이터 경계는 첫날 대화에서, 운영 성공지표는 align 단계에서 미리 드러내 후반 재작업을 줄인다. 근거는 companion <code>output/031-feedback-ai-assisted-sdlc-workshop-role-feedback-2026-06-27.html</code> 의 주관적 체감이며 factual verification이 아니다.</div>
    </section></article></template>

<template id="embedded-source-004"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>P31</strong><span>AI 보조 SDLC 플레이북</span><span>8. Phase Matrix</span></p><section>
      <h2>8. Phase Matrix</h2>
      <p>요청한 table shape를 그대로 맞추기 위해 background, process, practices, input, execution, output, check, rollback을 같은 matrix에 둔다.</p>

<template id="embedded-source-005"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C53</strong><span>SDLC 하네스 실제 사례</span><span>SWE-agent — Agent-Computer Interface(ACI)가 성능을 만든다</span></p><div><div><div>CASE B1 · 논문 + 원본 코드</div><h3>SWE-agent — Agent-Computer Interface(ACI)가 성능을 만든다</h3><div><span>NeurIPS 2024</span> <span>윈도우드 파일뷰어</span> <span>edit lint 게이트</span> <span>단일 YAML</span></div></div><div><p>📦 <b>공개 저장소:</b> <a href="https://github.com/SWE-agent/SWE-agent" target="_blank" rel="noopener noreferrer">SWE-agent/SWE-agent</a> · <a href="https://github.com/SWE-agent/mini-swe-agent" target="_blank" rel="noopener noreferrer">SWE-agent/mini-swe-agent</a></p>
<p><b>개요.</b> Princeton의 SWE-agent(<code>arXiv:2405.15793</code>)는 "같은 LM이라도 <b>인터페이스 설계</b> 가 소프트웨어 작업 성능을 좌우한다"는 걸 보인 대표 연구다. 사람에게 HCI가 있듯 LM에게는 <b>ACI(Agent-Computer Interface)</b> 가 필요하다. 날것의 셸은 노이즈가 많고 되돌리기 어려운 실수를 유발하므로, ACI는 ① 행동 공간을 잘 정의된 도구로 <b>제약</b> ② 윈도우드 뷰·린트·state JSON으로 <b>구조화된 피드백</b> ③ <b>검증 게이트</b> (편집 시 린트) ④ <code>CURRENT_FILE/LINE/WINDOW</code> 로 <b>상태 유지</b> 를 한다. 이 모든 게 단일 <code>.yaml</code> 로 구동된다.</p>
<div><b>성과(논문 Table 1 · SWE-bench full).</b> RAG 베이스라인은 GPT-4 Turbo ~1.31% · Claude 3 Opus ~3.79%인데, SWE-agent가 GPT-4 Turbo에서 ~12.47%(Lite 18%), Claude 3 Opus에서 ~10.46%(Lite 13%)로 향상. 논문은 이 격차의 상당 부분을 모델이 아니라 <b>ACI 설계</b> 로 귀속한다. <span>검증</span> arXiv:2405.15793 Table 1 대조 완료.</div>
<h4>하네스 = 설정 파일 (config/default.yaml)</h4>
<pre><code><span>agent:</span>
  <span>templates:</span>
    <span>system_template:</span> <span>|-
      You are a helpful assistant that can interact with a computer to solve tasks.
</span>    <span>instance_template:</span> <span>|-
      &lt;pr_description&gt;{{problem_statement}}&lt;/pr_description&gt;
      Follow these steps:
      1. find and read code relevant to the PR
      2. create a script to reproduce the error, run `python &lt;file.py&gt;` to confirm
      3. edit the source to resolve the issue
      4. rerun your reproduce script and confirm the fix
      5. think about edge cases and handle them
</span>    <span>next_step_template:</span> <span>|-
      OBSERVATION:
      {{observation}}          # 모든 도구 출력이 OBSERVATION 으로 래핑됨(피드백 루프)
</span>  <span>tools:</span>
    <span>env_variables:</span>             <span># 대화형 페이저에 갇히지 않게 샌드박싱</span>
      <span>PAGER:</span> <span>cat</span>
      <span>GIT_PAGER:</span> <span>cat</span>
      <span>PIP_PROGRESS_BAR:</span> <span>'off'</span>
    <span>bundles:</span>                   <span># 도구 = 번들 디렉터리(격리 단위)</span>
      <span>-</span> <span>path:</span> <span>tools/registry</span>
      <span>-</span> <span>path:</span> <span>tools/edit_anthropic</span>
      <span>-</span> <span>path:</span> <span>tools/review_on_submit_m</span>
    <span>registry_variables:</span>
      <span>USE_FILEMAP:</span> <span>'true'</span>      <span># 윈도우드/요약 파일뷰 토글 = ACI 컨텍스트 층</span>
    <span>enable_bash_tool:</span> <span>true</span>
    <span>parse_function:</span>
      <span>type:</span> <span>function_calling</span>
  <span>history_processors:</span>
    <span>-</span> <span>type:</span> <span>cache_control</span>      <span># 마지막 2메시지 프롬프트 캐싱(비용/관측)</span>
      <span>last_n_messages:</span> <span>2</span></code></pre>
<h4>검증 게이트 — edit 시 flake8, 깨지면 자동 롤백</h4>
<p>ACI의 백미. 파이썬 파일을 편집하면 flake8을 돌려 <b>새 문법 오류가 생기면 편집을 적용하지 않고</b> 원본을 복구하며, 에이전트에게 "적용했다면 이랬을 버전"과 "원본"을 모두 보여준다. 파괴적 커밋을 막는 사전 검사다.</p>
<pre><code><span># @yaml signature: edit &lt;start_line&gt;:&lt;end_line&gt; \n &lt;replacement&gt; \n end_of_edit</span>
<span># docstring: Python files are syntax-checked after edit. On error the edit is NOT applied.</span>
<span><span>edit</span></span>() {
    <span>local</span> linter_cmd=<span>"flake8 --isolated --select=F821,F822,F831,E111,E112,E113,E999,E902"</span>
    <span>local</span> linter_before_edit=$(<span>$linter_cmd</span> <span>"<span>$CURRENT_FILE</span>"</span> 2&gt;&amp;1)
    <span># ... apply replacement ...</span>
    <span>if</span> [[ <span>$CURRENT_FILE</span> == *.py ]]; <span>then</span>
        _lint_output=$(<span>$linter_cmd</span> <span>"<span>$CURRENT_FILE</span>"</span> 2&gt;&amp;1)
        lint_output=$(_split_string <span>"<span>$_lint_output</span>"</span> <span>"<span>$linter_before_edit</span>"</span> ...)
    <span>fi</span>
    <span>if</span> [ -z <span>"<span>$lint_output</span>"</span> ]; <span>then</span>
        <span>export</span> CURRENT_LINE=<span>$start_line</span>; _constrain_line; _print
        <span>echo</span> <span>"File updated. Please review the changes..."</span>
    <span>else</span>
        <span>echo</span> <span>"Your proposed edit has introduced new syntax error(s)..."</span>
        <span>echo</span> <span>"ERRORS:"</span>; <span>echo</span> <span>"<span>$lint_output</span>"</span>
        <span>cp</span> <span>"/root/<span>$(basename <span>"<span>$CURRENT_FILE</span>"</span>)</span>_backup"</span> <span>"<span>$CURRENT_FILE</span>"</span>   <span># 원본 복구</span>
        <span>echo</span> <span>"Your changes have NOT been applied. Please fix and try again."</span>
    <span>fi</span>
}</code></pre><p>또한 <code>open</code> /<code>_print</code> 는 WINDOW 크기 슬라이스와 "(N more lines above/below)"를 보여주고, 연속 스크롤 3회 이상이면 "비효율적이니 search_file을 쓰라"는 anti-thrash 경고를 낸다. 모든 액션 뒤 <code>_state</code> 가 <code>{"open_file":..., "working_dir":...}</code> JSON을 찍어 프롬프트에 현재 위치를 주입한다.</p>

<template id="embedded-source-006"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>H21</strong><span>하네스 역사와 핵심 개념</span><span>3. Harness Engineering Concept Model</span></p><section>
      <h2>3. Harness Engineering Concept Model</h2>
      <p><strong>Harness</strong> 가 대상 주변의 실행 장치라면, <strong>Harness Engineering</strong> 은 그 장치를 반복적으로 설계·측정·개선하는 일이다. 고전적 test harness의 driver, stub, fixture, runner 원리는 현대 AI-agent 환경에서 prompt와 context, model과 tool, memory와 state, external action, human approval, rollback까지 확장된다.</p>
      <div>target system or agent goal
  -&gt; driver/adapter: input, fixture, mock, stub, tool wrapper
  -&gt; execution environment: runner, pipeline, sandbox, model/runtime, retry budget
  -&gt; observation: logs, traces, metrics, artifacts, cost telemetry
  -&gt; assertion/evaluation: unit assertion, integration check, benchmark, LLM evaluator, human review
  -&gt; policy gate: permission, source boundary, compliance rule, budget, No-Go trigger
  -&gt; audit/rollback: decision log, release record, rollback owner, RTO, completion criteria</div>
      <div>
        <div><h3>Driver / Adapter</h3><p>테스트 대상이나 agent를 직접 바꾸지 않고도 입력, fixture, mock, stub, tool call을 통제한다.</p></div>
        <div><h3>Observation Layer</h3><p>unit test result부터 CI log, trace, metric, cost telemetry, model output artifact까지 실행의 흔적을 남긴다.</p></div>
        <div><h3>Executable Gate</h3><p>assertion, benchmark, policy rule, <code>scripts/check_*.py</code>, package script가 구조적 누락과 금지 조건을 검증한다.</p></div>
        <div><h3>Audit Trail</h3><p><code>rounds</code> 와 ADR은 왜 이 판단을 했고 어떤 실패를 고쳤는지 다음 세션이 이어받을 수 있게 만든다.</p></div>
        <div><h3>Operations Loop</h3><p>SLI/SLO, breach action, No-Go trigger, owner를 두어 산출물 품질을 회고 가능한 운영 지표로 바꾼다.</p></div>
        <div><h3>Rollback Layer</h3><p>잘못된 공개, stale claim, 민감정보 노출, checker 실패가 생겼을 때 누가 언제까지 무엇으로 되돌리는지 고정한다.</p></div>
      </div>
    </section></article></template>
<template id="embedded-source-007"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>V52</strong><span>Copilot VS Code 기능 가이드</span><span>11. 변경 검토와 안전 장치</span></p><section>
      <h2>11. 변경 검토와 안전 장치</h2>
      <p>AI가 파일을 바꾼 뒤에는 반드시 검토하고 수락/폐기한다. VS Code는 이를 돕는 장치를 제공한다.</p>

        <div><h3>Checkpoints</h3><p>채팅 도중 주요 시점의 파일 스냅샷을 자동 생성해 이전 상태로 롤백.</p></div>
        <div><h3>Stage to accept</h3><p>Source Control에서 스테이지하면 대기 편집을 수락, 폐기하면 대기 편집도 폐기.</p></div>

        <li><strong>관리자 정책</strong>: 에이전트 능력, MCP 서버/확장 제한, 컴플라이언스 강제로 통제된 기본 경험 제공.</li>

      <h3>문제 진단</h3>

<template id="embedded-source-008"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>H21</strong><span>하네스 역사와 핵심 개념</span><span>1. Scope and Read Boundary</span></p><section>
      <h2>1. Scope and Read Boundary</h2>
      <div>
        <div>
          <h3>읽어야 하는 것</h3>
          <ul>
            <li><strong>Fact</strong>: 공식 문서, 표준/용어집, 도구 문서, source set에 직접 확인되는 날짜·상태·정의.</li>
            <li><strong>Interpretation</strong>: test harness, CI/CD, observability, evaluation, agent control plane을 연결하는 계보 해석.</li>
            <li><strong>Forecast</strong>: 앞으로 AI-agent harness가 강화될 방향에 대한 제안과 전망.</li>
          </ul>
        </div>
        <div>
          <h3>읽지 말아야 하는 것</h3>
          <ul>
            <li>이 문서를 “하네스라는 말의 단일한 최초 등장 연도”를 증명하는 자료로 읽지 않는다.</li>
            <li>CI/CD, SRE, LLM eval을 모두 같은 의미의 harness라고 단정하지 않는다.</li>
            <li>checker 통과를 전문가 검토나 사실 확인의 대체로 읽지 않는다.</li>
            <li>rounds 수나 agent 수를 품질 보증으로 읽지 않는다.</li>
          </ul>
        </div>
        <div>
          <h3>Confidence Label</h3>
          <ul>
            <li><strong>High</strong>: 인용한 공식·표준·도구 문서 또는 로컬 파일이 직접 지지한다.</li>
            <li><strong>Medium</strong>: 여러 산출물의 반복 패턴이 지지하지만 해석이 포함된다.</li>
            <li><strong>Speculative</strong>: 방향성 제안이며 운영 실험과 reviewer가 필요하다.</li>
          </ul>
        </div>
      </div>
      <div>이 보고서는 <code>web source set</code>, <code>output report</code>, <code>ref source set</code>, <code>rounds audit trail</code>, <code>scripts/check_*.py executable gate</code>, <code>metaplan/ADR operating contract</code> 를 서로 다른 근거 유형으로 구분한다. 같은 문장 안에서도 Fact, Interpretation, Forecast를 섞지 않는 것이 핵심 규칙이다.</div>
    </section></article></template>

<section>

  <p>Copilot은 한 번에 처리할 수 있는 <strong>컨텍스트 윈도우</strong> (<span>PT-12</span>)가 정해져 있습니다. 불필요한 파일을 잔뜩 넣으면 ① 비용이 오르고(<span>HE-12</span> cost burn), ② 정작 중요한 코드가 묻혀 정확도가 떨어집니다. 좋은 컨텍스트 관리(<span>PT-02</span>)는 <strong>비용과 품질을 동시에</strong> 잡습니다.</p>

      <h2>2. 프롬프팅과 컨텍스트 설계 최적화</h2>
      <p>프롬프트 최적화는 “길고 정성스러운 지시문”만의 문제가 아니다. 주요 공급자 문서 기준으로는 재사용 가능한 prefix, 명확한 출력 스키마, 도구 인자, 평가셋이 운영 안정성과 비용·지연 관리에 큰 영향을 준다. <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-openai-prompt" target="_blank" rel="noopener noreferrer">S1</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-anthropic-prompt" target="_blank" rel="noopener noreferrer">S2</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-google-prompt" target="_blank" rel="noopener noreferrer">S3</a></p>

      <div>
        <div>
          <h3>구조: 시스템 → 정적 컨텍스트 → 도구 정의 → 동적 입력</h3>
          <ul>
            <li>주요 공급자(OpenAI / Anthropic / Google)는 <em>프롬프트 캐싱</em> 또는 <em>컨텍스트 캐싱</em> 계열 기능을 제공한다. 반복 prefix 비율과 캐시 hit rate가 높을수록 비용·지연 절감 가능성이 커지지만, 절감률은 공급자 가격 정책·모델·TTL·요청 구조에 따라 달라진다. <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-openai-caching" target="_blank" rel="noopener noreferrer">S4</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-anthropic-caching" target="_blank" rel="noopener noreferrer">S5</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-google-caching" target="_blank" rel="noopener noreferrer">S6</a></li>
            <li>따라서 “긴 시스템 + 변하지 않는 RAG 컨텍스트 + 도구 스키마”를 앞에, 매번 바뀌는 사용자 입력은 <strong>맨 뒤</strong> 에 둔다.</li>
            <li>같은 요청을 여러 번 보낼 때는 캐시 TTL(보통 분 단위)을 의식해서 묶어 보내야 한다.</li>
          </ul>
        </div>
        <div>
          <h3>출력 강제: 자유 텍스트보다 스키마</h3>
          <ul>
            <li>JSON 모드 / Structured Outputs / Tool 인자 형태로 받으면 파서 오류와 후처리 예외를 줄일 수 있다. 단, 의미 오류와 거부 응답은 애플리케이션 검증으로 처리한다. <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-openai-structured" target="_blank" rel="noopener noreferrer">S9</a></li>
            <li>스키마가 곧 검증이고, 검증이 곧 회귀 테스트의 입력이 된다.</li>
            <li>“네/아니오” 분류조차 단어 한 개 자유 출력보다 <code>{"answer": "yes"}</code> 스키마가 안전하다.</li>
          </ul>
        </div>
        <div>
          <h3>예시(few-shot)와 사고연쇄(CoT)</h3>
          <ul>
            <li>일반 모델: few-shot 예시는 작업 형식과 판단 기준을 안정화하는 데 도움이 될 수 있다. 효과는 예시 품질·순서·작업 유형에 따라 달라진다. <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-cot" target="_blank" rel="noopener noreferrer">S11</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-self-consistency" target="_blank" rel="noopener noreferrer">S12</a></li>

            <li>일반 모델에서 분류·추출 같은 단순 작업에는 CoT를 강요하지 않는다(지연·비용만 증가).</li>
          </ul>
        </div>
        <div>
          <h3>긴 컨텍스트 다루기</h3>
          <ul>
            <li>긴 컨텍스트 모델이 늘었지만, 관련 정보의 위치가 성능에 영향을 줄 수 있다는 연구가 있다. 핵심 자료는 앞·뒤에 배치하고 평가셋으로 확인한다. <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-lost-middle" target="_blank" rel="noopener noreferrer">S17</a></li>

<template id="embedded-source-013"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>T40</strong><span>토큰 수요와 모델 라우터 보고서</span><span>3) 원문 핵심 요지</span></p><section>
      <h2>3) 원문 핵심 요지</h2>
      <p><strong>원문 thesis:</strong> 토큰 단가는 하락하고 있지만, 기업이 체감하는 AI 비용은 커지고 있다. 이유는 AI가 채팅형 단일 응답에서 에이전트형 장기 작업으로 이동하면서, 한 번의 사용자 요청이 많은 내부 추론, 검색, 파일 읽기, 수정, 테스트, 재시도 호출로 증폭되기 때문이다.</p>
      <table>
        <thead><tr><th>원문 주장</th><th>해석</th><th>연결 근거</th></tr></thead>
        <tbody>
          <tr><td>GPT-3.5급 inference cost는 큰 폭으로 하락했다.</td><td>단가 하락은 사실이다. 하지만 총 비용은 단가와 사용량의 곱이다.</td><td>Stanford AI Index 2025: GPT-3.5급 MMLU 성능 기준 2022년 11월 $20/M tokens에서 2024년 10월 $0.07/M tokens로 하락.</td></tr>
          <tr><td>기업 AI 비용 압박의 본질은 단가보다 사용량이다.</td><td>AI가 조직 workflow에 박히며 사용 빈도와 작업 길이가 폭증한다.</td><td>Deloitte: 토큰 단가는 내려가도 전체 enterprise AI spend와 scale은 상승.</td></tr>
          <tr><td>에이전트 호출은 내부적으로 작은 LLM 호출 공장처럼 동작한다.</td><td>계획, 검색, 도구 호출, 검증, 재시도가 모두 별도 토큰을 만든다.</td><td>OpenRouter: prompt length 약 4배, completion 약 3배 증가, programming이 prompt growth의 큰 동인. 단, OpenRouter 단일 플랫폼 관측치이며 metadata/category sample 한계가 있다.</td></tr>

          <tr><td>필요한 것은 "싼 모델로 일괄 교체"가 아니라 똑똑한 LLM Router다.</td><td>작업별 모델, 컨텍스트, 캐시, 메모리, escalation을 조합해야 한다.</td><td>OpenRouter/a16z: multi-model ecosystem, agentic inference, model-workload fit.</td></tr>
        </tbody>
      </table>

<template id="embedded-source-014"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>M44</strong><span>모델 선택 기준의 진화</span><span>12. 모델 컨텍스트 창 · compaction/새 세션 신호</span></p><section>
    <h2>12. 모델 컨텍스트 창 · compaction/새 세션 신호</h2>
    <p>결론부터: <strong>“compaction이 일어나는 컨텍스트 사용 %”는 모델별 상수가 아니라 <em>하네스/툴 수준의 임계값</em></strong> 이다. 모델별로 다른 것은 <strong>컨텍스트 창의 크기(토큰)</strong> 이고, compaction·새 세션을 트리거하는 <strong>%</strong> 는 사용하는 도구(이 워크스페이스, Claude Code, VS Code Copilot)가 정한다. 그래서 아래를 두 축으로 나눠 제시한다.</p>

    <div>
      <strong>이 워크스페이스의 신호(권위 있음):</strong> <code>metaplan-v3</code> 계약은 <strong>컨텍스트 사용 50% 초과가 예상되면 split · compaction · sub-agent delegation 중 하나를 선택</strong> 하도록 규정한다(§0-7, §운영 원칙). 즉 <strong>이 시스템에서 compaction/새 세션의 1차 신호는 50%</strong> 이며, CS-Choi가 그 판단을 owner로 가진다.
    </div>

    <h3>축 A — compaction/요약 트리거 %는 툴이 정한다</h3>
    <table>
      <thead><tr><th>도구/하네스</th><th>트리거 동작</th><th>공개된 임계</th><th>출처</th></tr></thead>
      <tbody>
        <tr><td><strong>이 워크스페이스(AI Build 팀)</strong></td><td>50% 초과 예상 시 split/compaction/sub-agent</td><td><strong>50%</strong> (명시 규약)</td><td>metaplan-v3.md</td></tr>
        <tr><td><strong>Claude Code</strong></td><td>auto-compaction: 컨텍스트 한계에 <em>근접</em> 하면 대화 기록을 요약</td><td>고정 % 미공개(“approaching context limits”)</td><td>docs.claude.com/claude-code/costs</td></tr>
        <tr><td><strong>VS Code Copilot</strong></td><td>컨텍스트 창 유지 위해 대화 기록 자동 요약 + checkpoints로 롤백</td><td>고정 % 미공개</td><td>VS Code Docs(Using chat)</td></tr>
      </tbody>
    </table>
    <div>
      <strong>중요:</strong> GitHub Copilot 공식 <em>Supported AI models</em> 페이지의 현재 본문에서 모델별 토큰 한도나 “compaction이 몇 %에서 일어난다”는 상수를 확인하지 못했다. 따라서 공급자 context window, Copilot surface별 실제 한도, tool-level compaction 임계를 서로 분리하고, 확인되지 않은 숫자는 쓰지 않는다.
    </div>

    <h3>축 B — 모델별 컨텍스트 창 크기(같은 %라도 절대 토큰이 다름)</h3>
    <table>
      <thead><tr><th>공급자/모델(현행)</th><th>GitHub 표기</th><th>공급자 스펙 창(참고)</th><th>50% 지점 ≈ 절대 토큰</th></tr></thead>
      <tbody>
        <tr><td>Anthropic Claude Opus/Sonnet(4.x·5)</td><td>“Larger context window” 라벨(정성)</td><td>최대 <strong>1M 토큰</strong> (구형 200k)</td><td>1M 기준 ≈ 500k / 200k 기준 ≈ 100k</td></tr>
        <tr><td>Google Gemini 2.5 Pro·3.x</td><td>정성 라벨</td><td><strong>1M 토큰</strong> 급</td><td>≈ 500k</td></tr>
        <tr><td>OpenAI GPT-5.x / GPT-5.6</td><td>모델명·surface 지원 표</td><td>공급자와 Copilot surface별 실제 한도 확인 필요</td><td>도구가 허용한 창 크기에 비례</td></tr>
        <tr><td>Moonshot Kimi-K2.7-Code</td><td>정성 라벨</td><td>공급자 공개값 확인 필요</td><td>창 크기에 비례</td></tr>
      </tbody>
    </table>
    <p>해석: 창이 큰 모델(예: Gemini 1M, Claude 1M)은 <strong>같은 50%라도 훨씬 많은 토큰</strong> 을 담는다. 그러나 “긴 컨텍스트일수록 중간 내용 회수율이 떨어지는(lost-in-the-middle) 현상”이 있어, 창이 크다고 100%까지 채우는 것은 권장되지 않는다. Copilot은 내부적으로 창을 표준화·상한할 수 있어 공급자 스펙과 다를 수 있다.</p>

    <h3>운영 플레이북 — 언제 compact / 새 세션?</h3>
    <div>
      <div><h3>~40–50%: 소프트 신호</h3><p>checkpoint 생성, 불필요한 첨부·도구 출력 정리, 핵심만 남긴 요약 준비. (이 워크스페이스 규약의 1차 임계)</p></div>
      <div><h3>~50–70%: compaction</h3><p>대화 요약/compaction 실행 또는 sub-agent에 위임해 컨텍스트 오프로드. 결정·미결 항목·파일 경로만 이월.</p></div>
      <div><h3>~70–85%+: 새 세션</h3><p>요약본을 시드로 <strong>새 세션 시작</strong>. 회수율 저하·지연·품질 저하가 관측되면 % 무관하게 즉시 전환.</p></div>
    </div>
    <div>
      <strong>모델 선택과의 연결:</strong> 긴 입력이 불가피한 Analysis/대형 코드 태스크는 <em>창이 큰 모델</em> (Gemini 1M·Claude 1M)을 고르되, compaction 임계는 여전히 50% 규약을 적용한다. 즉 <strong>“큰 창 = 늦게 compact”가 아니라 “큰 창 = 같은 %에서 더 많은 실질 컨텍스트”</strong> 로 이해한다.
    </div>

    <h3>컨텍스트 팩트 원장 (numeric/status)</h3>
    <table>
      <thead><tr><th>claim_id</th><th>주장(exact_text)</th><th>출처</th><th>verification_status</th><th>TTL(일)</th></tr></thead>
      <tbody>
        <tr><td>CTX1</td><td>이 워크스페이스는 컨텍스트 50% 초과 예상 시 split/compaction/sub-agent를 선택하는 명시 규약을 가진다</td><td>metaplan-v3.md(내부 규약)</td><td>verified</td><td>30</td></tr>
        <tr><td>CTX2</td><td>GitHub Copilot Supported models 현재 본문에서 모델별 context token 한도와 compaction % 상수를 확인하지 못했다</td><td>GitHub Docs Supported models</td><td>verified-limited</td><td>7</td></tr>
        <tr><td>CTX3</td><td>Claude Code는 “컨텍스트 한계 근접 시 대화 기록을 요약하는 auto-compaction”을 수행하며 고정 %는 문서에 미공개</td><td>docs.claude.com/claude-code/costs</td><td>verified</td><td>30</td></tr>
        <tr><td>CTX4</td><td>Anthropic Claude 최신 모델의 컨텍스트 창은 최대 1M 토큰(구형 200k)</td><td>docs.claude.com models overview</td><td>verified</td><td>30</td></tr>
      </tbody>
    </table>
    <div>
      <strong>재검증 경계:</strong> “모델별 compaction %”는 벤더가 공개하는 상수가 아니라 <strong>도구 임계 + 창 크기의 조합</strong> 이다. 여기서 제시한 40/50/70–85% 밴드는 metaplan-v3의 50% 규약에 기반한 <strong>운영 휴리스틱</strong> 이며 벤더 공개값이 아니다. 공급자 창 토큰 수·Copilot 내부 상한·툴별 임계는 자주 바뀌므로 발표 전 각 공식 문서로 재확인한다. (GitHub 모델 문서 재확인 2026-07-10 KST)
    </div>

<template id="embedded-source-015"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C53</strong><span>SDLC 하네스 실제 사례</span><span>Aider — tree-sitter repo map · reflection loop · auto-commit</span></p><div><div><div>CASE B3 · 원본 코드</div><h3>Aider — tree-sitter repo map · reflection loop · auto-commit</h3><div><span>PageRank repo map</span> <span>auto-lint/test</span> <span>git 감사추적</span> <span>reflection≤3</span></div></div><div><p>📦 <b>공개 저장소:</b> <a href="https://github.com/Aider-AI/aider" target="_blank" rel="noopener noreferrer">Aider-AI/aider</a></p>
<p><b>개요.</b> Aider는 컨텍스트(<b>repo map</b>)와 검증(<b>lint/test reflection</b>)과 관측(<b>auto-commit</b>)을 코드로 붙인 CLI 페어프로그래머다. 핵심 하네스 3개가 모두 원본 파일에서 확인된다.</p>
<h4>하네스 ① 컨텍스트 — tree-sitter + PageRank repo map</h4>
<p>모든 파일을 tree-sitter로 파싱해 정의(def)/참조(ref) 태그를 뽑고, "A가 B에 정의된 심볼을 참조" 간선의 <b>MultiDiGraph</b> 를 만든 뒤 <b>PageRank(personalization)</b> 로 중요한 심볼만 골라 <b>토큰 예산(기본 1024)</b> 에 맞춰 이진 탐색으로 채운다. 채팅에 올린 파일은 가중치를 크게 부스트.</p>
<pre><code><span>import</span> networkx <span>as</span> nx
G = nx.MultiDiGraph()                      <span># 노드=파일, 간선=심볼 참조</span>
<span>for</span> ident <span>in</span> idents:
    mul = <span>1.0</span>
    <span>if</span> ident <span>in</span> mentioned_idents:            mul *= <span>10</span>    <span># 대화에 언급되면 부스트</span>
    <span>if</span> ident.startswith(<span>"_"</span>):                mul *= <span>0.1</span>   <span># private 강등</span>
    <span>if</span> <span>len</span>(defines[ident]) &gt; <span>5</span>:              mul *= <span>0.1</span>   <span># 너무 흔하면 강등</span>
    <span>for</span> referencer <span>in</span> references[ident]:
        use_mul = <span>50</span> <span>if</span> referencer <span>in</span> chat_rel_fnames <span>else</span> <span>1</span>  <span># 채팅 파일 대부스트</span>
        <span>for</span> definer <span>in</span> defines[ident]:
            G.add_edge(referencer, definer, weight=num_refs*use_mul, ident=ident)
<span># 이후 PageRank(personalization=100/num_nodes for chat files) -&gt; 토큰예산 이진탐색</span></code></pre>
<h4>하네스 ② 검증 게이트 — lint/test → reflection(최대 3회)</h4>
<p>편집·auto-commit 후 <b>린트/테스트를 돌려</b> 실패 출력을 <code>reflected_message</code> 로 LLM에 되먹여 재편집시킨다. 무한루프를 막는 <code>max_reflections = 3</code> 상한이 하드코딩돼 있다.</p>
<pre><code><span>def</span> <span>run_one</span>(<span>self, user_message, preproc</span>):
    message = user_message
    <span>while</span> message:
        self.reflected_message = <span>None</span>
        <span>list</span>(self.send_message(message))         <span># 편집 -&gt; auto-lint/test</span>
        <span>if</span> <span>not</span> self.reflected_message:
            <span>break</span>
        <span>if</span> self.num_reflections &gt;= self.max_reflections:   <span># = 3</span>
            self.io.tool_warning(<span>"Only 3 reflections allowed, stopping."</span>)
            <span>return</span>
        self.num_reflections += <span>1</span>
        message = self.reflected_message          <span># lint/test 에러를 다시 LLM에게</span></code></pre><pre><code><span>def</span> <span>flake8_lint</span>(<span>self, rel_fname</span>):
    fatal = <span>"E9,F821,F823,F831,F406,F407,F701,F702,F704,F706"</span>
    cmd = [sys.executable, <span>"-m"</span>, <span>"flake8"</span>,
           <span>f"--select=<span>{fatal}</span>"</span>, <span>"--show-source"</span>, <span>"--isolated"</span>, rel_fname]
    result = subprocess.run(cmd, capture_output=<span>True</span>, text=<span>True</span>, cwd=self.root)
    errors = result.stdout + result.stderr
    <span>return</span> self.errors_to_lint_result(rel_fname, errors) <span>if</span> errors <span>else</span> <span>None</span></code></pre>
<h4>하네스 ③ 관측/복구 — auto-commit(감사추적)</h4>
<p>모든 AI 편집은 LLM이 생성한 메시지로 git 커밋된다(기본은 커밋 author를 <code>Name (aider)</code> 로 표기, <code>--attribute-co-authored-by</code> 지정 시 <code>Co-authored-by: aider</code> 트레일러 추가) → 되돌리기·감사가 커밋 단위로 가능. 편집 전 dirty 파일은 먼저 <code>dirty_commit()</code> 으로 깨끗한 베이스라인을 만든다.</p>
<pre><code><span>## .aider.conf.yml</span>
<span>model:</span> <span>anthropic/claude-sonnet-4-5-20250929</span>
<span>## Repo map (컨텍스트)</span>
<span>map-tokens:</span> <span>2048</span>
<span>map-refresh:</span> <span>auto</span>
<span>## Git (관측/복구)</span>
<span>auto-commits:</span> <span>true</span>
<span>dirty-commits:</span> <span>true</span>
<span>attribute-co-authored-by:</span> <span>true</span>
<span>## Lint &amp; Test (검증 게이트)</span>
<span>auto-lint:</span> <span>true</span>
<span>lint-cmd:</span>
  <span>-</span> <span>"python: flake8 --select=E,W,F --max-line-length=120"</span>
<span>auto-test:</span> <span>true</span>
<span>test-cmd:</span> <span>"pytest -x --tb=short"</span>
<span>## 항상 읽는 read-only 컨텍스트</span>
<span>read:</span>
  <span>-</span> <span>CONVENTIONS.md</span></code></pre><p><code>--read CONVENTIONS.md</code> 는 파일을 <b>수정 불가(read-only)</b> 로 고정하고 프롬프트 캐싱까지 켠다 — 팀 규칙을 항상 켜 두는 값싼 방법.</p><div><h4>팀 하네스 맥락 · 결과 · 에피소드</h4><ul><li><b>맥락:</b> 단독 메인테이너 Paul Gauthier가 <b>aider로 aider를 만듦</b> (궁극의 dogfooding). repo map은 tree-sitter AST + PageRank식 그래프 랭킹으로 토큰 예산에 맞춰 저장소 전체의 압축 지도를 LLM에 제공.</li><li><b>결과:</b> <i>(자가보고, git blame)</i> 릴리스마다 새 코드의 <b>70~80%를 aider가 작성</b> (v0.82.0 92%, v0.86.0 88%). 2024-05 SWE-bench Lite <b>26.3%</b> pass@1 SOTA(당시), lint·test 타당성 게이트 + 6회 재시도.</li><li><b>에피소드:</b> repo map은 구체적 실패에서 탄생 — "print를 전부 BarLog로 바꿔"라면 Foo 클래스와 BarLog 사용법을 함께 봐야 함. 구 ctags 방식은 사용자가 universal-ctags를 수동 설치하는 마찰로 폐기. 약한 모델은 "repo map을 편집 가능한 소스로 착각"해 기본 비활성.</li></ul><p>💰 <b>토큰 절약 포인트:</b> <b>저장소 전체를 토큰 예산에 맞춰 압축</b> 하는 게 repo map의 본질이다. tree-sitter로 뽑은 심볼 그래프에 <b>PageRank</b> 를 걸어 중요한 정의/참조만 고르고, <b>토큰 예산(기본 1024~2048)</b> 에 맞을 때까지 <b>이진 탐색</b> 으로 넣고 뺀다 — 대형 코드베이스를 통째로 주입하지 않고 "가장 관련 있는 심볼 지도"만 준다. <code>--read CONVENTIONS.md</code> 같은 read-only 파일은 <b>프롬프트 캐싱</b> 으로 반복 청구를 줄인다. 약한 모델은 map을 편집 대상으로 착각하므로 <b>기본 비활성</b> 해 불필요한 큰 컨텍스트와 오작동 재시도를 함께 없앤다.</p><p><b>보강 출처</b> · web: aider.chat(2023/10/22/repomap·docs/faq·2024/05/22/swe-bench-lite) · 내부: 023</p></div><div><b>출처</b> · aider.chat/docs/repomap · /docs/usage/lint-test · /docs/usage/conventions · raw.githubusercontent.com/Aider-AI/aider/main/aider/{repomap,linter}.py · .../coders/base_coder.py · .../website/assets/sample.aider.conf.yml.</div><p><a href="../../../ref/harness-gen-output/053-agentic-sdlc-harness-engineering-real-cases-2026-07-10.html#toc" target="_blank" rel="noopener noreferrer">↑ 목차</a></p></div></div></article></template>

<template id="embedded-source-017"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>S28</strong><span>Copilot 에이전트형 SDLC 수명주기</span><span>9. FinOps and Usage Management</span></p><section>
      <h2>9. FinOps and Usage Management</h2>
      <div>
        <div><h3>Measure work, not only tokens</h3><p>accepted change, merged PR, review turnaround, build success, security fix, incident reduction을 비용과 함께 본다.</p></div>
        <div><h3>Separate billing and adoption metrics</h3><p>Usage metrics는 adoption/workflow 분석에 유용하지만 invoice source of truth가 아니다. AI Credits, budgets, usage reports, Actions minutes와 구분한다.</p></div>
        <div><h3>No automatic savings</h3><p>Copilot 도입은 자동 절감 약속이 아니다. 실험 설계, 모델 선택, context budget, task routing이 없으면 비용이 증가할 수 있다.</p></div>
      </div>
      <table>
        <thead><tr><th>Cost Lever</th><th>How</th><th>Risk</th><th>Owner</th></tr></thead>
        <tbody>
          <tr><td>Context budget</td><td>작업 파일 범위, source set, prompt asset을 제한한다.</td><td>필요한 맥락 누락</td><td>Tech lead</td></tr>
          <tr><td>Model routing</td><td>routine task는 기본 모델, high-risk design은 승인된 고성능 모델로 분리한다.</td><td>잘못된 라우팅</td><td>AI platform</td></tr>
          <tr><td>Agent task cap</td><td>한 issue당 재시도, changed file, Actions minute cap을 둔다.</td><td>필요한 자동화 중단</td><td>SRE / DevOps</td></tr>
          <tr><td>Budget hard stop</td><td>cost center, org, user budget과 alert를 운영한다.</td><td>업무 차단</td><td>FinOps</td></tr>
        </tbody>
      </table>
    </section></article></template>

<template id="embedded-source-019"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>T18</strong><span>Copilot 토큰 최적화 가이드</span><span>6. 토큰 절약 플레이북</span></p><section>
      <h2>6. 토큰 절약 플레이북</h2>
      <table>
        <thead><tr><th>방법</th><th>GHCP에서 수행</th><th>GitHub Copilot 실제 실행예</th><th>절약 원리</th><th>위험</th></tr></thead>
        <tbody>
          <tr><td>Scope first</td><td>"이 파일과 이 테스트만 보고 수정"처럼 repo boundary를 지정한다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;파일 경로&gt;와 &lt;테스트 명령&gt;만 기준으로 &lt;목표&gt;를 수정하세요. 추가 파일이 필요하면 먼저 이유를 설명하고 확인을 요청하세요.</code></td><td>불필요한 context read와 추론 분기를 줄인다.</td><td>범위가 너무 좁으면 의존성을 놓친다.</td></tr>
          <tr><td>Context manifest</td><td>작업 전 읽을 파일 목록과 읽는 이유를 요청한다.</td><td>Copilot Agent에 붙여넣기: <code>아직 수정하지 말고 &lt;에러 메시지&gt;, &lt;최근 diff&gt; 기준 context manifest를 만드세요. 포함 파일, 제외 경로, 읽는 이유를 표로 제시하세요.</code></td><td>중복 읽기와 세션 재설명을 줄인다.</td><td>초기 탐색 시간이 필요하다.</td></tr>
          <tr><td>Output budget</td><td>"10행 표", "변경 요약 5개", "코드만" 같은 출력 제한을 둔다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;검토 대상&gt;을 5개 bullet과 1개 수정 diff로만 답하세요. 배경 설명은 생략하고 불확실한 항목은 &lt;확인 필요&gt;로 표시하세요.</code></td><td>답변 토큰과 리뷰 시간을 함께 줄인다.</td><td>설명 부족으로 재질문이 늘 수 있다.</td></tr>
          <tr><td>Edit prior message</td><td>IDE 기반 Copilot Chat에서 이전 응답이 어긋났다면 새 반박 프롬프트를 이어 쓰기보다 edit prior message 방식으로 이전 입력을 고친다.</td><td>Copilot Chat에서 이전 요청 Edit: <code>&lt;이전 메시지&gt;의 &lt;잘못된 조건&gt;을 지우고 &lt;수정된 목표&gt;와 완료 조건만 남긴 뒤 다시 실행하세요.</code></td><td>실패 대화 꼬리와 반박 토큰을 줄인다.</td><td>이전 답변의 근거가 필요하면 짧은 요약으로 별도 보존한다.</td></tr>
          <tr><td>PDF/image to Markdown</td><td>convert PDF/image to Markdown/text를 우선하고, 원본 파일은 필요한 경우에만 보조 근거로 둔다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;PDF 또는 이미지&gt;의 핵심 내용을 &lt;Markdown/text 변환 결과&gt;로 먼저 정리했습니다. 이 텍스트만 기준으로 요구사항, 제약, 확인 필요 항목을 표로 만드세요.</code></td><td>이미지·PDF 해석보다 읽기 쉬운 텍스트 context로 입력을 압축한다.</td><td>OCR 누락과 표 구조 손실은 원본 링크나 샘플로 확인한다.</td></tr>
          <tr><td>Always-loaded context trim</td><td>shorten always-loaded fixed context such as copilot-instructions.md; 항상 로드되는 규칙은 안정적인 팀 규칙과 금지 입력만 남긴다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;copilot-instructions.md&gt;와 &lt;항상 로드되는 고정 컨텍스트&gt;에서 이번 작업 전용 문장, 중복 규칙, 만료된 링크를 제거하고 owner와 만료일을 붙인 12개 이하 항목으로 줄이세요.</code></td><td>매 요청마다 자동 주입되는 반복 토큰을 줄인다.</td><td>보안·규제 필수 지침은 owner 승인 없이 제거하지 않는다.</td></tr>
          <tr><td>Prompt template</td><td>반복 작업은 prompt 파일, instructions, PR template로 저장한다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;반복 작업 유형&gt;용 prompt file 템플릿을 만드세요. 역할, 입력 placeholder, 금지 표현, 검증 명령, 만료 조건만 포함하세요.</code></td><td>반복 prefix를 줄이고 일관성을 높인다.</td><td>오래된 템플릿은 stale risk가 된다.</td></tr>
          <tr><td>Skills and instructions</td><td>Copilot skills, repo instructions, reusable prompt를 작업 유형별로 분리한다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;팀 규칙&gt;을 .github/copilot-instructions.md 후보로 정리하세요. 적용 범위, 출처, 만료일을 붙이고 이번 작업 전용 내용은 제외하세요.</code></td><td>반복 설명과 불필요한 context 재주입을 줄인다.</td><td>권한과 출처가 불명확한 skill은 MCP/plugin allowlist가 필요하다.</td></tr>
          <tr><td>Model routing</td><td>작업 등급별 모델 정책을 문서화하고 고비용 모델은 승인한다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;작업 설명&gt;을 요약, 단순 수정, 보안 영향, 아키텍처 결정 중 하나로 분류하고 현재 조직에서 제공한 &lt;모델 목록&gt; 안에서 승격 조건을 제안하세요.</code></td><td>쉬운 작업에 과한 모델을 쓰지 않는다.</td><td>낮은 모델 품질로 재작업이 생길 수 있다.</td></tr>
          <tr><td>Agent parallelism cap</td><td>동시 agent 수와 tool call 예산을 작업 유형별로 제한한다.</td><td>Copilot Agent에 붙여넣기: <code>&lt;목표&gt;만 처리하세요. 도구 호출, 재시도, 병렬 작업, 중단 조건을 먼저 계획으로 제시하고 같은 실패가 반복되면 구현을 멈추세요.</code></td><td>검수 대기와 중복 탐색을 줄인다.</td><td>긴 작업 처리 시간이 늘 수 있다.</td></tr>
          <tr><td>Diff-first review</td><td>전체 파일 재설명보다 diff와 failing test 중심으로 물어본다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;diff&gt;와 &lt;failing test&gt;만 보고 회귀 원인을 추정하세요. 전체 파일 설명은 하지 말고 수정 후보와 검증 명령만 제안하세요.</code></td><td>검토 context를 변경면으로 제한한다.</td><td>숨은 side effect는 별도 검사가 필요하다.</td></tr>
          <tr><td>Harness-first loop</td><td>답변 생성 후 바로 test/lint/link/secret scan을 실행한다.</td><td>Copilot Agent에 붙여넣기: <code>&lt;수정 목표&gt;를 처리한 뒤 &lt;검증 명령 목록&gt;을 실행하고, 실패하면 실패 줄과 수정 계획만 보고한 뒤 한 번만 재시도하세요.</code></td><td>긴 논쟁 대신 실패 증거로 수정을 압축한다.</td><td>하네스가 약하면 잘못된 안심을 준다.</td></tr>
          <tr><td>Summary cache</td><td>긴 문서는 요약본과 원문 링크를 분리해 재사용한다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;긴 문서&gt;를 결정, 근거, 파일 경로, 재확인 항목으로 요약하세요. 다음 세션에는 요약과 원문 링크만 재사용할 수 있게 작성하세요.</code></td><td>매번 원문 전체를 다시 넣지 않는다.</td><td>요약이 낡으면 claim 오류가 생긴다.</td></tr>
          <tr><td>Prompt caching check</td><td>반복 prefix, instructions, 고정 시스템 문구를 안정화하되 GHCP 지원 범위는 공식 문서 재확인 필요로 둔다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;반복 지침&gt;과 &lt;이번 요청 입력&gt;을 분리해 reusable prefix 후보를 만드세요. GHCP 지원 여부와 provider 캐시 조건은 release-time 확인 항목으로 남기세요.</code></td><td>지원되는 환경에서는 반복 입력 비용과 지연을 줄일 수 있다.</td><td>공급자별 지원 방식이 다르므로 수치 절감 claim 금지.</td></tr>
          <tr><td>Graph/RAG pruning</td><td>관련 symbol, dependency, 문서 chunk만 넣고 전체 repo dump를 피한다.</td><td>Copilot Agent에 붙여넣기: <code>&lt;심볼&gt;, &lt;dependency&gt;, &lt;문서 chunk&gt;만 후보로 검색하고 전체 repo dump는 피하세요. 누락 위험이 있으면 추가 검색어를 먼저 제안하세요.</code></td><td>agent가 읽는 context를 의미 단위로 줄인다.</td><td>검색 인덱스 품질이 낮으면 누락 위험이 커진다.</td></tr>
          <tr><td>Sensitive data minimization</td><td>키, 토큰, 고객정보, 운영 로그 원문은 넣지 않고 더미 또는 마스킹 샘플만 쓴다.</td><td>Copilot Chat에 붙여넣기: <code>&lt;마스킹 샘플&gt;만 사용해 재현 절차를 작성하세요. 키, 토큰, 고객정보, 운영 로그 원문을 요청하지 말고 필요한 값은 placeholder로 남기세요.</code></td><td>보안 사고와 재작성 비용을 줄인다.</td><td>현실 데이터 차이를 테스트로 보완해야 한다.</td></tr>
        </tbody>
      </table>
    </section></article></template>
<template id="embedded-source-020"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L02</strong><span>LLM 사용량과 최적화</span><span>10. 비용·라우팅·캐스케이드</span></p><section>
      <h2>10. 비용·라우팅·캐스케이드</h2>
      <p>모든 트래픽을 단일 대형 모델에 보내는 구조는 비용·지연 측면에서 비효율적일 수 있다. 라우터, 캐스케이드, 캐시를 조합하되, 품질 회귀와 실패 시 fallback을 함께 설계한다. <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-openai-caching" target="_blank" rel="noopener noreferrer">S4</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-promptfoo" target="_blank" rel="noopener noreferrer">S35</a></p>

      <div>
        <div>
          <h3>모델 라우팅</h3>
          <ul>
            <li>입력 길이·난이도·도메인을 가벼운 분류기(또는 작은 LLM)로 판정해 모델을 고른다.</li>
            <li>“작은 모델로 시도 → 신뢰도 낮으면 큰 모델 재시도” 캐스케이드는 비용 절감 후보지만, 재시도율이 높으면 오히려 지연·비용이 늘 수 있어 confidence threshold와 fallback rate를 측정한다.</li>
            <li>사용자 티어·SLA에 따라 라우팅을 분리하면 운영이 단순해진다.</li>
          </ul>
        </div>
        <div>
          <h3>배치 API와 비동기</h3>
          <ul>
            <li>리포트·라벨링·요약 같은 비실시간 트래픽은 공급자별 batch/비동기 API 할인 여부를 확인해 적용한다. 할인율은 최신 가격표를 기준으로 재검증한다.</li>
            <li>실시간이 아닌 작업을 굳이 실시간으로 처리하고 있지 않은지 정기 점검.</li>
          </ul>
        </div>
        <div>
          <h3>캐시 3종</h3>
          <ul>
            <li><strong>프롬프트 캐시:</strong> 동일 prefix 토큰 비용 절감.</li>
            <li><strong>의미 캐시(semantic cache):</strong> 비슷한 질문의 답을 임베딩 유사도로 재사용. 잘못 쓰면 환각 캐시가 되니 정확도 평가 필수.</li>
            <li><strong>도구 결과 캐시:</strong> 같은 도구 인자에 같은 결과를 일정 시간 보존. RAG 검색·외부 API 호출 모두 해당.</li>
          </ul>
        </div>
        <div>
          <h3>측정 없으면 줄지 않는다</h3>
          <ul>
            <li>토큰·요청·도구 호출·캐시 적중률을 <strong>요청 단위</strong> 로 기록.</li>
            <li>“얼마 절감됐다”를 입증할 수 없는 최적화는 도입하지 않는다 — 복잡도만 늘고 가시화되지 않음.</li>
          </ul>
        </div>
      </div>
      <div><h3>검증 상태</h3><ul><li><span>재검증 필요</span> 비용 절감률·배치 할인율·캐시 할인율은 공급자 가격표가 바뀌므로 운영 전 최신 문서 확인이 필요하다.</li></ul></div>
    </section></article></template>
<template id="embedded-source-021"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>D1S2</strong><span>과정 D1·S2 · 좋은 프롬프트 1</span><span>좋은 프롬프트 (1) — 구조로 통제력을 만든다</span></p><main>


<header>

  <h1>좋은 프롬프트 (1) — 구조로 통제력을 만든다</h1>
  <p><strong>역할·맥락·작업·제약·검증·출력(R/C/T/C/V/O)</strong> 6요소로 프롬프트를 구조화하고, 그 구조 위에서 <strong>User Story·Business Process·Acceptance Criteria</strong> 를 검증 가능하게 정제합니다.</p>
  <div><span><strong>PT-07</strong> 구조화 프롬프트</span> <span><strong>PT-08</strong> R/C/T/C/V/O</span> <span><strong>PT-04</strong> 안티패턴</span> <span><strong>PT-05</strong> Before/After</span> <span><strong>SD-03</strong> AC</span> <span><strong>SD-09</strong> Business Process</span></div>
</header>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li>R/C/T/C/V/O 6요소로 프롬프트를 구조화하고 안티패턴을 식별·교정한다.</li>
    <li>공통 activity-log 스펙을 <strong>User Story</strong> 와 정상·예외·경계 <strong>Acceptance Criteria</strong> 로 정제한다.</li>
    <li>요구사항을 <strong>Business Process</strong> (Event/Task/Gateway)로 흐름화한다.</li>
  </ul>
</section>

<section>
  <h2>이 세션의 활동별 권장 모델</h2>
  <table>
    <caption>D1·S2 활동 · 책임 주체 · 권장 모델</caption>
    <thead><tr><th>활동</th><th>주체·과업군</th><th>권장 모델</th><th>한 줄 이유</th></tr></thead>
    <tbody>
      <tr><td>6요소 프롬프트·User Story·AC 작성</td><td>AI 보조 · F1</td><td><strong>GPT-5.6 Luna</strong></td><td>경계·예외·허용 범위를 3회 품질 gate로 구조화</td></tr>
      <tr><td>checkpoint 실행</td><td>사람·도구 · N0</td><td><strong>모델 미사용</strong></td><td>결정론적 검사 결과를 사람이 확인</td></tr>
    </tbody>
  </table>
  <div><strong>선정 기준:</strong> blind-v2 132 primary·35 external screen·29 confirmation attempts(12 stable)에서 세 번 모두 품질 gate를 통과한 후보를 비교했습니다. TTFT·p95·실제 청구액이 아니며 강의 당일 조직 정책과 세션 로그를 확인합니다. <a href="../aibuild-squad/output/260627_edu/edu_context/%ED%99%9C%EB%8F%99%EB%B3%84-%EB%AA%A8%EB%8D%B8-%EC%B6%94%EC%B2%9C-%EB%B3%B4%EA%B3%A0%EC%84%9C-2026-07-11.html" target="_blank" rel="noopener noreferrer">전체 근거 보기</a></div>
</section>

<section>
  <h2>미니강의 — "완료"를 모델에게 맡기지 않는다</h2>
  <p>나쁜 프롬프트는 모델에게 <em>무엇이 끝인지</em> 를 정의하지 않습니다. 좋은 프롬프트는 6요소(<span>PT-08</span>)로 끝의 모양을 못박습니다.</p>
  <table>
    <caption>구조화 프롬프트 6요소 (R/C/T/C/V/O)</caption>
    <thead><tr><th>요소</th><th>질문</th><th>예</th></tr></thead>
    <tbody>
      <tr><td>역할 Role</td><td>누구로서?</td><td>billing 모듈 담당 개발자</td></tr>
      <tr><td>맥락 Context</td><td>무엇을 알고 있어야?</td><td>비식별 기능 스펙, 현재 동작</td></tr>
      <tr><td>작업 Task</td><td>무엇을?</td><td>면세 분기 추가</td></tr>
      <tr><td>제약 Constraint</td><td>무엇을 하지 마라?</td><td>외부 패키지 금지, 시그니처 유지</td></tr>
      <tr><td>검증 Verification</td><td>어떻게 맞는지 확인?</td><td>유닛테스트 통과</td></tr>
      <tr><td>출력 Output</td><td>어떤 형식/순서로?</td><td>변경 요약 → 코드 → 테스트</td></tr>
    </tbody>
  </table>
  <div><strong>안티패턴(<span>PT-04</span>):</strong> 전체 레포 첨부 · 출력 형식 미지정 · 금지 작업 누락 · 완료 기준 없음 · "알아서 해줘".</div>
</section>

<section>
  <h2>실습 1 — Before/After 프롬프트 (<span>PT-05</span>)</h2>
  <div><div>Before</div>
<pre><code>면세 처리도 좀 넣어줘. 알아서 잘 고쳐줘.</code></pre></div>
  <div><div>After (R/C/T/C/V/O)</div>
<pre><code>[역할] 너는 우리 기능팀의 결제 모듈 담당 개발자다.
[맥락] 고객 스펙(비식별): VAT 10%, 면세 품목 제외. 레거시 calcVat() 존재.
[작업] 면세 분기 추가 + 음수 입력 가드.
[제약] 외부 라이브러리 추가 금지. 기존 시그니처 유지.
[검증] 면세=0, 일반=10%, 음수=오류 케이스의 유닛테스트 포함.
[출력] 변경 diff 요약 → 코드 → 테스트 순서로.</code></pre></div>
  <div><strong>"After가 토큰이 더 많은데, S1의 '토큰 절약'과 모순 아닌가?"</strong> — 단발 프롬프트만 보면 After가 더 깁니다. 하지만 <strong>절약의 기준은 '한 번의 프롬프트 길이'가 아니라 '작업 완료까지의 총 토큰'</strong> 입니다.
    <ul>
      <li><strong>S1(토큰 최적화)</strong> = <em>잡음</em> 을 뺀다 — 전체 레포·긴 로그 같은 불필요한 컨텍스트.</li>
      <li><strong>S2(구조화 프롬프트)</strong> = <em>신호</em> 를 넣는다 — 역할·제약·AC. 재작업을 막는 <strong>투자</strong> 입니다.</li>
      <li>모호한 Before("알아서 잘 고쳐줘")는 엉뚱한 수정·되돌리기·재프롬프트로 <strong>턴이 쌓여</strong>, 입력+출력 토큰이 오히려 더 커집니다(2026-06-01~ 토큰 과금은 입력·출력을 모두 계산).</li>
    </ul>
    즉 <strong>잡음↓(S1) + 신호↑(S2) = 총 토큰↓</strong>. 두 세션은 충돌이 아니라 같은 목표의 양면입니다.</div>
</section>

<section>
  <h2>실습 2 — 요구사항 정제 (User Story · BP · AC)</h2>
  <div><div>User Story</div>
<pre><code>As a [사용자/시스템 역할],
I want [원하는 기능],
So that [업무 가치/품질 효과].</code></pre></div>
  <div><div>Business Process (<span>SD-09</span>)</div>
<pre><code>[Event] 사용자가 금액을 입력한다.
[Task] 입력 유효성을 검사한다.
[Gateway] 음수 또는 면세인가?
  - 음수: 오류 반환
  - 면세: VAT 0
  - 일반: VAT 10%
[Task] 결과를 반환한다.</code></pre></div>
  <div><div>Acceptance Criteria (<span>SD-03</span>) — 정상·예외·경계로 분리</div>
  <table>
    <caption>AC별 검증 방법 · source</caption>
    <thead><tr><th>AC</th><th>검증 방법</th><th>측정 source</th></tr></thead>
    <tbody>
      <tr><td>음수 금액 입력 시 오류 반환</td><td>unit test</td><td><code>npm test</code></td></tr>
      <tr><td>면세 품목은 VAT 0</td><td>unit test</td><td><code>tax.test.ts</code></td></tr>
      <tr><td>public API 시그니처 불변</td><td>lint/checker</td><td><code>npm run lint</code></td></tr>
    </tbody>
  </table></div>
  <div><strong>AC는 검증 가능해야:</strong> 모든 AC는 <strong>자동 테스트 또는 정책 체크</strong> 로 확인 가능해야 합니다. "빠르다·직관적이다" 같은 느낌 기준은 AC가 아니라 <strong>non-goal</strong> 로 분리하세요.</div>
  <div>여기서 만든 AC는 Day1·S4의 Test Matrix(<span>SD-05</span>)와 Day2·S4~S5의 test-first(<span>SD-06</span>) 구현으로 그대로 이어집니다.</div>
  <div>
    <strong>ActivityWatch 목표 힌트 · S2 User Story·AC</strong>
    <p><a href="https://docs.activitywatch.net/en/latest/buckets-and-events.html" target="_blank" rel="noopener noreferrer">ActivityWatch의 event·bucket 개념</a> 처럼 “시간 구간의 활동을 모아 요약한다”는 방향을 참고하되, 실습 계약은 더 작은 <code>{ app, start, end }</code> 모델입니다.</p>
    <ul>
      <li><strong>User Story 질문:</strong> 사용자는 세션 결과를 보고 어떤 결정을 하나요? 한 문장으로 사용자·기능·가치를 연결하세요.</li>
      <li><strong>고정 계약 확인:</strong> <code>FEATURE-SPEC.md</code> 와 <code>src/activity.js</code> 의 TODO를 읽고 유효 event 필터, 시작 시각 정렬, 겹침 시 end 확장, ms 출력 규칙을 기록합니다. 이는 선택할 새 AC가 아니라 구현이 지켜야 할 기존 계약입니다.</li>
      <li><strong>정상·경계 AC 질문:</strong> <code>test/activity.test.js</code> 의 skip 테스트 이름과 합성 fixture를 보고, 임계값을 넘는 경우와 정확히 같은 경우의 기대 세션 수·count를 직접 계산해 적으세요.</li>
      <li><strong>예외 AC 질문:</strong> baseline 테스트 이름에서 무효 event 또는 collector 실패 계약 하나를 골라 기존 기대값과 연결하세요. 새 예외 동작을 만들지 않습니다.</li>
      <li><strong>증거 범위:</strong> Day2 필수 sessionize 증거는 기존 skip 2개를 켜는 것입니다. 추가 checkpoint 테스트를 요구사항처럼 늘리지 않습니다.</li>
    </ul>
    <p><strong>개념 주의:</strong> ActivityWatch의 AFK watcher가 기록하는 <em>afk/not-afk 상태</em> 와, 이번 실습이 계산하는 <em>이벤트 사이 유휴 간격</em> 은 같은 데이터가 아닙니다. 명시적 AFK 입력은 stretch 또는 non-goal로 남기세요.</p>
  </div>
</section>

<section>
  <h2>참조 심화 — SMART AC · BDD 브래킷</h2>

  <h3>SMART AC — 검증 가능한 조건의 5가지 기준</h3>
  <p>AC가 "잘 동작한다"에 머물면 모델도 사람도 <strong>완료를 판정할 수 없습니다</strong>. SMART는 AC를 <strong>측정 가능한 문장</strong> 으로 만드는 체크리스트입니다. 특히 마지막 <strong>T</strong> 는 "무엇으로 확인하나" — 즉 <strong>측정 source</strong> (테스트/명령)를 함께 적는다는 뜻입니다.</p>
  <table>
    <caption>SMART 기준 · 질문 · 결제(VAT) 예</caption>
    <thead><tr><th>기준</th><th>질문</th><th>예</th></tr></thead>
    <tbody>
      <tr><td><strong>S</strong> pecific · 구체적</td><td>무엇이, 어떤 조건에서?</td><td>"면세 품목"이라는 입력 조건을 명시</td></tr>
      <tr><td><strong>M</strong> easurable · 측정가능</td><td>숫자/불리언으로 판정되나?</td><td>VAT = 0 (정확한 기대값)</td></tr>
      <tr><td><strong>A</strong> chievable · 달성가능</td><td>이번 slice로 가능한가?</td><td><code>calcVat()</code> 한 함수 범위</td></tr>
      <tr><td><strong>R</strong> elevant · 관련성</td><td>기능 목표에 닿나?</td><td>세금 정확도 목표에 직결</td></tr>
      <tr><td><strong>T</strong> estable · 테스트가능</td><td>무엇으로 확인하나?(source)</td><td><code>tax.test.js</code> 의 "AC2 면세=0"</td></tr>
    </tbody>
  </table>
  <div><strong>✗ 모호한 AC:</strong> "면세 처리가 잘 된다." — 무엇이 '잘'인지, 무엇으로 확인하는지가 없습니다.</div>
  <div><strong>✓ SMART AC:</strong> "면세 품목을 입력하면 VAT는 <strong>0</strong> 을 반환한다 — <code>npm test</code> 의 <code>AC2 면세 품목은 VAT 0</code> 으로 확인."</div>

  <h3>BDD 브래킷 — Given·When·Then으로 열고, 증거로 닫는다</h3>
  <p>한 작업 단위를 <strong>시작할 때</strong> 기대를 <code>Given-When-Then</code> 으로 <em>열고</em>, <strong>끝날 때</strong> 같은 문장에 <em>증거</em> (테스트 통과·커밋)를 붙여 <em>닫습니다</em>. 시작과 끝의 기준이 같아 "완료"가 흔들리지 않습니다.</p>
  <div><div>① 열기 — 작업 전, 기대 정의</div>
<pre><code>Given  면세 품목과 금액이 주어지고
When   calcVat(금액, { 면세: true }) 를 호출하면
Then   VAT 는 0 을 반환한다.</code></pre></div>
  <div><div>② 닫기 — 작업 후, 같은 문장 + 증거</div>
<pre><code>Given 면세 품목 … When calcVat … Then VAT = 0   ✅
증거:
- npm test → "AC2 면세 품목은 VAT 0" pass
- commit abc1234 (tax.js: 면세 분기 추가)</code></pre></div>
  <div><strong>왜 브래킷인가:</strong> 열기만 있으면 "했다"는 선언에 그치고, <strong>닫기(증거)</strong> 가 있어야 검증 가능한 변경이 됩니다. 이 열기/닫기 한 쌍은 Day2·S4 test-first(실패 테스트 → 통과)와 리뷰 패킷(증거 번들)으로 그대로 이어집니다.</div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>User Story를 정상·예외·경계 AC로 바꾼다.</li><li>각 AC가 사람이 실행할 테스트 또는 관찰 결과와 연결되게 한다.</li><li>Role·Context·Task·Constraint·Verification·Output을 빠짐없이 작성한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>정상: gap &gt; idleGapMs → 새 세션
예외: start &gt;= end → 이벤트 제외
경계: gap == idleGapMs → 같은 세션
검증: 각 규칙을 독립 테스트 이름으로 연결</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> “잘 묶인다” 같은 표현 대신 입력 조건과 관찰할 결과가 한 문장에 있어야 합니다. 세 AC의 세부 문구는 달라도 정상·예외·경계가 모두 존재해야 합니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> 본인이 작성한 <strong>프롬프트 3종</strong> (요구사항 정리·구현 후보·테스트 후보)과 <strong>AC 표</strong>.</div>
  <ul>
    <li>각 프롬프트에 6요소가 모두 있는가?</li>
    <li>각 AC가 테스트 또는 checker와 연결되는가?</li>
    <li>Business Process에 예외 흐름(Gateway)이 있는가?</li>
  </ul>
  <div><strong>컷라인:</strong> 시간이 빠듯하면 User Story 1개 + AC 3개만 확실히. BP는 글머리 흐름으로 대체 가능.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>
  <ul>
    <li>검증(V)을 빼먹음 → 모델이 "동작한다"고 선언하지만 근거가 없음. 항상 검증 요소를 넣습니다.</li>
    <li>AC를 "잘 동작한다" 같은 모호한 문장으로 작성 → 정상/예외/경계 값으로 구체화합니다.</li>
  </ul>
  <div><strong>공유 포인트:</strong> "내 안티패턴 1개와 교정"을 기록하세요. 동료가 가장 빨리 배우는 형태가 Before/After입니다.</div>
</section>

<section>
  <h2>이 세션의 실행 코드 (Hands-on)</h2>
  <div><strong>AC ↔ 테스트 이름 매핑을 직접 확인:</strong></div>
<pre><code>cd labs
npm test         # AC3 통과, AC1/AC2 는 skip(이름으로 AC 의도 확인)
# 파일: labs/test/tax.test.js, labs/prompts/examples.md (구조화 프롬프트)</code></pre>
  <div><strong>학습 checkpoint:</strong> 데모를 본 뒤 activity-log에서 <code>npm run lab -- start d1-s2</code> → User Story/AC 직접 작성 → <code>npm run lab -- check d1-s2</code>.</div>
  <p>전체 실습 지도: <code>labs/README.md</code></p>
</section>

<template id="embedded-source-022"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>S28</strong><span>Copilot 에이전트형 SDLC 수명주기</span><span>4. 단계별 상세 사용법</span></p><section>
      <h2>4. 단계별 상세 사용법</h2>
      <h3>4-1. Intake: Issue를 agent-ready work item으로 만들기</h3>
      <div>
        <div><div>1</div><div><h3>Issue form을 표준화</h3><p>문제, 사용자 영향, 성공 기준, 제외 범위, 데이터 민감도, 테스트 기대값을 입력하게 한다. Copilot은 description을 요약하고 빠진 정보를 질문하는 데 사용한다.</p></div></div>
        <div><div>2</div><div><h3>Risk tier를 붙임</h3><p>문서/테스트/로깅 변경은 낮은 risk, 권한·데이터·배포·보안 변경은 높은 risk로 분류한다. 높은 risk는 cloud agent 자동 변경보다 plan-first와 human approval을 우선한다.</p></div></div>
        <div><div>3</div><div><h3>Acceptance criteria를 명시</h3><p>Copilot에게 “done”을 맡기지 않는다. 사람이 검증 가능한 acceptance criteria와 required checks를 만든 뒤 agent에게 구현 후보를 맡긴다.</p></div></div>
      </div>

      <h3>4-2. Planning: Repo context를 source-aware plan으로 바꾸기</h3>
      <table>
        <thead><tr><th>작업</th><th>Copilot 사용</th><th>Gate</th><th>산출물</th></tr></thead>
        <tbody>
          <tr><td>관련 코드 찾기</td><td>Chat/CLI/cloud agent에게 파일 후보, dependency, owner, test path를 찾게 한다.</td><td>근거 없는 파일 추정 금지</td><td>context manifest</td></tr>
          <tr><td>설계 옵션 비교</td><td>2~3개 대안을 trade-off, failure mode, rollback 기준으로 비교하게 한다.</td><td>Architecture owner review</td><td>ADR 초안</td></tr>
          <tr><td>테스트 계획</td><td>unit/integration/e2e/security/regression test 후보를 만들게 한다.</td><td>Test owner가 coverage gap 승인</td><td>test matrix</td></tr>
          <tr><td>작업 분할</td><td>PR 크기를 작게 나누고 merge 순서를 제안하게 한다.</td><td>각 PR 독립 rollback 가능</td><td>PR plan</td></tr>
        </tbody>
      </table>

      <h3>4-3. Implementation: GitHub 작업면 안에서 변경 만들기</h3>
      <div>
        <div><h3>IDE Copilot</h3><p>짧은 코드 작성, local refactor, test stub, 설명 요청에 적합하다. 민감정보와 대규모 파일 범위는 명시적으로 제외한다.</p></div>
        <div><h3>Copilot CLI</h3><p>터미널 작업, repo 탐색, 명령 초안, scripted workflow 설명에 적합하다. write/deploy/delete 명령은 사람 승인 gate를 둔다.</p></div>
        <div><h3>Cloud agent</h3><p>Issue 기반 구현, branch/PR 생성, test/lint 실행, 문서 업데이트 후보에 적합하다. repo/branch/PR 제한과 content exclusion caveat를 항상 표시한다.</p></div>
      </div>
    </section></article></template>
<template id="embedded-source-023"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>M03</strong><span>메타플랜 모범 사례</span><span>7. 에이전트 계약 템플릿</span></p><section>
      <h2>7. 에이전트 계약 템플릿</h2>
      <p>에이전트 정의 파일은 persona 설명보다 입출력 계약과 권한 경계가 중요하다. <code>.github/agents/&lt;INITIALS&gt;-&lt;name&gt;.agent.md</code> 같은 파일에 아래 필드를 고정한다.</p>
      <pre><code>id: AA-Aoki
role: Azure Architect Planner
persona: Azure WAF/CAF 관점의 아키텍처 검토자
authority:
  can_decide: [architecture_recommendation, azure_service_mapping]
  cannot_decide: [final_release, security_exception]
inputs:
  - user_goal
  - constraints
  - previous_decisions
  - source_materials
outputs:
  - plan.azure.md
  - tradeoff_matrix
  - open_questions
success_criteria:
  - WAF 5 pillars covered
  - assumptions explicit
  - no unsupported service claim
tools:
  allowed: [read_docs, search_workspace, generate_mermaid]
  forbidden: [write_production_config]
data_policy:
  allowed: [public_docs, sanitized_requirements]
  forbidden: [customer_data, secrets, production_logs]
failure_modes:
  - unsupported_claim
  - missing_cost_tradeoff
  - preview_service_without_caveat
escalation:
  - Orchestrator
  - Architecture Review
artifacts:
  - decision_log_id
  - cited_sources
  - evaluator_result</code></pre>
      <div><strong>효율 포인트:</strong> 계약이 명확하면 Orchestrator가 worker를 매번 새로 설명하지 않아도 되고, Evaluator가 산출물의 누락 여부를 자동으로 검사할 수 있다.</div>
    </section></article></template>
<template id="embedded-source-024"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L02</strong><span>LLM 사용량과 최적화</span><span>3. 구조화 출력과 도구 인자</span></p><section>
      <h2>3. 구조화 출력과 도구 인자</h2>
      <p>구조화 출력은 단순 “JSON 잘 받기”가 아니라 후속 시스템이 검증할 수 있는 계약(contract)을 만드는 방식이다. JSON Schema와 공급자 structured output 및 function calling 문서로 기능을 확인할 수 있다. <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-json-schema" target="_blank" rel="noopener noreferrer">S18</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-openai-structured" target="_blank" rel="noopener noreferrer">S9</a> <a href="../../../ref/harness-gen-output/002-llm-usage-and-optimizations-2026-07-10.html#ref-openai-function" target="_blank" rel="noopener noreferrer">S7</a></p>

      <div>
        <div>
          <h3>권장 구성</h3>
          <ul>
            <li>스키마는 코드(예: Pydantic / Zod / JSON Schema)로 한 번만 정의하고, 프롬프트와 도구 인자가 같은 정의를 공유.</li>
            <li>모르는 값에는 <code>null</code> 또는 <code>"unknown"</code> Enum을 넣을 수 있게 설계해, 모델이 빈칸을 임의로 메우는 위험을 줄인다.</li>
            <li>리스트는 <code>min/max items</code> 제약을 두어 “하나만 뽑기” / “정확히 N개 뽑기” 요구를 애플리케이션 검증과 연결한다.</li>
            <li>설명(<code>description</code>) 필드는 사람용이 아니라 <strong>모델용 가이드</strong> 로 작성한다.</li>
          </ul>
        </div>
        <div>
          <h3>실패 패턴과 방어</h3>
          <ul>
            <li>긴 자유 텍스트 필드(예: <code>summary</code>) + 강한 스키마 조합에서 모델이 텍스트를 잘라먹는 경우 → 길이 상한을 스키마에 명시.</li>
            <li>Enum이 너무 많으면 모델이 가까운 단어로 자가-매핑 → Enum을 5~10개 이하로 유지하거나 <code>other</code> 를 추가하고 후속 라우팅.</li>
            <li>깊게 중첩된 스키마는 모델별 준수율·토큰 비용·검증 복잡도를 높일 수 있으므로, 평면화(flatten) 가능성을 평가한다.</li>
          </ul>
        </div>
      </div>

      <h4>예시: 안전한 분류·추출 스키마(개념)</h4>
<pre><code>{
  "type": "object",
  "properties": {
    "intent": { "type": "string", "enum": ["question","complaint","other"] },
    "topic":  { "type": ["string","null"], "maxLength": 60 },
    "entities": {
      "type": "array", "maxItems": 10,
      "items": {
        "type": "object",
        "properties": {
          "name": { "type": "string" },
          "type": { "type": "string", "enum": ["person","org","product","date"] }
        },
        "required": ["name","type"]
      }
    },
    "needs_human_review": { "type": "boolean" }
  },
  "required": ["intent","entities","needs_human_review"],
  "additionalProperties": false
}</code></pre>
    </section></article></template>
<template id="embedded-source-025"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>P31</strong><span>AI 보조 SDLC 플레이북</span><span>5. Workshop Technique Map</span></p><section>
      <h2>5. Workshop Technique Map</h2>

<template id="embedded-source-026"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L41</strong><span>AI 보조 효과적 학습 가이드</span><span>6피드백 워크플로</span></p><section>
    <h2><span>6</span> 피드백 워크플로</h2>
    <p>Hattie &amp; Timperley의 피드백 논의처럼, 좋은 피드백은 “어디로 가야 하는가, 지금 어디에 있는가, 다음에 무엇을 해야 하는가”를 다룹니다. AI 피드백도 이 구조를 따르게 해야 합니다.</p>
    <div>
      <table>
        <thead><tr><th>단계</th><th>AI에게 맡길 일</th><th>학습자가 해야 할 일</th><th>완료 신호</th></tr></thead>
        <tbody>
          <tr><td>목표 정의</td><td>학습 목표를 1문장으로 줄이고 평가 기준을 제안</td><td>오늘의 목표를 하나로 고정</td><td>“무엇을 할 수 있어야 하는가”가 명확함</td></tr>
          <tr><td>자기 시도</td><td>아직 사용하지 않음</td><td>백지 설명, 풀이, 예측 답 작성</td><td>AI 없이 5분 이상 시도</td></tr>
          <tr><td>진단</td><td>오류 유형, 빠진 전제, 다음 힌트 제시</td><td>오류를 내 말로 다시 설명</td><td>틀린 이유를 한 문장으로 말함</td></tr>
          <tr><td>수정</td><td>비슷하지만 다른 문제 생성</td><td>새 문제를 독립적으로 풀이</td><td>새 문제에서 같은 오류 감소</td></tr>
          <tr><td>복습</td><td>간격 반복 일정과 플래시카드 제안</td><td>복습일에 다시 인출</td><td>AI 없이 핵심 설명 가능</td></tr>
        </tbody>
      </table>
    </div>
    <div>
      <div>학습 SLI/SLO 예시</div>
      <p>독립 설명은 핵심 개념 10개 중 8개 이상, AI 답변 보기 전 자기 풀이는 세션 10개 중 9개 이상, 핵심 주장은 전부 원자료로 확인, 민감정보 입력 0건, 세션당 새 개념 3개 이하를 초기 기준으로 둡니다.</p>
    </div>
  </section></article></template>

<template id="embedded-source-028"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>D1S3</strong><span>과정 D1·S3 · 좋은 프롬프트 2</span><span>좋은 프롬프트 (2) — 리팩토링·복잡 로직과 Context Manifest</span></p><main>


<header>
  <div>DAY 1 · SESSION 3 · 13:30–14:50 (80m)</div>
  <h1>좋은 프롬프트 (2) — 리팩토링·복잡 로직과 Context Manifest</h1>
  <p>동작을 바꾸지 않으면서 코드를 정리하는 <strong>리팩토링</strong> 과 분기가 많은 <strong>복잡 로직</strong> 을 안전하게 지시하는 법, 그리고 봐야 할 파일만 추리는 <strong>Context Manifest</strong> 로 토큰과 데이터 경계를 동시에 잡는 법을 익힙니다.</p>
  <div><span><strong>SD-04</strong> Context Manifest</span> <span><strong>GN-06</strong> 작은 diff</span> <span><strong>PT-10</strong> 출력 형식 제어</span> <span><strong>PT-02</strong> 컨텍스트 관리</span> <span><strong>OR-12</strong> 데이터 경계</span></div>
</header>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li>"동작 불변"을 가드레일로 명시한 <strong>리팩토링 프롬프트</strong> 를 작성한다.</li>
    <li>분기가 많은 복잡 로직을 <strong>작은 함수로 분리</strong> 하도록 단계적으로 지시한다.</li>
    <li><strong>Context Manifest</strong> (allowed/blocked/unknown/test files)로 봐야 할 파일을 좁힌다(<span>SD-04</span>).</li>
    <li>결과가 빗나갈 때 <strong>실패 프롬프트 디버깅</strong> 으로 한 가지씩 교정한다.</li>
  </ul>
</section>

<section>
  <h2>이 세션의 활동별 권장 모델</h2>
  <table>
    <caption>D1·S3 활동 · 책임 주체 · 권장 모델</caption>
    <thead><tr><th>활동</th><th>주체·과업군</th><th>권장 모델</th><th>한 줄 이유</th></tr></thead>
    <tbody>
      <tr><td>리팩토링 후보와 실패 교정</td><td>AI 보조 · F3</td><td><strong>GPT-5.4 mini</strong></td><td>작은 구현을 sandbox 테스트로 3회 검증</td></tr>
      <tr><td>Context Manifest 작성</td><td>AI 보조 · F1</td><td><strong>GPT-5.6 Luna</strong></td><td>경계·예외·허용 범위를 3회 품질 gate로 구조화</td></tr>
      <tr><td>회귀 테스트</td><td>사람·도구 · N0</td><td><strong>모델 미사용</strong></td><td>회귀 여부는 테스트 결과로 판정</td></tr>
    </tbody>
  </table>
  <div><strong>선정 기준:</strong> blind-v2 132 primary·35 external screen·29 confirmation attempts(12 stable)에서 세 번 모두 품질 gate를 통과한 후보를 비교했습니다. TTFT·p95·실제 청구액이 아니며 강의 당일 조직 정책과 세션 로그를 확인합니다. <a href="../aibuild-squad/output/260627_edu/edu_context/%ED%99%9C%EB%8F%99%EB%B3%84-%EB%AA%A8%EB%8D%B8-%EC%B6%94%EC%B2%9C-%EB%B3%B4%EA%B3%A0%EC%84%9C-2026-07-11.html" target="_blank" rel="noopener noreferrer">전체 근거 보기</a></div>
</section>

<section>
  <h2>미니강의 — 리팩토링은 "동작 불변 + 작은 diff"</h2>
  <p>리팩토링의 핵심 가드레일은 두 가지입니다: <strong>동작을 바꾸지 않는다</strong> (기존 테스트 모두 통과)와 <strong>작은 diff</strong> (<span>GN-06</span>, 1~2파일·소규모)입니다. 작은 diff는 리뷰와 롤백을 쉽게 만들어 Day2의 로컬 게이트와 직접 연결됩니다.</p>
  <h3>Context Manifest = 토큰 + 데이터 경계 (<span>SD-04</span>)</h3>
  <p>복잡 로직일수록 "어떤 파일을 봐야 하는가"가 모호해집니다. Context Manifest는 봐야 할 파일을 <strong>allowed</strong>, 건드리면 안 되는 파일을 <strong>blocked</strong>, 모르는 것을 <strong>unknown</strong> 으로 명시합니다. 이것이 곧 토큰 절약이자 <strong>데이터 경계</strong> (<span>OR-12</span>)의 장치입니다.</p>
</section>

<section>
  <h2>실습 1 — 리팩토링·복잡 로직 프롬프트</h2>
  <div><div>리팩토링 프롬프트</div>
<pre><code>[역할] 너는 billing feature 담당 개발자다.
[맥락] calcVat()에 면세 분기·음수 가드·예외 처리가 섞여 가독성이 낮다.
[작업] 동작 변경 없이 calcVat()를 리팩토링하고, 복잡 분기를 작은 함수로 분리.
[제약] 기존 public API 시그니처 유지, 외부 패키지 추가 금지, 기존 테스트 전부 통과.
[출력] 변경 diff 요약 → 코드 → 테스트 순서로.</code></pre></div>
  <div><div>실패 프롬프트 디버깅</div>
  <ul>
    <li>결과가 빗나가면 <strong>맥락·제약·출력 형식</strong> 중 무엇이 빠졌는지 점검하고, 한 번에 다 고치기보다 <strong>한 가지씩</strong> 조정합니다.</li>
    <li>"왜 이렇게 했는지" 설명을 요구해 모델의 <strong>가정</strong> 을 드러냅니다(잘못된 가정이 보입니다).</li>
  </ul></div>
</section>

<section>
  <h2>실습 2 — Context Manifest 작성</h2>
  <div><div>작성 프롬프트</div>
<pre><code>[작업] 아래 기능 스펙을 구현하려면 어떤 파일만 보면 되는지 Context Manifest를 만들어라.
[포함] allowed files, blocked files, unknowns, test files, 민감정보 경계.
[제약] 파일명을 추정하지 말고, 모르면 탐색 질문으로 남겨라.
[출력] 표 형식.</code></pre></div>
  <table>
    <caption>Context Manifest 파일 구분 예시</caption>

      <tr><td>allowed</td><td><code>src/billing/tax.ts</code></td><td>수정 허용</td></tr>
      <tr><td>blocked</td><td><code>.env</code>, <code>prod/*</code></td><td>변경 금지(게이트로 강제)</td></tr>
      <tr><td>test</td><td><code>tax.test.ts</code></td><td>검증 파일</td></tr>
      <tr><td>unknown</td><td>"환율 모듈 위치?"</td><td>탐색 질문으로 남김</td></tr>
    </tbody>
  </table>
  <div>이 blocked 목록은 Day2·S2의 <strong>policy-check</strong> (<span>HE-04</span>)가 자동 감지하는 대상이 됩니다.</div>
  <div>
    <strong>ActivityWatch 목표 힌트 · S3 Context·데이터 경계</strong>
    <p><a href="https://docs.activitywatch.net/en/latest/watchers.html" target="_blank" rel="noopener noreferrer">ActivityWatch watcher 구조</a> 는 수집기를 분석 기능과 분리합니다. 실습에서는 이를 완전히 구현하지 않고 <strong>주입 가능한 <code>collector</code> → 비식별 event → 순수 분석 함수</strong> 라는 경계만 연습합니다.</p>
    <ul>
      <li><strong>allowed:</strong> 구현 후보 <code>src/activity.js</code> 와 검증 파일 <code>test/activity.test.js</code>. 읽기 참고는 <code>FEATURE-SPEC.md</code> 와 <code>BACKLOG.md</code> 입니다.</li>
      <li><strong>blocked:</strong> 실제 OS·브라우저 API, 네트워크·클라우드, DB·서버, <code>.env</code>, 원본 창 제목·URL·계정 정보.</li>
      <li><strong>데이터 계약:</strong> ActivityWatch의 <code>timestamp + duration + data</code> 형식과 호환한다고 가정하지 않습니다. 이 과정은 <code>{ app, start, end }</code> 와 ms 기반 출력만 사용합니다.</li>
      <li><strong>고정 구현 계약:</strong> 유효 event 필터·시작 시각 정렬·겹침 시 최대 end 확장은 <code>src/activity.js</code> TODO에 이미 정해져 있으므로 unknown으로 돌리지 않습니다.</li>
      <li><strong>unknown 질문:</strong> 명시적 AFK 상태·날짜 필터처럼 core 스펙에 없는 새 기능이 정말 필요한지는 추정하지 말고 stretch 질문으로 남깁니다.</li>
    </ul>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>읽을 파일, 수정할 파일, 금지할 파일과 미확정 영역을 분리한다.</li><li>리팩토링 전후 공개 동작이 같음을 같은 테스트로 확인한다.</li><li>범위를 넓혀야 하면 파일명과 이유를 먼저 남긴다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>allowed: src/activity.js
         test/activity.test.js
blocked: .env, prod/, secrets/
unknown: 실제 OS collector
test: npm test</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> Manifest는 저장소 전체 설명서가 아닙니다. 이번 변경에 필요한 최소 파일과 금지 경계를 다른 사람이 그대로 재현할 수 있으면 충분합니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> ① 리팩토링/복잡 로직 프롬프트 1개, ② 구현 계획·테스트 생성 프롬프트, ③ Context Manifest v1.</div>
  <ul>
    <li>리팩토링 프롬프트에 "동작 불변 + 기존 테스트 통과"가 있는가?</li>
    <li>Context Manifest에 allowed/blocked/test가 분리되어 있는가?</li>
    <li>실패 시 한 가지씩 교정한 로그가 있는가?</li>
  </ul>
  <div><strong>컷라인:</strong> 복잡 로직 분리가 어려우면 리팩토링 프롬프트 1개 + Context Manifest 1개로 충분합니다.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>

  <h3>실수 1 · 리팩토링에 기능 변경이 섞임 → 회귀</h3>
  <p>"동작은 그대로, 구조만" 이어야 하는데 모델이 로직까지 바꿔 회귀가 납니다.</p>
  <div><strong>✗ 예시:</strong> "<code>calcVat()</code> 가독성 좋게 정리해줘"만 요청 → 모델이 <strong>반올림 정책</strong> 까지 바꿈(예: <code>Math.round</code> → <code>Math.floor</code>). 단위테스트는 통과해도 10원 단위 결과가 달라져 <strong>운영 회귀</strong>.</div>
  <div><strong>✓ 교정:</strong> 프롬프트에 <strong>"동작 불변 · 기존 테스트 전부 통과"</strong> 를 명시하고, diff에서 <em>로직 변경이 없는지</em> 확인. 기능 추가는 <strong>별도 프롬프트·커밋</strong> 으로 분리.</div>

  <h3>실수 2 · Context Manifest 없이 큰 변경 → 엉뚱한 파일 수정</h3>
  <p>범위를 안 정하면 모델이 무관한 파일까지 손댑니다.</p>
  <div><strong>✗ 예시:</strong> "결제 로직 정리해줘" → 모델이 <code>src/billing/tax.js</code> 뿐 아니라 무관한 <code>src/report/export.js</code> ·<code>.env</code> 까지 건드림.</div>
  <div><strong>✓ 교정:</strong> 먼저 Manifest로 범위를 못박음 — allowed <code>src/billing/tax.js</code> · blocked <code>.env</code>, <code>prod/*</code>. blocked는 Day2·S2 <strong>policy-check</strong> 가 자동 차단합니다.</div>

  <div><strong>공유 포인트:</strong> "내 코드에서 Context Manifest가 막아준 위험"을 한 줄로 — 예: <em>"결제 리팩토링에서 <code>prod/config</code> 가 blocked라 실수로 운영 설정을 건드리지 않았다."</em> 데이터 경계 사례는 팀 보안 관점에서 공유 가치가 큽니다.</div>
</section>

      <div>

        <div><h3>Rulesets</h3><p>branch protection, rulesets, CODEOWNERS, required checks, merge queue로 agent PR도 기존 팀 정책 아래 둔다. agent를 우회 actor로 두는 경우에는 별도 risk acceptance가 필요하다.</p></div>
        <div><h3>Tool Boundary</h3><p>MCP server, CLI command, Actions workflow, external API는 allowlist와 least privilege로 제한한다. tool schema도 context budget과 보안 표면에 영향을 준다.</p></div>

          <tr><td>Write</td><td>branch commit, test/doc update, draft PR</td><td>schema/data migration, security policy change</td><td>main 직접 push, 승인 없는 destructive write</td></tr>
          <tr><td>Execute</td><td>unit test, lint, build, local safe script</td><td>deploy, database migration, external write API</td><td>secret exfiltration, public posting, untrusted install</td></tr>

<header>
  <div>DAY 1 · SESSION 4 · 14:50–16:30 (100m)</div>
  <h1>Plan Mode 실습 — 계획과 실행을 분리한다</h1>
  <p>코드를 바로 만들게 하지 않고 <strong>"계획만 먼저"</strong> 받습니다. 단계별 <strong>stop point</strong>, <strong>Test Matrix</strong>, <strong>risk tier</strong>, <strong>rollback note</strong> 를 구현 전에 합의해 복잡한 작업의 통제력을 확보합니다.</p>
  <div><span><strong>CF-04</strong> Plan Mode</span> <span><strong>GN-05</strong> 구현 계획</span> <span><strong>SD-05</strong> Test Matrix</span> <span><strong>SD-11</strong> Human Gate</span> <span><strong>HE-10</strong> Rollback path</span></div>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li>요구사항 → 계획 → 실행을 <strong>분리</strong> 하고, 각 단계에 <strong>stop point</strong> 를 둔다.</li>
    <li>AC를 <strong>Test Matrix</strong> 로 펼치고(<span>SD-05</span>), 위험도(risk tier)와 <strong>Human Gate</strong> 를 표시한다.</li>
    <li>되돌릴 경로(<strong>rollback note</strong>)를 구현 전에 초안으로 만든다.</li>
  </ul>
</section>

<section>
  <h2>이 세션의 활동별 권장 모델</h2>
  <table>
    <caption>D1·S4 활동 · 책임 주체 · 권장 모델</caption>

</section>

<section>
  <h2>미니강의 — 왜 계획을 먼저 받는가</h2>
  <p>에이전트는 한 번에 많은 것을 바꾸려 합니다. Plan Mode(<span>CF-04</span>)는 <strong>코드 작성 이전에</strong> "무엇을, 어느 파일에서, 어떤 순서로, 무엇으로 검증하는가"를 합의합니다. 계획을 보고 잘못된 가정·과한 범위를 <strong>싸게</strong> 잡아낼 수 있습니다.</p>
  <div><strong>Plan Mode는 GitHub Copilot의 기본(내장) 기능입니다.</strong> 별도 확장이나 프롬프트 트릭이 아니라, VS Code Copilot Chat의 <strong>모드 선택기</strong> 에서 <code>Ask · Edit · Agent</code> 와 함께 제공되는 <strong>Plan</strong> 모드를 고르면 됩니다. Plan 모드는 코드를 바로 수정하지 않고 <strong>단계별 실행 계획을 먼저 생성</strong> 하며, 사용자가 그 계획을 <strong>검토·편집·승인</strong> 한 뒤 실행(예: Agent 모드로 핸드오프)합니다. 즉 이 세션에서 연습하는 "계획만 먼저" 흐름이 <strong>제품에 그대로 내장</strong> 돼 있는 셈이며, Plan 모드가 없거나 제품 버전 차이로 보이지 않을 때는 아래 프롬프트로 같은 흐름을 만듭니다.</div>
  <div>
    <span>요구사항(AC)</span> <span>→</span> <span>계획(단계+stop point)</span> <span>→</span> <span>Test Matrix</span> <span>→</span> <span>risk/gate</span> <span>→</span> <span>단계별 실행</span>
  </div>
  <div>Plan Mode의 "단계별 실행 + stop point"는 Day2의 <strong>Loop</strong> (<span>CF-06</span> Plan→Generate→Evaluate→Fix→Gate)로 자연스럽게 확장됩니다.</div>
</section>

<section>
  <h2>실습 — 계획부터 단계 실행까지</h2>
  <div><div>STEP 1 · 계획만 요청</div>
<pre><code>[작업] 아래 기능 스펙(+AC)을 보고 구현 계획만 세워라. 코드 작성 금지.
[출력]
1. 변경 목표
2. 변경 파일 후보와 근거 (Context Manifest 참고)
3. 단계별 plan, 각 단계의 stop point
4. Test Matrix (AC ↔ 테스트)
5. risk tier와 Human Gate
6. rollback note 초안
[제약] 외부 패키지 추가 금지, public API 변경 금지, 실제 고객 데이터 금지.</code></pre></div>
  <div><strong>AC → 테스트 변환 규칙:</strong> AC 원문을 테스트 이름으로 옮기고, 각 AC마다 <strong>정상·예외·경계</strong> 케이스를 뽑습니다. 예: "음수 금액은 오류" → <code>정상: 100원 OK</code> · <code>예외: 음수 reject</code> · <code>경계: 0원 처리 정의</code>.</div>

  <div><div>STEP 2 · 계획 검토·수정 → 2~3단계로 합의</div>
  <p>계획이 4단계를 넘으면 범위가 큰 신호입니다. 2~4단계로 줄이고 각 단계에 stop point가 있는지 확인합니다.</p></div>
  <div><strong>정말 5단계+가 필요하면:</strong> 억지로 줄이지 말고 ① PL과 <strong>scope 재협상</strong> ② Epic으로 보고 <strong>slice 1개만</strong> 오늘 처리 ③ 'High-risk'로 표시해 Approval Owner 사전 승인. 예: 데이터 마이그레이션 같은 큰 작업은 slice로 나눕니다.</div>

  <div><strong>중간 브레이크(2분):</strong> 100분 세션의 절반 지점입니다. <strong>STEP 2까지가 컷라인</strong> (계획 + Test Matrix) — 여기까지면 최소 통과입니다. 잠깐 스트레치 후 STEP 3(실행)으로 갑니다. 시간이 부족하면 STEP 3~4는 Day2로 이월합니다.</div>

  <div><div>STEP 3 · 한 단계만 실행 후 멈춤</div>
<pre><code>"1단계만 구현. 끝나면 멈추고 변경 요약 + 테스트 결과 보고."</code></pre>
  <p>단계마다 검증 후 다음 단계로. 이 "멈춤" 습관이 Day2 게이트의 토대입니다.</p></div>

  <h3>Test Matrix 예 (<span>SD-05</span>)</h3>
  <table>
    <caption>Test Matrix — AC ↔ 테스트 대응</caption>
    <thead><tr><th>AC</th><th>유형</th><th>테스트 이름</th><th>실행</th><th>완료</th></tr></thead>
    <tbody>
      <tr><td>AC1 음수=오류</td><td>unit</td><td>should reject negative</td><td><code>npm test</code></td><td>pass</td></tr>
      <tr><td>AC2 면세=0</td><td>unit</td><td>should apply zero VAT</td><td><code>npm test</code></td><td>pass</td></tr>
      <tr><td>AC3 blocked 불변</td><td>policy</td><td>no blocked file change</td><td><code>policy-check</code></td><td>pass</td></tr>
    </tbody>
  </table>
  <div>
    <strong>ActivityWatch 목표 힌트 · S4 Plan·Test Matrix</strong>
    <p><a href="https://github.com/ActivityWatch/aw-webui" target="_blank" rel="noopener noreferrer">ActivityWatch의 요약·타임라인·카테고리 기능</a> 은 장기 방향입니다. 이번 Plan은 그중 <code>sessionize</code> 한 slice만 Day2에 끝낼 수 있도록 씁니다.</p>
    <ul>
      <li><strong>Core plan 질문:</strong> <code>test/activity.test.js</code> 의 skip 2개와 <code>src/activity.js</code> TODO를 읽고, 어떤 순서로 RED를 확인하고 최소 구현과 GREEN·gate까지 갈지 2~4단계로 직접 쓰세요.</li>
      <li><strong>Core Test Matrix 질문:</strong> fixture를 계산해 임계값 초과와 정확히 같은 경우의 기대값을 채우고, 예외 행은 기존 baseline의 무효 event 또는 collector 실패 테스트와 연결하세요.</li>
      <li><strong>Stretch 후보:</strong> 기본값은 none입니다. core와 gate가 GREEN이고 시간이 남으면 카테고리별 시간, 명시적 AFK 필터, 하루 타임라인/날짜 필터, 합성 JSON import/export 중 <strong>0개 또는 1개</strong> 를 별도 backlog에 둡니다.</li>
      <li><strong>Out:</strong> 실제 watcher·브라우저 확장, 상시 백그라운드 실행, DB·전체 Web UI, ActivityWatch REST/query 완전 호환.</li>
    </ul>
    <p><strong>Day1에 적을 것:</strong> 어떤 2~4단계로 구현할지, 각 AC가 어느 테스트와 연결되는지, 실패하면 무엇을 되돌리고 어떤 명령으로 baseline을 확인할지. 코드는 아직 작성하지 않습니다.</p>
  </div>
</section>

<section>
  <h2>참조 심화 — Definition of Done · 의사결정 가역성</h2>
  <div><strong>Definition of Done:</strong> 계획의 각 단계는 <strong>Code + Test + Required Check + Doc + Rollback Path</strong> 5개가 모두 있어야 "완료"로 봅니다. Plan에 이 5개 칸을 미리 넣어 두면 누락이 사라집니다.</div>
  <div><strong>one-way / two-way door:</strong> 되돌리기 쉬운 <strong>two-way door</strong> (코드 초안 등)는 AI 초안으로 빠르게, 되돌리기 어려운 <strong>one-way door</strong> (아키텍처·데이터·계약·릴리스)는 <strong>사람 결정</strong> 으로. risk tier를 이 기준으로 나눕니다. 2개 이상 옵션을 비교하는 <strong>ADR-lite</strong> (옵션·가역성·리스크·owner)로 기록합니다.</div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>구현 전에 RED·최소 구현·GREEN·gate 순서를 고정한다.</li><li>정상·예외·경계 테스트와 각 단계의 stop point를 연결한다.</li><li>동일 실패 반복, 위험 작업, rollback의 사람 책임자를 표시한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>1. skip 해제 → 의도된 RED에서 멈춤
2. AC 1개 최소 구현 → 목표 테스트 GREEN
3. 전체 gate → 회귀·policy 확인
STOP: 동일 실패 2회 → 사람 리뷰
ROLLBACK: baseline 파일 복구 후 npm test</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> 좋은 Plan은 작업 목록이 아니라 각 단계의 기대 결과와 실패 시 다음 상태가 함께 있는 실행 계약입니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> Plan 실행 기록(계획 → 단계별 결과), Test Matrix, risk tier + Human Gate 표시, rollback note 초안.</div>
  <ul>
    <li>계획이 2~4단계로 제한되고 각 단계에 stop point가 있는가?</li>
    <li>Test Matrix가 AC와 1:1로 연결되는가?</li>
    <li>승인이 필요한 작업(Human Gate)과 로컬에서 끝낼 작업이 구분되었는가?</li>
  </ul>
  <div><strong>컷라인:</strong> 시간 부족 시 STEP 1~2(계획+Test Matrix)까지만. 실제 코드 실행은 Day2로 이월 가능.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>

  <h3>실수 1 · 계획 받자마자 전 단계 일괄 실행 → 통제력 상실</h3>
  <p>계획을 "한꺼번에 다 해줘"로 넘기면 stop point가 무의미해집니다.</p>
  <div><strong>✗ 예시:</strong> Plan이 <em>1) 면세 분기 2) 음수 가드 3) 반올림 정리 4) 리팩토링</em> 인데 "전부 구현해줘"로 한 번에 실행 → 테스트가 깨졌는데 <strong>어느 단계가 원인인지</strong> 알 수 없음.</div>
  <div><strong>✓ 교정:</strong> <code>"1단계만 구현. 끝나면 멈추고 변경 요약 + 테스트 결과 보고."</code> — stop point마다 <code>npm test</code> 로 확인하고 다음 단계로.</div>

  <h3>실수 2 · rollback note를 "나중에"</h3>
  <p>되돌릴 경로는 <strong>구현 전에</strong> 있어야 실패 시 빠릅니다.</p>
  <div><strong>✗ 예시:</strong> <code>calcVat()</code> 반올림 정책을 바꿨다가 운영 청구액이 틀어졌는데, <strong>되돌릴 커밋·설정 스냅샷</strong> 을 안 적어둬 원복에 한참 걸림.</div>
  <div><strong>✓ 교정:</strong> 구현 전에 rollback note 초안 — 되돌릴 기준 커밋 <code>abc1234</code> · 명령 <code>git revert abc1234</code> · 확인 <code>npm test</code> (<span>HE-10</span>).</div>

  <div><strong>공유 포인트:</strong> "계획 단계에서 잡아낸 잘못된 가정"을 한 줄로 — 예: <em>"Plan을 보다 '면세는 소수점 절사, 일반은 반올림'이라는 다른 규칙을 발견해 코드 쓰기 전에 AC를 고쳤다."</em> 계획-실행 분리의 가치를 가장 잘 보여주는 사례입니다.</div>
</section>

<section>
  <h2>이 세션의 실행 코드 (Hands-on)</h2>
  <div><strong>계획·Test Matrix 작성 후 실행으로 검증:</strong></div>
<pre><code># 작성: labs/templates/plan-and-test-matrix.md
cd labs
npm test         # Test Matrix의 '실행' 열에 해당</code></pre>
  <p>전체 실습 지도: <code>labs/README.md</code></p>
</section>
