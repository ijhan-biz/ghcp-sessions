<section>
  <h2>미니강의 — Agentic SDLC 지도로 "오늘 위치" 잡기</h2>
  <div><strong>08:50 사전 self-check(45명 운영):</strong> <code>sample-project-activity-log</code> 를 새 창에 열고 <code>npm run lab -- doctor</code> 를 실행합니다. 실패하면 오류코드 → hint 1 → hint 2 → reset → example 뒤 질문합니다. <code>recover</code> 는 이후 D2·S4 GREEN에만 사용합니다.</div>
  <div><strong>시간 배분(30분):</strong> 이 지도는 <strong>약 5분</strong> 동안 "오늘 어디를 하는지"만 훑습니다. 나머지 <strong>25분</strong> 은 전원 공통 <code>sample-project-activity-log</code> 의 복습·환경 재점검과 must-have AC 좁히기에 씁니다. Spec Pack이 RED면 새 프로젝트로 바꾸지 말고 오류코드로 누락 항목을 복구합니다.</div>
  <p>Day1이 <strong>좋은 입력</strong> (의도·명세·설계)을 만들었다면, Day2는 그것을 <strong>안전하게 실행</strong> (구현·검증·배포·운영)하는 날입니다. 전체를 한 장의 지도로 보면 각 세션이 어디에 앉는지 분명해집니다. 핵심은 단계마다 <strong>권한을 좁히고 · 로그를 남기고 · 게이트를 통과해야 다음으로 간다</strong> 는 폐루프 구조입니다.</p>

  <div>
    <span>Intent 분석</span> <span>→</span>
    <span>명세(Spec)</span> <span>→</span>
    <span>구현</span> <span>→</span>
    <span>검증·테스트</span> <span>→</span>
    <span>배포</span> <span>→</span>
    <span>모니터·피드백</span> <span>↺</span>
    <span>Spec 갱신</span>
  </div>
  <p>화살표 지점마다 권한 제약·정책 주입·검증 게이트(<strong>하네스</strong>)가 붙어 에이전트의 자율 실행을 통제합니다.</p>

  <h3>전통 SDLC 단계 × 에이전트 오버레이 — 오늘은 어디를?</h3>
  <table>
    <caption>Agentic SDLC 단계 × 에이전트 오버레이 — 오늘 위치</caption>
    <thead><tr><th>단계</th><th>핵심 질문</th><th>에이전트 오버레이</th><th>과정 위치</th></tr></thead>
    <tbody>
      <tr><td>S0 의도·문제</td><td>왜 만드나?</td><td>Intent Analysis — 모호한 요청을 검증 가능한 목표로</td><td><span>Day1</span></td></tr>
      <tr><td>S1 요구·명세</td><td>무엇을?</td><td>Spec-Driven — 기계가 읽는 명세가 작업 기준</td><td><span>Day1</span></td></tr>
      <tr><td>S2 도메인·설계</td><td>어떤 구조로?</td><td>설계 규칙·제약을 컨텍스트로 제공(필요 시 MCP)</td><td><span>Day1</span></td></tr>
      <tr><td>S3 구현</td><td>어떻게 안전하게?</td><td>Human+Agent pair · Hooks(결정적 통제) · 권한/제약</td><td><span>Day2</span></td></tr>
      <tr><td>S4 검증·품질</td><td>제대로 됐나?</td><td>Verify 게이트 · evaluator · 계약/state 검증</td><td><span>Day2</span></td></tr>
      <tr><td>S5 배포·보안</td><td>안전하게 내보내나?</td><td>Policy-as-Code · Rulesets · approvals(shift-left)</td><td><span>Day2</span></td></tr>
      <tr><td>S6 운영·신뢰성</td><td>안정적인가?</td><td>Observe·복구 레이어 · 운영 피드백 → Spec 폐루프</td><td><span>Day2</span></td></tr>
      <tr><td>S9 거버넌스</td><td>자율성을 어떻게 통제?</td><td>Human-in-the-loop · Control/Observe/Verify 3축</td><td><span>Day2 전반</span></td></tr>
    </tbody>
  </table>
  <p><strong>읽는 법:</strong> Day1은 지도의 왼쪽(의도→명세→설계), <strong>오늘 Day2는 오른쪽(구현→검증→배포→운영)을 "하네스로 통제하며" 실행</strong> 합니다. 이어지는 S1·S2에서 그 통제면(하네스)을 직접 만듭니다.</p>

      <tr><td>Observability</td><td>실행 기록·추적으로 내부 상태를 관측</td><td>S6·S9</td></tr>

  <div><strong>관점 안내:</strong> 이 지도는 하나의 <em>운영 관점</em> 입니다. "Agentic DevOps · Spec-Driven · Harness Engineering"은 아직 단일 업계 표준 정의로 확정된 용어는 아니며, DDD·BDD·TDD·DevOps·SRE 같은 전통 개념이 사라지는 게 아니라 그 위에 <strong>통제·검증·자동화 층</strong> 이 얹히는 것으로 이해하세요.</div>
</section>

<section>
  <h2>실습 — 재개 체크</h2>
  <div><div>STEP 1 · 브랜치/환경 확인</div>
  <p>VS Code에서 <strong>Terminal → Run Task → Lab: Verify Workspace Root</strong> 를 먼저 실행합니다. 이 task는 <code>${workspaceFolder}</code> 를 runner에 전달해 실제 창 루트가 activity-log인지 proof를 남깁니다.</p>
<pre><code>git status
git branch --show-current      # lab/copilot-workbook 인지
git diff --stat                # 비어있거나 의도된 변경인지
npm test                       # baseline 다시 통과? 실패면 원인 먼저 기록</code></pre></div>
  <div><div>STEP 2 · Feature Spec Pack 로딩 &amp; must-have 표시</div>
  <p>YELLOW였던 참가자는 여기서 10분 보강합니다(빠진 AC/Test Matrix 채우기). 전원 같은 activity-log 스펙을 사용하므로 RED는 프로젝트를 바꾸지 않고 runner hint/reset으로 누락을 복구합니다.</p>
<pre><code>오늘 구현할 must-have AC:
[ ] AC1 ...
[ ] AC2 ...
(나머지는 nice-to-have로 분리)</code></pre></div>
</section>

<section>
  <h2>Day2 실습 프로젝트 — VS Code 새 창에서 열기</h2>
  <p>Day2의 <strong>구현 실습</strong> 은 전원이 독립 프로젝트 <code>sample-project-activity-log</code> 를 <strong>VS Code 새 창</strong> 에 열어 진행합니다. 강의 문서와 분리된 <em>깨끗한 프로젝트 워크스페이스</em> 여야 Copilot의 파일·도구 범위가 이 프로젝트로 좁혀집니다. 개인 프로젝트 적용은 <code>d2-s4-green</code> PASS 후 선택하거나 D+7로 보냅니다.</p>
  <div><strong>기본 실습 프로젝트 = <code>sample-project-activity-log</code>:</strong> 개인 활동 로그 분석 — 구현 슬라이스 <code>sessionize</code> (유휴 간격 기준 집중 세션 분리). 무의존·<code>npm test</code> baseline <strong>5 pass + 2 skip</strong> 이며, Day2에서 그 <strong>2 skip</strong> 을 test-first로 켜서 구현합니다. 하네스 스크립트·에이전트가 모두 포함됩니다.</div>

  <h3>① 새 창에 프로젝트 열기</h3>
  <div><div>방법 A · 메뉴</div><p><strong>File → New Window</strong> (⌘⇧N / Ctrl+Shift+N) → <strong>File → Open Folder…</strong> → <code>sample-project-activity-log</code> 폴더 선택.</p></div>
  <div><div>방법 B · 터미널(code CLI)</div>
<pre><code># -n = 새 창으로 열기 (code 명령이 설치돼 있어야 함)
code -n sample-project-activity-log</code></pre></div>

  <h3>② 실행에 필요한 파일</h3>
  <table>
    <caption>sample-project-activity-log 구성 파일 · 용도</caption>
    <thead><tr><th>파일</th><th>용도</th></tr></thead>
    <tbody>
      <tr><td><code>package.json</code></td><td>실행 진입점 — <code>"test": "node --test"</code>, Node 18+ (외부 의존성 0)</td></tr>
      <tr><td><code>src/activity.js</code></td><td>대상 코드 — <code>sessionize()</code> 가 TODO(구현 대상)</td></tr>
      <tr><td><code>test/activity.test.js</code></td><td>테스트 — 5 pass + <strong>2 skip</strong> (D2·S4에서 켤 대상)</td></tr>
      <tr><td><code>npm run lab -- recover d2-s4-green</code></td><td>D2·S4 구현의 마지막 수단. solved checkpoint 적용 + FALLBACK 기록</td></tr>
      <tr><td><code>FEATURE-SPEC.md</code> · <code>BACKLOG.md</code></td><td>전원 공통 참고 스펙 · 확장 slice 후보</td></tr>
    </tbody>
  </table>

  <h3>③ 어떻게 실행하나</h3>
  <div><div>새 창의 통합 터미널에서 (Terminal → New Terminal)</div>
<pre><code>node -v              # v18 이상인지 확인
npm test             # baseline: 5 pass, 2 skip(정상)

# D2·S4 test-first 루프:
#  1) test/activity.test.js 의 { skip: true } 제거 → npm test (실패=레드 확인)
#  2) src/activity.js 의 sessionize 구현        → npm test (통과=그린)</code></pre>
  <p>즉 <strong>skip을 켜 실패를 먼저 보고(레드) → 구현해서 통과(그린)</strong> 가 Day2 test-first의 핵심 루프입니다. 전체 진행 순서는 프로젝트 <code>README.md</code> 에 있습니다.</p></div>

  <div><strong>왜 새 창에서 여나:</strong> ① Copilot(특히 Agent 모드)의 파일·도구 범위가 이 프로젝트로 한정돼 안전하고, ② 강의 문서와 섞이지 않아 컨텍스트·<code>git diff</code> ·커밋이 깔끔하며, ③ 워크스페이스 설정을 프로젝트 단위로 관리할 수 있습니다.</div>
</section>

<section>

  <div>
    <div><h3>기대하는 바</h3><ul><li><code>sample-project-activity-log</code> 만 새 VS Code 창의 root로 연다.</li><li>Day1 Spec Pack과 baseline을 다시 불러오고 source diff가 clean인지 확인한다.</li><li>오늘 구현할 must-have AC를 1~3개로 좁힌다.</li></ul></div>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> 재개 체크 결과, clean branch, 오늘의 must-have AC 목록.</div>
  <ul>
    <li>baseline이 통과하는가(혹은 실패 원인이 기록되었는가)?</li>

<template id="embedded-source-002"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>S50</strong><span>에이전트형 SDLC 단계 매핑</span><span>4. 전통 SDLC 단계 + Agentic 운영 레이어 매핑</span></p><section>
      <h2>4. 전통 SDLC 단계 + Agentic 운영 레이어 매핑</h2>
      <p>각 단계를 <em>핵심 질문 → 전통 SE 개념(ref/260628.md) → 에이전트 오버레이 → 한 줄 인사이트</em> 로 매핑한다. <strong>S0~S6</strong> 은 기본 생애주기 단계에 가깝고, <strong>S7(비용)·S8(플랫폼/조직)·S9(거버넌스)</strong> 는 단계라기보다 전 단계에 걸치는 <em>횡단(cross-cutting) 역량·통제면</em> 으로 읽는 것이 정확하다.</p>
      <table>
        <thead><tr><th>단계</th><th>핵심 질문</th><th>전통 SE 개념</th><th>에이전트 오버레이</th><th>인사이트</th></tr></thead>
        <tbody>
          <tr>
            <td>S0. 의도·문제 정의</td>
            <td>왜 이것을 만드는가?</td>
            <td>Systems Thinking · Product Discovery · Impact Mapping · Wardley Mapping · JTBD</td>
            <td>Intent Analysis — 모호한 요청을 검증 가능한 목표로 정제</td>
            <td>에이전트의 첫 실패는 코드가 아니라 <strong>의도 오해</strong> 에서 온다.</td>
          </tr>
          <tr>
            <td>S1. 요구사항·명세</td>
            <td>무엇을 해야 하는가?</td>
            <td>Requirements Engineering · BDD · Specification by Example · Example Mapping · EARS · Acceptance Criteria</td>
            <td>Spec-Driven Development — 기계가 읽는 명세를 작업 기준으로. Living Documentation</td>
            <td>명세가 곧 통제다. vibe coding 대신 명세로 범위·검증 기준을 고정한다.</td>
          </tr>
          <tr>
            <td>S2. 도메인·아키텍처 설계</td>

            <td>DDD · Event Storming · Clean/Hexagonal · ADR · Threat Modeling · Evolutionary Architecture</td>
            <td>설계 규칙·제약을 컨텍스트로 제공(필요 시 MCP로 외부 맥락 연결). BDD가 외부 행동, DDD가 내부 경계</td>
            <td>AI가 결정을 빨리 제안할수록 <strong>ADR(결정 기록)</strong> 의 가치가 커진다.</td>
          </tr>
          <tr>
            <td>S3. 구현</td>
            <td>어떻게 안전하게 만드는가?</td>
            <td>TDD · Refactoring · SOLID · Pair/Mob · Static Analysis</td>
            <td>Human+Agent pair · Hooks(결정적 통제) · 권한/제약 레이어</td>
            <td>일부 팀 경험상 AI가 mock-heavy 테스트를 선호할 수 있어 state/result 검증 기준을 함께 명시.</td>
          </tr>
          <tr>
            <td>S4. 검증·품질</td>
            <td>제대로 만들었는가?</td>
            <td>Test Pyramid · ATDD · Contract Testing · Mutation · Shift-left · Code Review</td>
            <td>Harness의 Verify 축 · evaluator 게이트 · 계약 기반 검증 강화</td>

          <tr>
            <td>S5. 배포·보안</td>

            <td>CI/CD · GitOps · IaC · Progressive Delivery · Feature Flags · DevSecOps</td>
            <td>Policy-as-Code·Rulesets·branch protection·approvals로 통제, 필요 시 MCP로 외부 맥락 연결 · Push Protection</td>
            <td>보안·정책은 배포 전 스캔이 아니라 <strong>설계·파이프라인에 내장</strong> (shift-left)한다.</td>

            <td>관측은 측정에서 끝나지 않고 다음 라운드의 <strong>명세 입력</strong> 이 된다.</td>

            <td>토큰/credit 사용을 설계 단계로 당겨 비용 의사결정에 반영</td>
            <td>비용은 운영에서 드러나지만 <strong>설계·배포 선택</strong> 이 비용 구조를 크게 좌우한다(shift-left).</td>
          </tr>
          <tr>
            <td>S8. 플랫폼·조직 확장</td>
            <td>조직 규모로 반복 가능한가?</td>
            <td>Platform Engineering · IDP · Golden Path · Scorecard · Self-service · Team Topologies</td>
            <td>Agentic DevOps를 제품화 · Golden Path에 agent harness 내장</td>
            <td>조직 규모·복잡성이 커질수록 <strong>Platform Engineering</strong> 의 필요성과 효과가 빠르게 커진다.</td>
          </tr>
          <tr>
            <td>S9. 거버넌스·폐루프</td>
            <td>자율성을 어떻게 통제하는가?</td>
            <td>Traceability · AI Governance · ADR · DORA Metrics</td>
            <td>LLMOps · Human-in-the-loop · Control/Observe/Verify 3축 · 운영→Spec 폐루프</td>
            <td>실패의 상당수가 <strong>명세·통제·검증</strong> 의 부재에서 오지만, 모델 선택·한계도 중요한 변수다.</td>
          </tr>
        </tbody>
      </table>
    </section></article></template>

<template id="embedded-source-004"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>A46</strong><span>에이전트형 아키텍처 설계 가이드</span><span>3. 설계 원칙</span></p><section>
    <h2>3. 설계 원칙</h2>
    <div>
      <div><h3>1. Autonomy is bounded</h3><p>agent는 목표를 수행할 수 있어야 하지만, 무한 반복·무한 도구 호출·무제한 비용을 허용하면 안 됩니다. 모든 loop에는 max step, retry cap, budget cap, stop condition이 있어야 합니다.</p></div>
      <div><h3>2. Tools are privileges</h3><p>tool은 함수가 아니라 권한입니다. read, write, destructive, external-publication, billing, production-deploy를 다른 승인 레벨로 나눕니다.</p></div>
      <div><h3>3. Memory is evidence-bound</h3><p>memory는 편의가 아니라 장기 상태입니다. 출처, 생성 시각, owner, expiry, confidence, redaction 상태를 기록하지 않으면 stale/poisoned memory가 됩니다.</p></div>
      <div><h3>4. RAG is not truth</h3><p>retrieval은 답변 근거 후보를 가져올 뿐입니다. source freshness, ACL, citation span, claim/source matrix, contradiction check가 필요합니다.</p></div>
      <div><h3>5. Evaluation precedes scale</h3><p>agent를 배포하기 전 golden task, adversarial task, regression set, tool failure case를 먼저 만듭니다. eval 없는 agentic system은 재현 가능한 시스템이 아닙니다.</p></div>
      <div><h3>6. Human gate is design, not fallback</h3><p>사람 승인은 실패했을 때 붙이는 임시 장치가 아니라, 고위험 action의 정상 경로입니다. 승인 지점, owner, SLA, 증거 번들을 설계에 넣어야 합니다.</p></div>
    </div>
  </section></article></template>
<template id="embedded-source-005"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>S28</strong><span>Copilot 에이전트형 SDLC 수명주기</span><span>6. Governance and Policy Model</span></p><section>
      <h2>6. Governance and Policy Model</h2>
      <div>
        <div><h3>Instructions</h3><p><code>copilot-instructions.md</code>, <code>AGENTS.md</code>, prompt files, repo docs로 build/test/run/deploy 규칙을 agent에게 준다. instruction은 권한이 아니라 맥락이므로 branch/ruleset/checker가 필요하다.</p></div>
        <div><h3>Rulesets</h3><p>branch protection, rulesets, CODEOWNERS, required checks, merge queue로 agent PR도 기존 팀 정책 아래 둔다. agent를 우회 actor로 두는 경우에는 별도 risk acceptance가 필요하다.</p></div>
        <div><h3>Tool Boundary</h3><p>MCP server, CLI command, Actions workflow, external API는 allowlist와 least privilege로 제한한다. tool schema도 context budget과 보안 표면에 영향을 준다.</p></div>
      </div>
      <table>
        <thead><tr><th>권한</th><th>허용 예시</th><th>승인 필요</th><th>금지 예시</th></tr></thead>
        <tbody>
          <tr><td>Read</td><td>코드 검색, docs 읽기, issue/PR 맥락 요약</td><td>고객 데이터, private incident log</td><td>secret/plaintext token 노출</td></tr>
          <tr><td>Write</td><td>branch commit, test/doc update, draft PR</td><td>schema/data migration, security policy change</td><td>main 직접 push, 승인 없는 destructive write</td></tr>
          <tr><td>Execute</td><td>unit test, lint, build, local safe script</td><td>deploy, database migration, external write API</td><td>secret exfiltration, public posting, untrusted install</td></tr>
          <tr><td>Approve</td><td>none</td><td>human CODEOWNER/release owner</td><td>agent self-approval, reviewer replacement claim</td></tr>
        </tbody>
      </table>
    </section></article></template>
<template id="embedded-source-006"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>V52</strong><span>Copilot VS Code 기능 가이드</span><span>6. 내장 에이전트: Agent · Plan · Ask</span></p><section>
      <h2>6. 내장 에이전트: Agent · Plan · Ask</h2>
      <p>세션마다 <strong>내장 에이전트</strong> (Agent, Plan, Ask)를 고르거나, 특정 역할에 특화된 <strong>커스텀 에이전트</strong> 를 쓸 수 있다. 세션 설정에서 에이전트 유형·권한 수준·언어 모델을 함께 지정한다.</p>

        </tbody>

<template id="embedded-source-007"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>A46</strong><span>에이전트형 아키텍처 설계 가이드</span><span>4. Reference Architecture</span></p><section>
    <h2>4. Reference Architecture</h2>
    <p>운영 가능한 agentic system은 아래처럼 plane을 분리합니다. 단일 “agent 서버”로 모든 것을 처리하면 권한, 비용, 관측, rollback 경계가 흐려집니다.</p>
    <div><pre>Reference flow

User / App / GitHub Issue / Scheduled Trigger
  -&gt; Entry &amp; Identity Layer
      - user/session/repo/tenant identity
      - task contract and risk tier
  -&gt; Agent Orchestrator
      - router, planner, executor, evaluator, human gate
      - max step, retry cap, timeout, budget cap
  -&gt; Policy &amp; Guardrail Layer
      - input/output policy, tool allowlist, PII/secret redaction
      - prompt injection and excessive agency checks
  -&gt; Model Gateway / Router
      - model selection, fallback, cache, quota, cost policy
  -&gt; Knowledge Layer
      - RAG, source ACL, vector/keyword/graph retrieval, citation
  -&gt; Memory Layer
      - short-term state, long-term preferences, episodic task records
  -&gt; Tool Broker / Sandbox
      - MCP/function calling, API adapter, browser/code execution, approval
  -&gt; Eval &amp; Observability
      - trace, metrics, logs, golden task eval, incident/runbook feedback
  -&gt; Artifact / PR / Response
      - answer, diff, PR, ticket update, report, blocked decision</pre></div>
    <div>
      <div>Entry</div>
      <div>Orchestrator</div>
      <div>Policy</div>
      <div>Model Router</div>
      <div>Knowledge</div>
      <div>Tool Broker</div>
      <div>Eval/Ops</div>
    </div>
    <table>
      <thead><tr><th>Plane</th><th>책임</th><th>상태</th><th>주요 실패</th><th>필수 통제</th></tr></thead>
      <tbody>
        <tr><td>Entry &amp; Identity</td><td>누가, 어떤 권한으로, 어떤 작업을 요청했는지 고정</td><td>session, actor, tenant, repo, risk tier</td><td>권한 혼동, tenant leak</td><td>OIDC/SSO/RBAC, task contract</td></tr>
        <tr><td>Orchestrator</td><td>작업 분해, loop 실행, 상태 전환</td><td>plan, step state, retry, checkpoint</td><td>무한 loop, stale plan</td><td>step cap, timeout, checkpoint</td></tr>
        <tr><td>Policy/Guardrail</td><td>입출력, 도구, 데이터 경계 판단</td><td>policy version, denial reason</td><td>prompt injection, over-permission</td><td>allowlist, redaction, approval</td></tr>
        <tr><td>Model Gateway</td><td>모델 선택, fallback, 비용·latency 제어</td><td>model id, prompt version, cache key</td><td>비용 폭증, 잘못된 모델</td><td>budget, router rule, circuit breaker</td></tr>
        <tr><td>Knowledge</td><td>문서·검색·코드·그래프 검색</td><td>source id, chunk, ACL, freshness</td><td>stale retrieval, citation mismatch</td><td>source metadata, eval, freshness gate</td></tr>
        <tr><td>Memory</td><td>단기/장기 기억과 피드백 보존</td><td>preference, episode, summary</td><td>memory poisoning, privacy leak</td><td>provenance, expiry, human review</td></tr>
        <tr><td>Tool Broker</td><td>MCP/API/browser/code execution 연결</td><td>tool manifest, call log, result</td><td>unsafe action, schema drift</td><td>sandbox, read/write split, audit</td></tr>
        <tr><td>Eval/Ops</td><td>품질·안전·비용·신뢰성 측정</td><td>trace, metrics, eval result</td><td>관측 불가, regression</td><td>OpenTelemetry, golden tasks, alerts</td></tr>
      </tbody>
    </table>
  </section></article></template>
<template id="embedded-source-008"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>V52</strong><span>Copilot VS Code 기능 가이드</span><span>7. 컨텍스트 추가 방법</span></p><section>
      <h2>7. 컨텍스트 추가 방법</h2>
      <p>좋은 컨텍스트가 좋은 답을 만든다. VS Code는 여러 방식으로 컨텍스트를 주입한다.</p>
      <div>
        <div><h3>Implicit context</h3><p>현재 파일·선택 영역·파일 이름을 자동 포함. 에이전트는 필요 시 스스로 컨텍스트를 더 모은다.</p></div>
        <div><h3>#-mentions</h3><p>입력창에 <code>#</code> 로 명시 참조: <code>#file</code>, 폴더, 심볼, <code>#codebase</code>, <code>#terminalSelection</code>, <code>#fetch</code> 같은 도구.</p></div>
        <div><h3>Vision(이미지)</h3><p>스크린샷·UI 목업을 첨부해 프롬프트 컨텍스트로 사용. <strong>Copilot vision은 2026-07-01 GA</strong> (GitHub Changelog).</p></div>
        <div><h3>Browser elements</h3><p>통합 브라우저에서 요소를 선택해 HTML·CSS·스크린샷을 컨텍스트로 추가.</p></div>
      </div>
      <p><strong>Image carousel</strong> <span>Experimental</span>: <code>imageCarousel.chat.enabled</code> 를 켜면 채팅 응답의 이미지/영상(예: 통합 브라우저·Playwright·MCP 서버 결과)을 전용 캐러셀 뷰로 본다.</p>
      <div><strong>사용처</strong> — 버그 리포트 스크린샷을 붙여 “이 화면의 오류를 재현·수정”을 요청하거나, <code>#codebase</code> 로 “이 규칙이 어디에 구현됐는지” 전역 탐색을 시킨다.</div>
    </section></article></template>
<template id="embedded-source-009"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>V52</strong><span>Copilot VS Code 기능 가이드</span><span>11. 변경 검토와 안전 장치</span></p><section>
      <h2>11. 변경 검토와 안전 장치</h2>
      <p>AI가 파일을 바꾼 뒤에는 반드시 검토하고 수락/폐기한다. VS Code는 이를 돕는 장치를 제공한다.</p>
      <div>
        <div><h3>Inline diffs</h3><p>변경 파일에서 인라인 diff를 보고, 오버레이 컨트롤로 편집을 넘나들며 개별로 Keep/Undo.</p></div>
        <div><h3>Checkpoints</h3><p>채팅 도중 주요 시점의 파일 스냅샷을 자동 생성해 이전 상태로 롤백.</p></div>
        <div><h3>Stage to accept</h3><p>Source Control에서 스테이지하면 대기 편집을 수락, 폐기하면 대기 편집도 폐기.</p></div>
      </div>
      <h3>승인·정책</h3>
      <ul>
        <li><strong>Approvals &amp; Permissions</strong>: 터미널·편집 등 위험 도구 실행에 승인 요구.</li>
        <li><strong>관리자 정책</strong>: 에이전트 능력, MCP 서버/확장 제한, 컴플라이언스 강제로 통제된 기본 경험 제공.</li>
      </ul>
      <h3>문제 진단</h3>
      <p><strong>Agent Logs</strong> 는 도구 호출·LLM 요청·프롬프트 파일 탐색을 시간순 이벤트로 보여주고, <strong>Chat Debug</strong> 뷰는 각 상호작용의 원시 시스템/사용자 프롬프트·컨텍스트·도구 페이로드를 보여준다. 왜 그렇게 답했는지 추적할 때 쓴다.</p>
    </section></article></template>
<template id="embedded-source-010"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>D2S1</strong><span>과정 D2·S1 · 하네스 기초</span><span>하네스 (1) 기초 — 자연어 제약을 검증으로 (VS Code Agent)</span></p><main>


<header>
  <div>DAY 2 · SESSION 1 · 09:30–10:40 (70m)</div>
  <h1>하네스 (1) 기초 — 자연어 제약을 검증으로 (VS Code Agent)</h1>
  <p><strong>하네스 엔지니어링</strong> 의 개념(자연어 제약 → 실행 가능한 검증)을 세우고, <strong>VS Code Agent 모드</strong> 를 그냥 실행하지 않고 <strong>도구 권한을 좁히고 로그를 남기는</strong> 습관을 만듭니다. 도구 승인·denyList·도구 호출 내역을 다루고, 그 기록을 해석하는 법까지 익힙니다.</p>
  <div><span><strong>HE-01</strong> 하네스 엔지니어링</span> <span><strong>CF-11</strong> Agent 모드</span> <span><strong>HE-13</strong> Logging-first</span> <span><strong>CF-01</strong> Chat fallback</span></div>
</header>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li>하네스 = "자연어 제약을 로컬에서 실행 가능한 검증/게이트로 바꾸는 작업"임을 이해한다(<span>HE-01</span>).</li>
    <li>VS Code Agent 모드에서 <strong>도구 실행 승인</strong> ·터미널 자동승인 <strong>denyList</strong> ·<strong>도구 호출 내역/세션 로그</strong> 로 권한과 로그를 제어한다.</li>
    <li>실행 로그를 읽고 "무엇을 시도했고 왜 멈췄는가"를 해석한다.</li>
  </ul>
</section>

<section>
  <h2>이 세션의 활동별 권장 모델</h2>
  <table>
    <caption>D2·S1 활동 · 책임 주체 · 권장 모델</caption>
    <thead><tr><th>활동</th><th>주체·과업군</th><th>권장 모델</th><th>한 줄 이유</th></tr></thead>
    <tbody>
      <tr><td>git 읽기·로그 요약</td><td>AI 보조 · F4</td><td><strong>Claude Sonnet 5</strong></td><td>결함·근거 검토를 3회 품질 gate로 재현</td></tr>
      <tr><td>도구 권한 승인·거부 결정</td><td>사람 · N0</td><td><strong>모델 미사용</strong></td><td>권한과 위험 수용은 사람이 결정</td></tr>
      <tr><td>policy-check</td><td>도구 · N0</td><td><strong>모델 미사용</strong></td><td>정책 위반은 결정론적 검사로 차단</td></tr>
    </tbody>
  </table>
  <div><strong>선정 기준:</strong> blind-v2 132 primary·35 external screen·29 confirmation attempts(12 stable)에서 세 번 모두 품질 gate를 통과한 후보를 비교했습니다. TTFT·p95·실제 청구액이 아니며 강의 당일 조직 정책과 세션 로그를 확인합니다. <a href="../aibuild-squad/output/260627_edu/edu_context/%ED%99%9C%EB%8F%99%EB%B3%84-%EB%AA%A8%EB%8D%B8-%EC%B6%94%EC%B2%9C-%EB%B3%B4%EA%B3%A0%EC%84%9C-2026-07-11.html" target="_blank" rel="noopener noreferrer">전체 근거 보기</a></div>
</section>

<section>
  <h2>미니강의 — 프롬프트 약속을 실행 밖으로 옮긴다</h2>
  <p>Day1에서 가드레일을 <em>프롬프트에 적었습니다</em>. 하지만 프롬프트 안의 약속은 모델이 어길 수 있습니다. 하네스는 그 약속을 <strong>실행 경로 바깥의 결정론적 검사</strong> (<span>HE-06</span>)로 옮깁니다. 오늘(S1)은 그 첫 단계로 Agent 모드의 도구 권한과 로그를 다룹니다.</p>
  <div><strong>주의:</strong> VS Code Agent 모드의 도구·터미널 자동승인 설정 키는 버전에 따라 다를 수 있습니다. 실습 시작 시 현재 VS Code 버전의 <strong>설정 화면</strong> (검색: "auto approve", "terminal")을 기준으로 삼습니다. Agent 모드가 안 되면 Copilot Chat(<span>CF-01</span>)으로 관찰하고 강사 데모 로그를 분석합니다.</div>
</section>

<section>
  <h2>VS Code 기반 — Agent 모드에서 같은 하네스</h2>
  <p>참가자 대부분은 <strong>VS Code Copilot</strong> 을 씁니다. 하네스의 핵심(권한 최소화·로그·차단)은 <strong>Agent 모드</strong> 에서 만듭니다. Chat 모드 선택기의 <code>Ask · Edit · <strong>Agent</strong></code> 중 Agent가 도구를 실제로 실행하는 경로입니다.</p>
  <table>
    <caption>하네스 요소 ↔ VS Code Copilot Agent 방법</caption>
    <thead><tr><th>하네스 요소</th><th>VS Code Copilot Agent 방법</th></tr></thead>
    <tbody>
      <tr><td>도구 권한</td><td>Agent 모드의 <strong>도구 실행 승인</strong> 프롬프트 + 터미널 자동승인 allow/deny 목록(설정)</td></tr>
      <tr><td>위험 명령 차단</td><td>터미널 자동승인 <strong>denyList</strong> + <code>.github/copilot-instructions.md</code> 에 금지 작업 명시</td></tr>
      <tr><td>경로/웹 경계</td><td>워크스페이스 신뢰 범위 + 도구 승인 시 확인</td></tr>
      <tr><td>로그/관측</td><td>Chat의 <strong>도구 호출 내역</strong> 표시 + 세션 로그(<code>~/.copilot/session-state/&lt;id&gt;/events.jsonl</code>)</td></tr>
      <tr><td>결정론적 검증</td><td>결과를 <strong>로컬 게이트</strong> (<code>npm run policy-check</code> ·git hook)로 검사(S2)</td></tr>
    </tbody>
  </table>
  <div><strong>왜 로컬 게이트가 필요한가:</strong> <strong>모델·UI 승인만으로는 100% 막지 못합니다</strong>. 그래서 "실행 경계 밖"의 <code>policy-check</code> (D2·S2)가 최종 안전장치입니다.</div>
  <div><strong>설정 키 주의:</strong> VS Code의 도구·터미널 자동승인 설정 키는 버전에 따라 다릅니다(설정 검색에서 "auto approve", "terminal" 등). 현재 VS Code 버전의 설정 화면을 기준으로 삼으세요.</div>
</section>

<section>
  <h2>실습 — 권한을 좁힌 Agent 실행</h2>
  <div><div>STEP 1 · Agent 모드 준비</div>
  <p>Chat 모드 선택기를 <strong>Agent</strong> 로 두고 워크스페이스를 신뢰(Trust)로 엽니다. 설정에서 터미널 자동승인(allow/deny)과 도구 승인 동작을 확인합니다.</p></div>
  <div><div>STEP 2 · 권한을 좁힌 요청</div>
  <p>Agent에게 "현재 브랜치 변경 파일과 테스트 명령 후보를 요약"을 요청하고, 도구 실행 승인에서 <strong>git 읽기만 허용</strong> 하며 <code>rm</code> ·force 같은 위험 명령은 <strong>거부(denyList)</strong> 합니다. <code>.github/copilot-instructions.md</code> 에 금지 작업을 명시해 두면 매번 반복하지 않습니다.</p></div>
  <div><div>STEP 3 · 도구 호출 내역/로그 해석</div>
<pre><code>[작업] 아래 Agent 도구 호출 내역(또는 세션 로그 events.jsonl)을 보고 요약해라.
[출력] 실행 의도 · 사용 도구 · 차단된 작업 · 다음에 필요한 권한 · 위험 신호.</code></pre></div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>Agent가 사용할 도구와 거부할 도구를 이유와 함께 구분한다.</li><li>승인 기록(preventive)과 policy-check(detective)를 모두 실행한다.</li><li>실제 호출 내역에서 허용 범위를 넘지 않았는지 설명한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>ALLOW: read, search, scoped test
DENY: prod write, destructive command
이유: 교육 workspace 밖 변경 금지
호출 내역: read 2, test 1, write 0
policy-check: PASS</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> “안전하게 실행” 같은 문장만으로는 부족합니다. 무엇을 허용·거부했고 실제로 어떤 도구가 호출됐는지 재검토할 수 있어야 합니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> <code>lab-work/tool-approval.md</code> 에 허용 도구·거부 도구·거부 이유·실제 호출 내역을 기록하고 <code>policy-check</code> 결과와 함께 제출.</div>
  <ul>
    <li>도구 승인에서 허용 도구가 좁혀졌는가(git 읽기 등)?</li>
    <li>denyList로 위험 명령(rm·force)이 명시적으로 막혔는가?</li>
    <li>로그에서 "무엇을 했고 왜 멈췄는가"를 한 문장으로 말할 수 있는가?</li>
  </ul>
  <div><strong>컷라인:</strong> 개념(권한 최소화·로깅)만 잡으면 통과입니다. Agent 모드가 어려운 환경은 강사 데모의 도구 호출 내역/로그 분석으로 대체합니다.</div>
</section>

<section>
  <h2>참조 심화 — 차단 패턴 · logging-first</h2>
  <h3>차단 권장 명령 패턴</h3>
  <p><code>rm -rf</code> · <code>git push --force</code> · <code>kubectl delete</code> · <code>terraform apply</code> · <code>git rebase -i</code> — 위험도에 따라 warn 또는 block.</p>
  <div><strong>핵심 원칙:</strong> "프롬프트만으로는 안전하지 않다 — 정책은 실행 경계에 붙인다." 실행 <strong>전(pre-check)</strong> 과 <strong>후(post-check)</strong> 를 모두 검사하고, 처음 1~2주는 <strong>log-only</strong> 로 오탐을 관찰한 뒤 차단으로 승격합니다(logging-first).</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>
  <ul>
    <li>권한 제한 없이 Agent 실행 → 에이전트가 무엇이든 할 수 있는 상태. 항상 도구 승인·denyList로 좁힙니다.</li>
    <li>프롬프트에 모델명을 적고 "그 모델로 돈다"고 가정 → 보장되지 않습니다(<span>CF-10</span>, S2에서 자세히).</li>
  </ul>
  <div><strong>공유 포인트:</strong> "deny-tool로 막은 위험 명령" 사례. 팀 보안 관점에서 바로 쓸 수 있는 공유 거리입니다.</div>
</section>

<section>
  <h2>이 세션의 실행 코드 (Hands-on)</h2>
  <div><strong>권한을 좁힌 Agent 실행 + 결정론적 게이트 확인:</strong></div>
<pre><code># (새 창) sample-project-activity-log — VS Code Agent 모드에서
npm run lab -- start d2-s1
# lab-work/tool-approval.md에 preventive 승인/거부/이유/호출 내역 작성
npm run policy-check
npm run lab -- check d2-s1   # 승인 기록 + detective 검사 모두 필요</code></pre>
  <p>권한·로그의 최종 안전장치는 로컬 게이트입니다(D2·S2). 전체 지도: <code>README.md</code></p>
</section>

<template id="embedded-source-011"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>H21</strong><span>하네스 역사와 핵심 개념</span><span>3. Harness Engineering Concept Model</span></p><section>
      <h2>3. Harness Engineering Concept Model</h2>
      <p><strong>Harness</strong> 가 대상 주변의 실행 장치라면, <strong>Harness Engineering</strong> 은 그 장치를 반복적으로 설계·측정·개선하는 일이다. 고전적 test harness의 driver, stub, fixture, runner 원리는 현대 AI-agent 환경에서 prompt와 context, model과 tool, memory와 state, external action, human approval, rollback까지 확장된다.</p>
      <div>target system or agent goal
  -&gt; driver/adapter: input, fixture, mock, stub, tool wrapper
  -&gt; execution environment: runner, pipeline, sandbox, model/runtime, retry budget
  -&gt; observation: logs, traces, metrics, artifacts, cost telemetry
  -&gt; assertion/evaluation: unit assertion, integration check, benchmark, LLM evaluator, human review
  -&gt; policy gate: permission, source boundary, compliance rule, budget, No-Go trigger
  -&gt; audit/rollback: decision log, release record, rollback owner, RTO, completion criteria</div>
      <div>
        <div><h3>Driver / Adapter</h3><p>테스트 대상이나 agent를 직접 바꾸지 않고도 입력, fixture, mock, stub, tool call을 통제한다.</p></div>
        <div><h3>Observation Layer</h3><p>unit test result부터 CI log, trace, metric, cost telemetry, model output artifact까지 실행의 흔적을 남긴다.</p></div>
        <div><h3>Executable Gate</h3><p>assertion, benchmark, policy rule, <code>scripts/check_*.py</code>, package script가 구조적 누락과 금지 조건을 검증한다.</p></div>
        <div><h3>Audit Trail</h3><p><code>rounds</code> 와 ADR은 왜 이 판단을 했고 어떤 실패를 고쳤는지 다음 세션이 이어받을 수 있게 만든다.</p></div>
        <div><h3>Operations Loop</h3><p>SLI/SLO, breach action, No-Go trigger, owner를 두어 산출물 품질을 회고 가능한 운영 지표로 바꾼다.</p></div>
        <div><h3>Rollback Layer</h3><p>잘못된 공개, stale claim, 민감정보 노출, checker 실패가 생겼을 때 누가 언제까지 무엇으로 되돌리는지 고정한다.</p></div>
      </div>
    </section></article></template>
<template id="embedded-source-012"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C04</strong><span>Copilot CLI 하네스 엔지니어링</span><span>5. 하네스 엔지니어링 개요</span></p><section>
      <h2>5. 하네스 엔지니어링 개요</h2>
      <div>
        <div><h3>관찰</h3><p>사용자 프롬프트, 도구 실행, 오류를 로그로 남겨 AI 실행 흐름을 추적한다.</p></div>
        <div><h3>통제</h3><p>위험한 명령, 민감 경로, 네트워크 호출, 배포 명령을 실행 전 검사한다.</p></div>
        <div><h3>반복 개선</h3><p>실패 패턴을 모아 wrapper 정책, 테스트, runbook, 팀 교육으로 되돌린다.</p></div>
      </div>
      <div>
        <div><strong>Prompt</strong> <span>사용자 요청 제출</span></div>
        <div><strong>Log</strong> <span>요청 메타데이터 기록</span></div>
        <div><strong>Pre-check</strong> <span>도구 실행 전 정책 검사</span></div>
        <div><strong>Tool</strong> <span>파일 수정·명령 실행</span></div>
        <div><strong>Post-check</strong> <span>결과와 오류 수집</span></div>
        <div><strong>Improve</strong> <span>정책·테스트 개선</span></div>
      </div>
      <div><strong>핵심 관점:</strong> 프롬프트만으로 안전성을 보장하려 하지 말고, AI가 실제로 도구를 쓰는 지점에 실행 가능한 검사를 붙인다.</div>
    </section></article></template>
<template id="embedded-source-013"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C04</strong><span>Copilot CLI 하네스 엔지니어링</span><span>9. 하네스 실무 사용법</span></p><section>
      <h2>9. 하네스 실무 사용법</h2>
      <div>
        <article>
          <h3>위험 명령 차단</h3>
          <p><strong>기능:</strong> 파괴적 명령을 실행 전에 멈춘다.</p>
          <p><strong>설명:</strong> AI가 제안한 명령이 의도치 않게 파일, 클러스터, 원격 저장소를 바꿀 수 있다.</p>
          <p><strong>사용법:</strong> wrapper script와 <code>--deny-tool</code>, CI 정책으로 <code>rm -rf</code>, <code>git push --force</code>, <code>kubectl delete</code>, <code>terraform apply</code> 를 승인 없이 실행하지 못하게 한다.</p>
        </article>
        <article>
          <h3>민감 경로 보호</h3>
          <p><strong>기능:</strong> secrets, prod config, 인증서, 배포 매니페스트 변경을 감시한다.</p>
          <p><strong>설명:</strong> 중요한 파일은 AI가 편집할 수 있어도 추가 검토가 필요하다.</p>
          <p><strong>사용법:</strong> <code>.env</code>, <code>secrets/</code>, <code>prod/</code>, <code>k8s/prod</code> 경로 쓰기를 warn 또는 block으로 둔다.</p>
        </article>
        <article>
          <h3>감사 로그 남기기</h3>
          <p><strong>기능:</strong> 누가 어떤 요청으로 어떤 도구를 실행했는지 추적한다.</p>
          <p><strong>설명:</strong> 문제 발생 시 프롬프트, 명령, 파일 변경, 오류를 연결해야 한다.</p>
          <p><strong>사용법:</strong> <code>--log-dir</code>, <code>--log-level</code>, <code>--output-format json</code>, wrapper metadata로 JSONL 로그를 남긴다.</p>
        </article>
        <article>
          <h3>테스트 강제 실행</h3>
          <p><strong>기능:</strong> 변경 후 검증 누락을 줄인다.</p>
          <p><strong>설명:</strong> AI가 코드를 바꾼 뒤 테스트를 건너뛰면 결함이 통과할 수 있다.</p>
          <p><strong>사용법:</strong> wrapper 또는 CI에서 특정 파일 변경을 감지하고 <code>npm test</code>, <code>pytest</code>, <code>terraform validate</code> 를 필수 gate로 둔다.</p>
        </article>
      </div>
      <h3>간단한 정책 스크립트 예시</h3>
      <pre><code>#!/usr/bin/env sh
set -eu

prompt="${1:-}"
mode="${HARNESS_MODE:-log}"

if printf '%s' "$prompt" | grep -E 'rm -rf|git push --force|kubectl delete|terraform apply' &gt;/dev/null; then
  printf '{"decision":"block","reason":"dangerous command requires human approval"}\n'
  if [ "$mode" = "block" ]; then
    exit 2
  fi
fi

printf '{"decision":"allow"}\n'
exec gh copilot -- -p "$prompt" --log-dir .copilot-harness/logs --output-format json</code></pre>
  <p>중요한 점은 정책 로직을 프롬프트 문장 안에만 두지 않고, wrapper/CI/권한 플래그처럼 실행 경로 바깥에도 둔다는 것이다.</p>
    </section></article></template>

즉시 파일럿 중단, 보안 리뷰</td></tr><tr><td>AI 생성 PR 라벨링률</td><td>95% 이상</td><td>PR label, template checklist</td><td>라벨 없는 PR merge block</td></tr><tr><td>required checks 통과율</td><td>merge 전 100%</td><td>rulesets, CI status</td><td>merge block</td></tr><tr><td>AI Credits attribution coverage</td><td>팀/사용자/기능/작업 등급별 95% 이상 추적</td><td>주간 usage report</td><td>파일럿 확산 중단, 계정/모델 정책 재검토</td></tr><tr><td>월 비용 예측 오차</td><td>실제 비용이 예측 대비 +20% 초과하지 않음</td><td>월간 billing/export</td><td>premium 모델 제한, 승인 기반 사용 전환</td></tr><tr><td>모델 오류율</td><td>529/rate limit/timeout 2% 이하</td><td>CLI/IDE wrapper log</td><td>fallback mode 진입, 신규 생성 작업 중단</td></tr><tr><td>원격 명령·모델 감사 커버리지</td><td>100% actor/session/repo/command/result/requested model/actual model/model/fallback reason 기록</td><td>bot/session log</td><td>원격 제어 중단, 감사 로그 복구 전 재개 금지</td></tr><tr><td>AI 생성 변경 장애율</td><td>병합 후 7일 내 Sev2+ 0건</td><td>incident ticket, PR label</td><td>파일럿 freeze, postmortem, RALF 재검증</td></tr></tbody></table></section></article></template>

<template id="embedded-source-016"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>H08</strong><span>Agentic DevOps 하네스 세미나</span><span>6. 실습 목표: 우리 팀용 Agentic DevOps Harness Kit</span></p><section><h2>6. 실습 목표: 우리 팀용 Agentic DevOps Harness Kit</h2><p>기존 단일 “쿠폰 API 구현” 시연은 유지하되, OK캐쉬백 또는 실제 규제 서비스와 무관한 가상 더미 커머스 예제로 한정한다. 최종 산출물은 팀이 바로 가져갈 수 있는 개발자용 운영 키트다.</p><div><div><h3>시연 시나리오</h3><p>더미 커머스 서비스의 “주문 시 쿠폰 적용 API”를 요구사항·구현·테스트·보안·PR·CI·카나리·롤백까지 진행한다. 실제 고객정보, 운영 로그, 키/토큰, 규제 대상 업무 정보, OK캐쉬백 업무 정보는 사용하지 않는다.</p></div><div><h3>실습 산출물</h3><ul><li><code>AI-TOOL-MATRIX.md</code>: Copilot, Cursor, Codex, Claude Code, Gemini 등 도구별 역할·비용·금지 작업</li><li><code>AGENT-HANDOFF.md</code>: 세션 인계 템플릿</li><li><code>SECURITY-GATE.md</code>: 금지 입력·권한·원격 제어 체크</li><li><code>MCP-SKILL-ALLOWLIST.md</code>: MCP/plugin/skill 승인과 dependency auditing 체크</li><li><code>PR-CHECKLIST.md</code>: AI 생성 코드 리뷰 체크리스트</li><li><code>FALLBACK-RUNBOOK.md</code>: 모델 장애·한도 초과 대응</li></ul></div></div><table><thead><tr><th>시간</th><th>구간</th><th>활동</th><th>완료 기준</th></tr></thead><tbody><tr><td>0-10분</td><td>사전 정보와 금지 범위</td><td>팀별 자율 사용, Cursor 일부 사용, 고객 정보/정보보호성 정보/OK캐쉬백 hard block을 공유</td><td>참석자가 자기 업무가 사용 가능/불가/승인 필요 중 어디인지 표시</td></tr><tr><td>10-25분</td><td>개발자 워크플로</td><td>Back-End 중심 API 변경을 기준으로 FE/Mobile/PM 체크포인트를 연결</td><td>요구사항, AC, 테스트, PR 설명 초안 작성</td></tr><tr><td>25-40분</td><td>도구 역할 분리</td><td>Copilot/Claude/Cursor/Codex/Gemini/Local LLM/MCP 역할표 작성</td><td><code>AI-TOOL-MATRIX.md</code> 초안</td></tr><tr><td>40-60분</td><td>하네스 키트</td><td>요구사항, 테스트, 보안, PR, handoff, MCP/skill allowlist 템플릿 연결</td><td>템플릿 5종 초안</td></tr><tr><td>60-75분</td><td>운영 게이트</td><td>비용, 권한, 원격 제어, agent autonomy, 모델 장애, PR 리뷰 SLI/SLO 설계</td><td>팀 파일럿 SLO 5개 선택</td></tr><tr><td>75-90분</td><td>결정/Q&amp;A</td><td>2주 파일럿 Go/No-Go 기준과 다음 PR 액션 3개 합의</td><td>Owner, 기간, 측정 항목 지정</td></tr></tbody></table></section></article></template>
<template id="embedded-source-017"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>H21</strong><span>하네스 역사와 핵심 개념</span><span>12. Limitations</span></p><section>
      <h2>12. Limitations</h2>
      <div>
        <div>
          <h3>검증의 한계</h3>
          <ul>
            <li><strong>Harness PASS is structural validation, not factual verification.</strong></li>
            <li><strong>하네스 PASS는 구조 검증이지 사실 검증이 아니다.</strong></li>
            <li>checker는 필수 섹션, 금지 표현, 민감정보 후보, 표 구조를 확인하지만 외부 사실 최신성을 대신 확인하지 않는다.</li>
            <li>로컬 HTML과 source set은 대부분 derived artifact이므로 official source로 승격하지 않는다.</li>
          </ul>
        </div>
        <div>
          <h3>운영의 한계</h3>
          <ul>
            <li>하네스가 강해질수록 유지보수 비용도 증가한다.</li>
            <li>지나치게 좁은 checker는 좋은 표현과 새 구조를 막을 수 있다.</li>
            <li>지나치게 넓은 checker는 위험 문장을 놓칠 수 있다.</li>
            <li>최종 책임은 owner, reviewer, release gate의 조합에 남는다.</li>
          </ul>
        </div>
      </div>
      <div>따라서 이 보고서의 사용법은 “이 문서를 그대로 외부 사실로 발표”가 아니라, “하네스 개념 설명의 내부 기준선으로 쓰고, 공개 전 source set과 reviewer로 닫기”다.</div>
    </section></article></template>

<section>

  <p>GitHub PR/Actions가 없는 환경에서 동일한 품질 게이트를 <strong>로컬</strong> 에 둡니다(<span>HE-03</span>). Day1에 <em>프롬프트로 적은</em> 가드레일("외부 패키지 금지", "운영 파일 수정 금지" 등)은 모델이 어길 수 있는 <em>말</em> 입니다. 이 세션은 그 약속을 <strong>실행되는 검사(게이트)</strong> 로 바꿉니다.</p>
  <div><strong>이 미니강의에서 정확히 배워야 하는 것</strong>
    <ol>
      <li><strong>'약속을 코드로'의 의미</strong> — Day1에 <em>프롬프트로 적은</em> 가드레일("외부 패키지 금지" 등)은 모델이 어길 수 있는 <em>말</em> 입니다. 그것을 <strong>실행 경계에서 강제되는 검사</strong> 로 옮기는 것이 하네스의 핵심입니다.</li>
      <li><strong>두 층을 구분</strong> — <strong>사전(preventive)</strong> 통제(에이전트가 위험 명령을 <em>아예 못 하게</em> — 권한·차단)와 <strong>사후(detective)</strong> 검사(<code>policy-check</code> 로 금지 파일·secret을 <em>실행 후</em> 잡음). 역할이 다릅니다.</li>
      <li><strong>결정론적이어야 한다</strong> — 게이트는 모델 판단이 아니라 <strong>규칙 기반</strong> 이라 매번 같은 결과를 냅니다. 그래서 "통과 = 안전"을 신뢰할 수 있습니다.</li>
    </ol>
    <span>→ 오늘 손으로 확인할 것: "프롬프트로 막던 것"을 <code>policy-check</code> 가 <strong>코드로</strong> 막아 통과/실패를 결정론적으로 판정하는지.</span>

  <div><strong>산출물:</strong> <code>lab-work/agent-team-canvas.md</code> + 동작 로컬 게이트. starter의 미작성 항목이 남으면 PASS하지 않습니다.</div>

      <tr><td>Small</td><td>Solo · Planner-Generator</td><td>로컬 test</td></tr>
      <tr><td>Medium</td><td>Planner-Generator-Evaluator</td><td>policy-check + 리뷰</td></tr>
      <tr><td>High</td><td>Harness-Gated · Orchestrator-Worker</td><td>approval_id + rollback owner</td></tr>
      <tr><td>Critical</td><td>Control Tower + Human Approval</td><td>100% 사람 리뷰</td></tr>
    </tbody>
  </table>
  <div><strong>원칙:</strong> "리스크 게이트를 통과하는 <em>가장 작은 팀</em> 으로 시작" — 위험이 커지면 Generator를 늘리기 전에 <strong>Evaluator·Harness·Rollback Owner</strong> 를 먼저 추가합니다. Decision Scorecard 4행(목표 명확성·권한 범위·관측성·리스크 정의)으로 점검합니다.</div>
  <h3>도입 로드맵 G0→G4</h3>
  <div>
    <span>G0 읽기전용 파일럿</span> <span>→</span> <span>G1 PR-first(Evaluator)</span> <span>→</span> <span>G2 Harness-gated</span> <span>→</span> <span>G3 Human-gated(approval_id)</span> <span>→</span> <span>G4 SLO 운영</span>
  </div>
  <div><strong>발행 하드게이트:</strong> 결함/주장 비율 <code>CD_ratio &gt; 0.35</code> = 발행 block. <strong>Harness PASS는 구조 검증이지 사실 검증이 아니다</strong> — 사실/보안/배포 승인은 사람이 합니다.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>
  <ul>
    <li>Loop에 중단 조건이 없음 → 무한 반복·비용 폭증. max retry·stop condition을 반드시 넣습니다.</li>
    <li>Evaluator가 "좋아 보임"으로 통과 → 기준 없는 판정. AC·테스트에 근거해 pass/revise/block.</li>
    <li>모든 단계에 고비용 모델 고정 → 비용 낭비. 역할별 라우팅으로 분리합니다.</li>
  </ul>
  <div><strong>공유 포인트:</strong> "내 기능팀 역할 ↔ Agent Teams 매핑"은 팀이 바로 따라 할 수 있는 강력한 공유 자산입니다.</div>
</section>

<template id="embedded-source-020"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>T05</strong><span>Agent Team 구성 가이드</span><span>구성 원칙</span></p><section>
      <h2>구성 원칙</h2>
      <div>
        <div><h3>작게 시작한다</h3><p>처음부터 8명 팀을 만들지 않는다. 단순 작업은 단일 Generator, 실무 작업은 Planner + Generator + Evaluator부터 시작한다.</p></div>
        <div><h3>생성과 검토를 분리한다</h3><p>중요한 산출물은 만든 agent와 검토 agent를 분리한다. 자기검증만으로 끝내면 누락과 편향이 생기기 쉽다.</p></div>
        <div><h3>위험할수록 게이트를 추가한다</h3><p>운영, 보안, 데이터, 비용, 고객 영향이 있으면 Harness, SRE Reviewer, Human Approval을 추가한다.</p></div>
      </div>
      <div><strong>한 줄 기준:</strong> Agent team의 크기는 작업량이 아니라 실패 비용, 되돌릴 수 있는 속도, 검증 필요성으로 결정한다.</div>
    </section></article></template>
<template id="embedded-source-021"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>A48</strong><span>Agent Squad에서 Copilot Agent Teams로</span><span>2. 두 모델 개념 정리</span></p><section>
    <h2>2. 두 모델 개념 정리</h2>
    <p>전환을 논하기 전에, 두 시스템이 “멀티에이전트”라는 같은 단어를 쓰지만 <strong>구조적으로 다른 계층에 있다는 점</strong> 을 분명히 해야 합니다.</p>
    <div>
      <div>
        <h3>Agent Squad (소스)</h3>
        <p>Apache 2.0 오픈소스 프레임워크. <code>pip install agent-squad</code> / <code>npm install agent-squad</code> 로 설치해 <strong>여러분의 애플리케이션 코드 안</strong> 에서 실행됩니다.</p>
        <ul>
          <li><strong>Orchestrator(<code>AgentSquad</code>)</strong> 가 요청을 받음</li>
          <li><strong>Classifier</strong> 가 의도/문맥을 분석해 적합한 에이전트 선택</li>
          <li>선택된 <strong>Agent</strong> (예: <code>BedrockLLMAgent</code>, <code>LexBotAgent</code>, <code>OpenAIAgent</code>)가 처리</li>
          <li><strong>SupervisorAgent</strong> 가 “agent-as-tools”로 팀을 병렬 조율</li>
          <li>대화 이력/컨텍스트를 <strong>storage(DynamoDB 등)</strong> 에 저장</li>
          <li>AWS Lambda·로컬·모든 클라우드에 배포 가능, 스트리밍 지원</li>
        </ul>
      </div>
      <div>
        <h3>Copilot Agent Teams (타깃)</h3>
        <p><code>.github/agents/*.agent.md</code> 선언 파일로 정의되는 <strong>VS Code/GitHub Copilot 내장 기능</strong>. 별도 서버 코드 없이 에디터·Copilot CLI·클라우드 코딩 에이전트에서 동작합니다.</p>
        <ul>
          <li><strong>커스텀 에이전트</strong> = 페르소나(instructions) + 허용 tool + model</li>
          <li><strong>Coordinator 에이전트</strong> 가 <code>agent</code> /<code>runSubagent</code> tool로 위임</li>
          <li><strong>Subagent</strong> 는 <strong>독립 컨텍스트</strong> 에서 작업 후 요약만 반환</li>
          <li>워커는 병렬 실행 가능(예: 멀티퍼스펙티브 리뷰)</li>
          <li><strong>Handoffs</strong> 로 사용자 승인형 순차 워크플로 구성</li>
          <li>워크스페이스/사용자/조직 레벨로 공유, MCP·hooks 연동</li>
        </ul>
      </div>
    </div>
    <div><strong>용어 주의:</strong> “GitHub Copilot Agent Teams”는 공식 단일 제품명이라기보다, VS Code <em>custom agents</em> + <em>subagents</em> (코디네이터-워커 오케스트레이션) 기능 묶음을 가리키는 표현으로 사용합니다. 프론트매터 필드와 <code>chat.subagents.*</code> 같은 설정·프리뷰 상태는 버전에 따라 바뀌므로 도입 시 공식 문서에서 재확인해야 합니다.</div>
  </section></article></template>
<template id="embedded-source-022"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L45</strong><span>AI Agent Loop 분류와 사례</span><span>3. Loop Taxonomy</span></p><section>
    <h2>3. Loop Taxonomy</h2>
    <p>최근 루프들은 이름이 달라도 구성요소는 대체로 <code>plan</code>, <code>act/tool</code>, <code>observe</code>, <code>evaluate</code>, <code>memory</code>, <code>human gate</code> 의 조합입니다.</p>
    <div>
      <div>Plan</div>
      <div>Act / Tool</div>
      <div>Observe</div>
      <div>Evaluate</div>
      <div>Memory</div>
      <div>Human Gate</div>
    </div>
    <table>
      <thead><tr><th>그룹</th><th>대표 루프</th><th>핵심 구조</th><th>주요 효과</th><th>토큰 증가 요인</th></tr></thead>
      <tbody>
        <tr><td>단일 agent 반복형</td><td>ReAct, Tool-use loop</td><td>reason → action/tool → observation 반복</td><td>외부 도구와 단계적 문제해결</td><td>tool result 누적, 반복 횟수</td></tr>
        <tr><td>계획 실행형</td><td>Plan-and-Execute, Graph/State-machine</td><td>planner가 작업을 나누고 executor가 수행</td><td>긴 작업 구조화, checkpoint 가능</td><td>plan context, subtask 수, replan</td></tr>
        <tr><td>품질 개선형</td><td>Reflection, Evaluator-Optimizer, Self-Refine</td><td>초안 → 비판/평가 → 수정</td><td>산출 품질, 오류 감소 가능</td><td>평가자 호출, revision 반복</td></tr>
        <tr><td>지식 연결형</td><td>RAG, Agentic RAG</td><td>retrieve → reason → verify → answer</td><td>근거 기반 답변, 최신성 보강</td><td>검색 결과 chunk, citation 검증</td></tr>
        <tr><td>협업형</td><td>Multi-agent debate, Swarm, Orchestrator-workers</td><td>역할 분리 → 병렬 생성/토론 → 종합</td><td>넓은 탐색, 역할 전문화</td><td>agent 수 × 라운드 수 × 합의 비용</td></tr>
        <tr><td>운영 게이트형</td><td>Human-in-the-loop, PR gate, Approval loop</td><td>proposal → approval → execution → audit</td><td>고위험 작업 통제</td><td>review record, evidence bundle</td></tr>
        <tr><td>장기 자율형</td><td>Computer-use, Coding agent, Memory loop</td><td>환경 관찰 → 행동 → 검증 → 장기 상태 갱신</td><td>복합 작업 자동화</td><td>screen/tool logs, test logs, memory carryover, retries</td></tr>
        <tr><td>동적 생성·코드 오케스트레이션형</td><td>Claude Dynamic Workflows, Code-as-orchestrator</td><td>LLM이 오케스트레이션 스크립트를 생성 → 런타임이 백그라운드 실행 → 수십~수백 subagent fan-out → 종합</td><td>대규모 병렬 작업을 <strong>저컨텍스트</strong> 로 실행</td><td>subagent 수 × 단계 (단 모델 컨텍스트엔 최종 결과만)</td></tr>
      </tbody>
    </table>
  </section></article></template>
<template id="embedded-source-023"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>A48</strong><span>Agent Squad에서 Copilot Agent Teams로</span><span>4. 라우팅 차이: Classifier vs Subagent</span></p><section>
    <h2>4. 라우팅 차이: Classifier vs Subagent</h2>
    <p>가장 본질적인 차이는 <strong>라우팅 주체</strong> 입니다. squad는 별도 Classifier가 결정론에 가깝게 에이전트를 고르고, Agent Teams는 coordinator LLM이 instructions와 워커 <code>description</code> 을 보고 위임을 판단합니다.</p>
    <div>
      <div>
        <h3>Agent Squad: Classifier 라우팅</h3>
        <div>
          <div>User 입력</div>
          <div>Classifier 분석</div>
          <div>Agent 선택</div>
          <div>Agent 처리 → 저장</div>
        </div>
        <p>분류 로직을 코드로 튜닝/오버라이드 가능. 단일 에이전트로 라우팅되는 “전환(switch)” 모델. 잘못된 분류는 디버깅 가능한 결정 지점.</p>
      </div>
      <div>
        <h3>Agent Teams: Coordinator 위임</h3>
        <div>
          <div>User/Task</div>
          <div>Coordinator 판단</div>
          <div>Subagent(s) 위임·병렬</div>
          <div>요약 취합 후 진행</div>
        </div>
        <p>coordinator가 <strong>여러 워커를 순차/병렬로</strong> 부르고 결과를 합성. 컨텍스트 격리로 메인 대화가 깔끔. 위임 판단은 프롬프트 의존이라 비결정적.</p>
      </div>
    </div>
    <div><strong>설계 함의:</strong> squad의 “하나만 고른다(classification → single agent)”를 그대로 옮기려면 coordinator instructions에 <em>“요청당 가장 적합한 워커 하나에만 위임하라”</em> 를 명시하고 <code>agents</code> 목록을 좁혀야 합니다. 반대로 squad의 SupervisorAgent(병렬 팀)는 Agent Teams의 멀티퍼스펙티브 병렬 패턴으로 더 자연스럽게 표현됩니다.</div>
  </section></article></template>
<template id="embedded-source-024"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>T05</strong><span>Agent Team 구성 가이드</span><span>Adoption Roadmap</span></p><section>
      <h2>Adoption Roadmap</h2>
      <p>agent team은 한 번에 전사 표준으로 밀어붙이기보다, 작은 파일럿에서 게이트를 검증한 뒤 확산하는 편이 안전하다.</p>
      <div>
        <div><div>G0</div><div><h3>Read-only pilot</h3><p>요약, 리서치, 문서 초안처럼 되돌림 쉬운 작업으로 시작하고 Decision Scorecard를 채운다.</p></div></div>
        <div><div>G1</div><div><h3>PR-first workflow</h3><p>Generator write는 branch, PR, staged artifact로 제한하고 Evaluator와 Harness가 gate를 담당한다.</p></div></div>
        <div><div>G2</div><div><h3>Harness-gated rollout</h3><p>반복되는 제약은 checker, test, policy-as-code로 만들고 failure mode를 round log에 기록한다.</p></div></div>
        <div><div>G3</div><div><h3>Human-gated operations</h3><p>High/Critical 작업은 approval_id, rollback owner, telemetry source가 없으면 진행하지 않는다.</p></div></div>
        <div><div>G4</div><div><h3>Scaled operations</h3><p>팀 유형, SLI/SLO, 비용 지표, 감사 증거를 주기적으로 검토하고 필요하면 topology를 줄인다.</p></div></div>
      </div>
    </section></article></template>
<template id="embedded-source-025"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>A48</strong><span>Agent Squad에서 Copilot Agent Teams로</span><span>5. 전환 절차 (Step-by-step)</span></p><section>
    <h2>5. 전환 절차 (Step-by-step)</h2>
    <table>
      <thead><tr><th>단계</th><th>작업</th><th>산출물</th><th>완료 기준(Gate)</th></tr></thead>

        <tr><td>2. 워커 생성</td><td>에이전트마다 <code>.github/agents/&lt;name&gt;.agent.md</code> 작성</td><td>워커 <code>.agent.md</code> 세트</td><td><code>user-invocable: false</code>, 최소 권한 tool</td></tr>

        <tr><td>4. tool 재배선</td><td>squad 함수/외부 API를 MCP·내장 tool로 매핑</td><td>tool allowlist, MCP 설정</td><td>destructive tool은 coordinator에서 제외</td></tr>

        <tr><td>7. 공유/거버넌스</td><td>워크스페이스→조직 레벨 승격, 권한 리뷰</td><td>org custom agents</td><td>tool 목록 최소권한 리뷰 통과</td></tr>

    <div><strong>참고 레퍼런스:</strong> 이 워크스페이스의 <code>.github/agents/</code> 에는 이미 coordinator(OR-Orion) + planner/generator/evaluator/support 워커가 <code>.agent.md</code> 로 구현돼 있어, 전환 결과물이 어떤 모습인지 실물로 확인할 수 있습니다.</div>

<template id="embedded-source-026"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>M03</strong><span>메타플랜 모범 사례</span><span>3. 좋은 메타플랜의 10대 원칙</span></p><section>
      <h2>3. 좋은 메타플랜의 10대 원칙</h2>
      <div>
        <div><h3>1. Mission과 Non-goal을 먼저 고정</h3><p>무엇을 만들지뿐 아니라 무엇을 만들지 않을지 정해야 agent가 범위를 벗어난 생성을 줄인다. Design Doc/RFC/ADR 관행과 연결된다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-adr" target="_blank" rel="noopener noreferrer">S40</a></p></div>
        <div><h3>2. 역할이 아니라 권한을 정의</h3><p>각 agent가 읽을 수 있는 데이터, 실행 가능한 도구, 수정 가능한 파일, 승인 가능한 변경을 분리한다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-mcp-spec" target="_blank" rel="noopener noreferrer">S20</a> <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-owasp-llm" target="_blank" rel="noopener noreferrer">S47</a></p></div>
        <div><h3>3. 산출물 계약을 schema로 고정</h3><p>free-form 보고서만 받지 말고 plan, evidence, risk, decision, next action을 구조화한다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-openai-structured" target="_blank" rel="noopener noreferrer">S4</a></p></div>
        <div><h3>4. Planner consensus는 risk-tier로 조절</h3><p>모든 작업에 동일한 합의 절차를 적용하면 비용이 증가한다. low-risk는 경량 gate, high-risk는 만장일치 + 하네스 gate로 분기한다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-anthropic-agents" target="_blank" rel="noopener noreferrer">S1</a></p></div>
        <div><h3>5. Generator는 계획 밖 변경 금지</h3><p>승인된 plan id와 산출물 diff를 연결해 “무단 확장”을 줄인다. 이는 traceability와 rollback에 필요하다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-sre-incident" target="_blank" rel="noopener noreferrer">S35</a></p></div>
        <div><h3>6. Evaluator는 취향이 아니라 판정 schema</h3><p><code>pass | fail(reason, evidence, severity)</code> 처럼 고정 형식을 쓰면 재작업 지시가 분명해진다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-openai-evals" target="_blank" rel="noopener noreferrer">S5</a></p></div>
        <div><h3>7. 제약은 하네스화</h3><p>출처 누락, 내부 링크 깨짐, SLO 표 누락, rollback 미정의 같은 반복 검증은 코드로 만든다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-promptfoo" target="_blank" rel="noopener noreferrer">S31</a> <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-inspect" target="_blank" rel="noopener noreferrer">S32</a></p></div>
        <div><h3>8. Context는 예산으로 관리</h3><p>긴 작업은 context window를 채우기보다 요약, artifact index, sub-task, external memory로 관리한다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-anthropic-context" target="_blank" rel="noopener noreferrer">S7</a></p></div>
        <div><h3>9. 결정은 ADR로 보존</h3><p>왜 이 프레임워크·에이전트·게이트를 선택했는지 기록해야 다음 라운드에서 같은 논쟁을 줄인다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-nygard-adr" target="_blank" rel="noopener noreferrer">S41</a></p></div>
        <div><h3>10. 운영 실패는 incident로 취급</h3><p>출처 없는 주장, gate escape, unsafe tool call, context overflow를 incident type으로 정의하면 개선 루프가 생긴다. <a href="../../../ref/harness-gen-output/003-metaplan-best-practices-2026-06-27.html#ref-sre-postmortem" target="_blank" rel="noopener noreferrer">S36</a></p></div>
      </div>
    </section></article></template>

<template id="embedded-source-028"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>M12</strong><span>멀티에이전트 하네스 도구 보고서</span><span>Identity and Tool Boundary</span></p><section>
      <h2>Identity and Tool Boundary</h2>
      <p>멀티에이전트 하네스에서 가장 먼저 닫아야 할 것은 모델 선택이 아니라 권한의 형태다. human identity, workload identity, MCP/tool token, model credential을 분리하고, read/write/destructive/deploy tool scope마다 approval_id 요구 조건을 둔다.</p>
      <table>
        <thead><tr><th>Tool scope</th><th>Allowed default</th><th>Approval</th><th>Audit field</th><th>Rollback trigger</th></tr></thead>
        <tbody>
          <tr><td>read</td><td>repo read, docs read, issue read</td><td>none or team policy</td><td>agent_run_id, repo, tool_calls</td><td>stale or forbidden source</td></tr>
          <tr><td>write</td><td>branch-only, PR comment, generated patch</td><td>reviewer approval_id for protected paths</td><td>changed_files, validation_result</td><td>test fail, owner reject</td></tr>
          <tr><td>destructive</td><td>off by default</td><td>explicit human approval_id</td><td>approval_id, rollback_correlation_id</td><td>unexpected deletion or config drift</td></tr>
          <tr><td>deploy</td><td>no direct deploy from agent</td><td>change owner and release owner</td><td>cost_center, model_route, runbook action</td><td>SLO breach or incident</td></tr>
        </tbody>
      </table>
    </section></article></template>

      <h2>Role Contract</h2>
      <p>역할 이름보다 중요한 것은 권한, 증거, 중단 책임이다. 아래 계약은 agent team을 운영 단위로 바꾸는 최소 형식이다.</p>

        <tbody>
          <tr><td>Planner</td><td>read, plan only</td><td>목표, 제약, topology, gate list</td><td>결정 근거와 owner 기록</td><td>요구사항 충돌 또는 근거 부족</td></tr>

          <tr><td>Evaluator</td><td>read, test, review</td><td>pass/revise/block, 결함 목록</td><td>검토 기준과 재현 절차</td><td>block severity 또는 기준 불명확</td></tr>
          <tr><td>Harness Author</td><td>policy/test/checker write</td><td>검증 스크립트, CI gate, forbidden scan</td><td>Harness PASS boundary 명시</td><td>하네스가 사실 검증으로 오해될 때</td></tr>
          <tr><td>Approval Owner</td><td>approval_id 발급, expiry 지정</td><td>승인 기록, scope, 만료 시각</td><td>approver, artifact id, audit evidence</td><td>approval_id 없는 write/destructive/prod/customer-data</td></tr>
          <tr><td>Rollback Owner</td><td>rollback trigger 판단</td><td>rollback owner, rollback artifact, 재개 조건</td><td>drill 결과, incident link</td><td>rollback owner 누락</td></tr>

<template id="embedded-source-030"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>D2S3</strong><span>과정 D2·S3 · 본인 워크플로</span><span>하네스 (3) — 본인 기능팀 워크플로 설계</span></p><main>


<header>
  <div>DAY 2 · SESSION 3 · 13:00–13:50 (50m) · 나만의 솔루션 설계 시작</div>
  <h1>하네스 (3) — 본인 기능팀 워크플로 설계</h1>
  <p>앞 세션의 도구(게이트·Agent Teams·Fleet·Loop)를 <strong>내 반복 업무</strong> 에 적용합니다. 자연어 제약을 테스트/체크로 코드화하고, 자동화 포인트를 골라 <strong>나만의 하네스 워크플로</strong> 를 설계합니다.</p>
  <div><span><strong>HE-01</strong> 하네스</span> <span><strong>HE-07</strong> Stop condition</span> <span><strong>HE-08</strong> Max retry</span> <span><strong>CF-05</strong> Fleet</span> <span><strong>CF-06</strong> Loop</span> <span><strong>OR-25</strong> Loop gate</span></div>
</header>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li>내 기능팀의 <strong>반복 업무 1개</strong> 를 입력·작업·검증·중단 조건으로 분해한다.</li>
    <li>자연어 제약 → 테스트/체크/정책으로 <strong>코드화 포인트</strong> 를 식별한다.</li>
    <li>업무별 Agent Teams/Fleet 루프를 설계하고 <strong>중단 조건과 owner</strong> 를 지정한다.</li>
  </ul>
</section>

<section>
  <h2>이 세션의 활동별 권장 모델</h2>
  <table>
    <caption>D2·S3 활동 · 책임 주체 · 권장 모델</caption>
    <thead><tr><th>활동</th><th>주체·과업군</th><th>권장 모델</th><th>한 줄 이유</th></tr></thead>
    <tbody>
      <tr><td>업무 분해·Loop Canvas·중단조건</td><td>사람 계획 · F2</td><td><strong>모델 미사용</strong></td><td>자동 계획 후보가 안정적으로 gate를 통과하지 못함</td></tr>
      <tr><td>simulation/check</td><td>도구 · N0</td><td><strong>모델 미사용</strong></td><td>seed 기반 simulation과 검사가 상태를 판정</td></tr>
    </tbody>
  </table>
  <div><strong>선정 기준:</strong> blind-v2 132 primary·35 external screen·29 confirmation attempts(12 stable) 결과입니다. F2 계획 활동은 사람·모델 미사용 경로입니다. <a href="../aibuild-squad/output/260627_edu/edu_context/%ED%99%9C%EB%8F%99%EB%B3%84-%EB%AA%A8%EB%8D%B8-%EC%B6%94%EC%B2%9C-%EB%B3%B4%EA%B3%A0%EC%84%9C-2026-07-11.html" target="_blank" rel="noopener noreferrer">전체 근거 보기</a></div>
</section>

<section>
  <h2>미니강의 — 여기서 "자신만의 솔루션"이 시작된다</h2>
  <p>지금까지는 주어진 예제로 도구를 익혔습니다. 이 세션부터는 <strong>내 업무</strong> 를 재료로 씁니다. "매번 똑같이 하는 일"을 하나 골라 하네스로 감싸면, 그것이 곧 팀에 남길 <strong>나만의 솔루션</strong> 의 씨앗입니다. 이 설계는 D2·S6에서 Custom Skill/Agent로 결정화됩니다.</p>
  <div><strong>경계(<span>SD-11</span>):</strong> AI에 맡길 일(요약·테스트 후보·diff 요약)과 사람이 승인할 일(scope freeze·보안 go/no-go·배포)을 분리합니다. 장기 실행은 timebox·max retry·kill switch(<span>HE-09</span>)를 둡니다.</div>
</section>

<section>
  <h2>실습 — 본인 워크플로 캔버스</h2>
  <div><div>STEP 1 · 반복 업무 분해</div>
  <table>
    <caption>본인 워크플로 분해 항목</caption>
    <thead><tr><th>칸</th><th>적기</th></tr></thead>
    <tbody>
      <tr><td>업무 이름</td><td>예: "PR 전 셀프 리뷰 체크"</td></tr>
      <tr><td>입력</td><td>변경 diff, 기능 스펙</td></tr>
      <tr><td>반복 단계</td><td>린트→테스트→정책체크→요약</td></tr>
      <tr><td>자동화 후보</td><td>정책체크, 변경 요약</td></tr>
      <tr><td>사람 판단</td><td>최종 수용, 보안 영향</td></tr>
      <tr><td>중단 조건</td><td>동일 실패 2회 → 사람 리뷰(<span>HE-08</span>)</td></tr>
    </tbody>
  </table></div>
  <div><div>STEP 2 · 제약 → 체크로 코드화</div>
<pre><code>"이 작업은 반드시: ① 외부 패키지 추가 금지 ② public API 시그니처 불변
③ 커버리지 하락 금지. 각 항목을 검사하는 로컬 체크를 만들고, 위반 시 중단."</code></pre>
  <p>자연어 제약을 policy-check 규칙·테스트로 옮기는 연습입니다.</p></div>
  <div><div>STEP 3 · 내 업무용 Loop 설계</div>
  <p>Plan→Generate→Evaluate→Fix→Gate를 <strong>내 업무 용어</strong> 로 다시 씁니다. 각 단계의 stop condition과 owner를 명시합니다.</p></div>
</section>

<section>
  <h2>참조 심화 — 장기 실행 안전장치</h2>
  <p>반복 업무가 수 시간~수 일로 길어지면(배치 리서치·문서 처리·AIOps) 단일 블랙박스 실행이 아니라 <strong>체크포인트 + 사람 승인 사슬</strong> 로 운영합니다.</p>
  <h3>Loop 오케스트레이션</h3>
  <div><span>Collect</span> <span>→</span> <span>Normalize</span> <span>→</span> <span>Generate</span> <span>→</span> <span>Validate</span> <span>→</span> <span>Approve</span> <span>→</span> <span>Reflect</span></div>
  <h3>운영 SLI/SLO &amp; 게이트</h3>
  <table>
    <caption>장기 실행 SLI/SLO 게이트</caption>
    <thead><tr><th>지표</th><th>기준</th><th>위반 시</th></tr></thead>
    <tbody>
      <tr><td><code>cost_burn_rate_1h</code></td><td>2x=ticket, 4x=page</td><td>자동 downshift</td></tr>
      <tr><td><code>checkpoint_restore_success_rate</code></td><td>≥ 99%</td><td>2회 연속 실패=page</td></tr>
      <tr><td><code>resume_delay_p95</code></td><td>≤ 15min</td><td>30min ticket / 60min page</td></tr>
      <tr><td>high-risk 주장 근거 D등급</td><td>0</td><td>1건이라도 block</td></tr>
      <tr><td><code>approval_id</code> 만료</td><td>0</td><td>자동 hold</td></tr>
    </tbody>
  </table>
  <div><strong>원칙:</strong> "비용 소모는 보여야 한다 — burn-rate를 관측하지 못하면 확장하지 않는다." soft gate는 신호용, <strong>hard gate는 go/no-go</strong> 용. 캐너리 <strong>5% → 25% → 100%</strong>, 지표 악화 시 즉시 0% 롤백. 장기 작업엔 timebox·max retry·kill switch를 둡니다.</div>
  <div><strong>Definition of Done:</strong> Code + Test + Required Check + Doc + <strong>Rollback Path</strong> — 5개가 모두 있어야 "완료".</div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>내 반복 업무 하나를 trigger·input·action·evidence·stop·owner로 분해한다.</li><li>자연어 제약 중 테스트·체크·정책으로 바꿀 지점을 한 개 이상 찾는다.</li><li>retry budget과 사람 전환 조건을 시뮬레이션으로 확인한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>Trigger: 변경 요청 접수
Input: spec + diff
Action: lint → test → policy → summary
Evidence: 명령·exit code·packet
STOP: 같은 실패 2회
Owner: 기능 담당자
sim: PASS</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> 완성된 자동화보다 반복 가능한 판단 경계가 우선입니다. 입력과 완료 증거, 멈춤 조건을 다른 사람이 이해할 수 있으면 초안으로 통과할 수 있습니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> 본인용 하네스 워크플로 캔버스 + Agent Teams/Fleet Loop 초안(중단 조건·owner 포함).</div>
  <ul>
    <li>자동화 후보와 사람 판단이 분리되었는가?</li>
    <li>모든 Loop 단계에 중단 조건이 있는가?</li>
    <li>최소 1개의 자연어 제약이 체크/테스트로 코드화되었는가?</li>
  </ul>
  <div><strong>컷라인:</strong> 반복 업무 1개 + 자동화 후보 1개 + 중단 조건만 있으면 통과. 완전한 Loop는 S6에서 보강 가능.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>
  <ul>
    <li>너무 큰 업무를 고름 → 50분에 안 끝남. "한 번에 하는 작은 반복"을 고릅니다.</li>
    <li>전부 자동화하려 함 → 사람 판단 지점을 남겨야 안전합니다.</li>
  </ul>
  <div><strong>공유 포인트:</strong> "내가 자동화하기로 한 반복 업무 1개"를 한 문장으로. 이것이 S7 라이트닝 토크의 핵심 슬라이드가 됩니다.</div>
</section>

<template id="embedded-source-031"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L45</strong><span>AI Agent Loop 분류와 사례</span><span>6. 사용처 추천</span></p><section>
    <h2>6. 사용처 추천</h2>
    <div>
      <div><h3>짧은 답변·분류</h3><p><strong>추천:</strong> Routing, prompt chaining. <strong>이유:</strong> 토큰량이 낮고 실패 지점이 명확합니다. <strong>피함:</strong> multi-agent debate.</p></div>
      <div><h3>근거 기반 리서치</h3><p><strong>추천:</strong> Agentic RAG + evaluator-optimizer. <strong>이유:</strong> source freshness와 caveat를 함께 관리할 수 있습니다. <strong>피함:</strong> source 없는 reflection.</p></div>
      <div><h3>코딩·리팩터링</h3><p><strong>추천:</strong> Plan-and-Execute + autonomous coding + human PR gate. <strong>이유:</strong> issue→patch→test→PR 루프가 GitHub-native 검증과 맞습니다.</p></div>
      <div><h3>UI/브라우저 QA</h3><p><strong>추천:</strong> Computer-use/browser loop + strict screenshot cap. <strong>이유:</strong> 화면 관찰이 필요합니다. <strong>피함:</strong> 권한 높은 production 계정.</p></div>
      <div><h3>전략·아키텍처 비교</h3><p><strong>추천:</strong> Multi-agent debate 또는 orchestrator-workers. <strong>이유:</strong> 제품, SRE, 보안, 비용 관점을 나눌 수 있습니다. <strong>주의:</strong> 합의가 사실 검증은 아닙니다.</p></div>
      <div><h3>반복 운영 자동화</h3><p><strong>추천:</strong> Graph/state-machine + memory loop + human-in-the-loop. <strong>이유:</strong> 상태·재개·감사가 필요합니다. <strong>피함:</strong> stop condition 없는 자율 반복.</p></div>
      <div><h3>대규모 fan-out·저컨텍스트 오케스트레이션</h3><p><strong>추천:</strong> Dynamic workflow(코드-오케스트레이터). <strong>이유:</strong> 루프·분기·중간결과를 스크립트가 들고 있어 컨텍스트 폭주 없이 수백 subagent로 확장됩니다. <strong>피함:</strong> 작은 작업, budget kill-switch·중단 뷰 미비.</p></div>
    </div>
    <div>
      <strong>Dynamic workflow 보강:</strong> Claude Code의 <em>Dynamic Workflows</em> (research preview)는 “Claude가 작성하는 JavaScript 스크립트를 런타임이 백그라운드에서 실행하며 subagent를 스케로 오케스트레이션”하는 패턴입니다. orchestrator-workers를 <strong>코드로 옮겨</strong> 오케스트레이터 역할을 런타임 스크립트가 맡으므로, 모델 컨텍스트에는 최종 답만 남아 대규모 fan-out에도 컨텍스트가 터지지 않습니다(런당 최대 16 동시·1,000 총 agent). “dynamic”은 <strong>스크립트를 Claude가 그때그때 생성</strong> 한다는 뜻이며, 사람이 고정 DAG를 그리는 것과 다릅니다. 정의·제약·Copilot 구현 경로는 <a href="../../../ref/harness-gen-output/037-claude-code-dynamic-workflows-to-copilot-2026-07-10.html" target="_blank" rel="noopener noreferrer">037 문서</a>, 공식 정의는 <a href="https://docs.claude.com/en/docs/claude-code/workflows" target="_blank" rel="noopener noreferrer">docs.claude.com/en/docs/claude-code/workflows</a> 참조.
    </div>
    <div>
      <strong>추천 요약:</strong> 기본값은 작은 루프입니다. 먼저 routing/prompt chaining/RAG로 시작하고, 실패 비용이 크거나 품질 기준이 명확할 때 evaluator를 추가합니다. 병렬·멀티에이전트·computer-use는 관측성과 budget kill-switch가 준비된 뒤에만 승격합니다.
    </div>
  </section></article></template>
<template id="embedded-source-032"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>W17</strong><span>Copilot 고급 업무 흐름 가이드</span><span>11. Batch Operations</span></p><section><h2>11. Batch Operations</h2><p>대규모 병렬 처리는 Actions matrix와 worktree batch로 옮길 수 있지만, parallelism cap, Actions concurrency, cost guard, review queue owner가 없으면 시작하지 않는다. 기본값은 repository당 active worktree 3개 또는 Actions matrix 5개 job, concurrency group `ghcp-power-workflows-${repo}`, review queue owner는 PR Loop Owner, review p95 목표는 24시간이다. cost guard는 월 예산 80%에서 alert, 90%에서 batch pause, FinOps Owner 승인 후 resume으로 둔다.</p><div><strong>No-Go:</strong> parallelism cap breach = 0, cost guard breach = 0이 목표다. review queue p95가 24시간을 넘거나 alert channel이 없으면 batch를 줄인다.</div></section></article></template>

    <h2>6. Agent Loop Patterns</h2>
    <p>Agentic 아키텍처는 loop 선택 문제입니다. 한 시스템 안에서도 task마다 다른 loop를 써야 합니다.</p>
    <table>
      <thead><tr><th>Loop</th><th>구조</th><th>좋은 사용처</th><th>피해야 할 상황</th><th>필수 gate</th></tr></thead>
      <tbody>
        <tr><td>Routing</td><td>classify -&gt; route -&gt; respond</td><td>FAQ, triage, model selection, workflow selection</td><td>복잡한 탐색</td><td>classification confidence</td></tr>
        <tr><td>ReAct / Tool-use</td><td>reason -&gt; act -&gt; observe</td><td>작은 도구 기반 문제 해결, API 조회</td><td>도구 결과가 큰 작업</td><td>tool cap, observation summary</td></tr>
        <tr><td>Plan-and-Execute</td><td>plan -&gt; execute -&gt; replan</td><td>중간 길이 개발, 마이그레이션, 리서치</td><td>간단한 one-shot</td><td>plan review, replan limit</td></tr>
        <tr><td>Evaluator-Optimizer</td><td>generate -&gt; evaluate -&gt; improve</td><td>문서, 코드, test, policy 품질 개선</td><td>평가 기준이 모호한 창작</td><td>rubric, max iteration</td></tr>
        <tr><td>Agentic RAG</td><td>retrieve -&gt; reason -&gt; verify -&gt; answer</td><td>근거 기반 분석, 정책/컴플라이언스 질의</td><td>초저지연 UX</td><td>citation match, source freshness</td></tr>
        <tr><td>Orchestrator-workers</td><td>decompose -&gt; parallel workers -&gt; synthesize</td><td>큰 코드베이스 탐색, 다관점 전략 검토</td><td>작업 분해가 불명확한 문제</td><td>worker contract, merge review</td></tr>
        <tr><td>Human-in-the-loop</td><td>proposal -&gt; approval -&gt; action -&gt; audit</td><td>보안, 배포, 결제, 고객 데이터, 외부 공개</td><td>낮은 위험의 반복 read-only 작업</td><td>approval owner, evidence bundle</td></tr>
      </tbody>
    </table>

<template id="embedded-source-035"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L45</strong><span>AI Agent Loop 분류와 사례</span><span>7. 루프 엔지니어링: 원칙과 설계 고려사항</span></p><section>
    <h2>7. 루프 엔지니어링: 원칙과 설계 고려사항</h2>
    <p>루프를 <em>고르는 것</em> 과 <em>운영 가능하게 만드는 것</em> 은 다릅니다. <strong>루프 엔지니어링</strong> 은 루프의 정의를 넘어 <strong>종료 조건·컨텍스트·상태·오류·권한·관측</strong> 을 소프트웨어로 설계하는 규율입니다. 현장의 production 품질 agent는 “프롬프트 + 도구 한 봉지 + 목표까지 루프”가 아니라 <strong>대부분 잘 설계된 소프트웨어</strong> 이며, LLM 단계가 결정론 코드 사이에 끼워집니다(12-factor agents). 많은 팀이 프레임워크로 70–80%까지 빠르게 도달한 뒤, 그 위를 넘기려면 프롬프트·흐름·컨텍스트를 직접 소유해야 함을 발견합니다.</p>
    <h3>‘프롬프트하는 나’를 시스템으로 대체하기</h3>
    <p>루프 엔지니어링의 한 줄 정의는 <strong>“매번 프롬프트하며 루프를 돌리던 사람(human-as-loop)을, 그 판단을 코드로 옮긴 시스템(system-as-loop)으로 대체하는 것”</strong> 입니다. 사람이 손으로 반복하던 판단을 하나씩 시스템 구성요소로 외부화하면, 같은 작업이 <strong>재현 가능·관측 가능·확장 가능</strong> 해집니다.</p>
    <table>
      <thead><tr><th>‘프롬프트하는 나’가 매번 하던 일</th><th>시스템으로 대체(이 문서의 어디서)</th></tr></thead>
      <tbody>
        <tr><td>출력을 읽고 다시 프롬프트</td><td>evaluator·검증 게이트 + 재시도 로직 (§7 오류 압축, §8 eval)</td></tr>
        <tr><td>언제 멈출지 눈으로 판단</td><td>종료 조건: max_steps/tokens/no-progress/done-tool (§7·§8)</td></tr>
        <tr><td>무엇을 붙여넣을지 고르기</td><td>컨텍스트 큐레이션: compaction/JIT/note-taking (§7)</td></tr>
        <tr><td>막혔을 때 방향 전환</td><td>오류 압축 + replan + human gate (§7·§9)</td></tr>
        <tr><td>결과가 맞는지 눈으로 확인</td><td>hard signal 검증: 테스트/PR/재현 (§8)</td></tr>
        <tr><td>다음에 또 수동 반복</td><td>재현 가능한 하네스: launch/pause/resume·체크포인트 (§7·§8)</td></tr>
      </tbody>
    </table>
    <div><strong>요지:</strong> 위 표의 오른쪽이 갖춰질수록 ‘프롬프트 장인’ 한 명에 의존하지 않고 팀·시스템이 같은 품질을 재현합니다. 즉, 가치는 “더 좋은 프롬프트”가 아니라 <strong>“더 좋은 루프”</strong> 로 이동합니다. <span>(이 프레이밍은 실밤개발자, “루프 엔지니어링 — ‘프롬프트하는 나’를 시스템으로 대체하는 법” 강연에서 가져왔습니다.)</span></div>
    <h3>모든 루프의 공통 골격</h3>
    <div><pre># 어떤 루프(ReAct·plan-execute·evaluator·…)도 아래 골격의 변형이다 (12-factor agents)
context = [initial_event]                      # 사용자 메시지 / webhook / cron
while True:
    next_step = llm.determine_next_step(context)   # 1) 다음 단계 = 구조화 출력(tool call)
    context.append(next_step)
    if next_step.intent == "done":                 # 4) 종료 판정
        return next_step.final_answer
    result = execute_step(next_step)               # 2) 결정론 코드가 도구 실행
    context.append(result)                         # 3) 결과를 컨텍스트에 추가</pre></div>
    <div><strong>핵심:</strong> 루프의 이름이 아니라 <strong>종료·컨텍스트·상태·오류 처리의 품질</strong> 이 엔지니어링 난이도를 결정합니다. 좋은 agent는 “도구 한 봉지 주고 끝날 때까지 돌리기”가 아니라 대부분 명시적 제어 흐름입니다.</div>
    <h3>핵심 원칙 (12-factor agents · Anthropic)</h3>
    <table>
      <thead><tr><th>원칙</th><th>의미</th><th>안 지키면</th></tr></thead>
      <tbody>
        <tr><td>흐름을 소유하라 (Own your control flow)</td><td>분기·중단·재시도·승인 지점을 <strong>코드가</strong> 소유. LLM에 전권 위임 금지</td><td>무한 루프, 통제 불가, 분기 폭주</td></tr>
        <tr><td>컨텍스트를 소유하라 (Own your context window)</td><td>컨텍스트는 <strong>유한 자원</strong>. 매 턴 무엇을 넣을지 큐레이션</td><td>context rot(길어지면 정확도↓), 비용 폭증</td></tr>
        <tr><td>도구는 구조화 출력 (Tools = structured outputs)</td><td>LLM은 JSON을 내고 결정론 코드가 실행</td><td>파싱 실패, 비결정성</td></tr>
        <tr><td>오류를 압축해 넣어라 (Compact errors)</td><td>실패를 <strong>요약</strong> 해 다음 턴에 주되 재시도 상한</td><td>같은 오류 반복, retry storm, 토큰 낭비</td></tr>
        <tr><td>상태를 외부화 (Stateless reducer · launch/pause/resume)</td><td>실행상태=비즈니스상태, 일시정지·재개 가능</td><td>재현 불가, 장애 복구 불가</td></tr>
        <tr><td>작은 초점 agent (Small, focused)</td><td>한 agent가 모든 걸 하지 않게</td><td>drift, 평가 불가, 컨텍스트 오염</td></tr>
        <tr><td>사람도 도구 호출로 (Human via tool calls)</td><td>승인·질문도 tool call로 모델링</td><td>고위험 자동 실행, 의사결정 은폐</td></tr>
      </tbody>
    </table>
    <h3>설계 고려사항</h3>
    <div>
      <div><h3>종료 조건</h3><p><code>max_steps</code>, <code>max_tokens</code>, <code>retry_cap</code>, <strong>무진전(no-progress) 감지</strong> (같은 tool/plan N회), 명시적 <code>done</code> tool. “언제 멈추는가”가 없으면 production 불가.</p></div>
      <div><h3>컨텍스트 전략(Anthropic)</h3><p><strong>compaction</strong> (요약 후 재시작), <strong>구조적 note-taking</strong> (NOTES.md/메모리), <strong>just-in-time</strong> (파일경로·쿼리 식별자로 런타임 로드), <strong>tool-result clearing</strong> (과거 raw 결과 제거), <strong>sub-agent</strong> (깨끗한 컨텍스트·1–2k 토큰 요약 반환).</p></div>
      <div><h3>상태·체크포인트</h3><p>단계마다 상태 저장 → 중단/재개/롤백. 비가역 action은 체크포인트+승인 뒤에만.</p></div>
      <div><h3>결정성·멱등성</h3><p>tool은 재시도 안전(idempotent)하게. 외부 effect는 idempotency key로 중복 방지.</p></div>
      <div><h3>권한 경계</h3><p>read/write/destructive 분리. 고위험은 human gate. 도구 과다(bloated tool set) 금지 — 사람도 못 고르면 LLM도 못 고릅니다.</p></div>
      <div><h3>컨텍스트 예산</h3><p>“가장 작은 고신호 토큰 집합”을 찾는다. 프롬프트는 right altitude(너무 세부·너무 모호 사이), 예시는 소수의 canonical만.</p></div>
    </div>
  </section></article></template>
<template id="embedded-source-036"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L33</strong><span>장기 실행 AI 업무 플레이북</span><span>2. 수행 방법(아키텍처/운영 패턴)</span></p><section>
      <h2>2. 수행 방법(아키텍처/운영 패턴)</h2>
      <div>
        <div><h3>A. 루프형 오케스트레이션</h3><p>수집 → 정규화 → 생성 → 검증 → 승인 단계를 반복한다. 각 단계는 artifact와 로그를 남기고, 실패 시 해당 단계로만 롤백한다.</p></div>
        <div><h3>B. 배치 + 이벤트 혼합</h3><p>정기 배치(야간/주간)와 이벤트 트리거(이슈 발생)를 분리해 운영한다. 비용 예측은 배치, 긴급 대응은 이벤트로 다룬다.</p></div>
        <div><h3>C. Human-in-the-loop</h3><p>고위험 결과(대외 배포, 정책 변경, 고객 응답)는 항상 사람 승인 후 반영한다. 승인자·만료시간·예외사유를 함께 기록한다.</p></div>
        <div><h3>D. 하네스 우선 검증</h3><p>사실검증과 구조검증을 분리한다. lint/schema/link/checklist는 자동, 고위험 claim은 수동 검증으로 운영한다.</p></div>
      </div>
      <h3>실행 스택 예시(벤더 중립)</h3>
      <table>
        <thead><tr><th>레이어</th><th>필수 구성</th><th>권장 구성</th><th>비고</th></tr></thead>
        <tbody>
          <tr><td>오케스트레이션</td><td>상태머신/워크플로 엔진</td><td>체크포인트 해시 + 재개 정책</td><td>작업 장기화 시 필수</td></tr>
          <tr><td>모델 라우팅</td><td>기본/고급 모델 분리</td><td>비용 임계치 기반 자동 다운시프트</td><td>비용 폭주 방지</td></tr>
          <tr><td>근거 저장</td><td>source ledger</td><td>claim-source-grade 매트릭스</td><td>감사 추적성 강화</td></tr>
          <tr><td>관측성</td><td>성공률/지연/비용 로그</td><td>burn-rate 대시보드 + 알람</td><td>SLO 기반 운영</td></tr>
          <tr><td>승인/배포</td><td>승인 게이트</td><td>카나리 + 자동 롤백</td><td>고위험 변경 보호</td></tr>
        </tbody>
      </table>
    </section></article></template>
<template id="embedded-source-037"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>T40</strong><span>토큰 수요와 모델 라우터 보고서</span><span>8) 운영 지표와 가드레일</span></p><section>
      <h2>8) 운영 지표와 가드레일</h2>
      <div>
        <div>
          <h3>필수 계측 지표</h3>
          <ul>
            <li><strong>Cost per successful task:</strong> token cost가 아니라 성공한 작업 단위 비용.</li>
            <li><strong>Token amplification factor:</strong> 사용자 요청 1개가 내부 LLM 호출과 토큰으로 얼마나 증폭되는지.</li>
            <li><strong>Context payload composition:</strong> user prompt, files, history, tool output, diagnostics, diff, cache write/read 비율.</li>
            <li><strong>Cache hit and reuse:</strong> 반복 context의 cached token 비율과 실제 비용 절감률.</li>
            <li><strong>Retry and failure cost:</strong> 실패한 tool call, failed request, hallucinated edit, reverted diff의 비용.</li>
            <li><strong>Escalation rate:</strong> 작은 모델에서 강한 모델로 올라간 비율과 이유.</li>
          </ul>
        </div>
        <div>
          <h3>조직 가드레일</h3>
          <ul>
            <li>사용자별 hard budget과 cost-center/enterprise budget을 분리한다. 팀 단위 통제는 팀을 cost center에 매핑하는 방식으로 설계한다.</li>
            <li>고비용 모델은 allowlist, task class, repository class, time window로 제한한다.</li>
            <li>long-running agent는 phase별 budget과 checkpoint approval을 둔다.</li>
            <li>hidden context와 tool output은 request-level receipt로 남기는 것을 목표로 한다. 다만 GitHub Copilot native billing report가 이 수준의 원문 receipt를 보장한다고 단정하지 않는다.</li>
            <li>모델 선택 권한보다 auto-routing policy와 override 이유 기록을 우선한다.</li>
            <li>예산 소진 시 자동 모델 전환이 없는 도구는 사전 알림과 stop rule이 더 중요하다.</li>
            <li>운영 임계값은 예시로 월 예산 50/75/90% 알림, 100% hard stop, 고비용 모델 일일 burn-rate 이상치 알림, 2회 이상 retry spiral 발생 시 human handoff를 둔다.</li>
          </ul>
        </div>
      </div>

      <table>
        <thead><tr><th>리스크</th><th>증상</th><th>대응</th></tr></thead>
        <tbody>
          <tr><td>비용 예측 불가</td><td>같은 사용자가 비슷한 작업처럼 보이는 세션에서 credit burn이 크게 다름</td><td>request-level token receipt, context diff, model/subtask log 제공</td></tr>
          <tr><td>과도한 frontier model 사용</td><td>간단한 검색, formatting, boilerplate도 premium model 사용</td><td>작업 분류기와 cheap path 기본값, escalation gate</td></tr>
          <tr><td>context bloat</td><td>세션이 길어질수록 동일 파일/로그/대화가 반복 주입</td><td>rolling summary, semantic cache, file snapshot hash, context TTL</td></tr>
          <tr><td>retry spiral</td><td>테스트 실패 또는 tool 오류 후 같은 실수를 반복</td><td>retry budget, failure classifier, human handoff threshold</td></tr>
          <tr><td>품질 저하</td><td>작은 모델 절감 시도 후 재작업과 rollback 증가</td><td>cost per accepted diff, defect escape, review rejection rate로 평가</td></tr>
        </tbody>
      </table>
    </section></article></template>
<template id="embedded-source-038"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L33</strong><span>장기 실행 AI 업무 플레이북</span><span>4. 비용 폭주 방지/신뢰성 운영</span></p><section>
      <h2>4. 비용 폭주 방지/신뢰성 운영</h2>
      <div>
        <div><h3>Hard Gate</h3><p><code>CD_ratio &gt; 0.35</code> 이면 배포 차단, high-risk claim에서 D등급 1건이라도 있으면 차단한다.</p></div>
        <div><h3>Error Budget</h3><p>일/주 예산 소진율과 1h/6h burn-rate를 동시에 본다. 임계 초과 시 신규 작업 큐를 즉시 동결한다.</p></div>
        <div><h3>Checkpoint Integrity</h3><p>체크포인트 해시 일치율, 복원 성공률, 재개 지연 p95를 SLO로 관리한다. 연속 실패 시 자동 block.</p></div>
        <div><h3>Canary &amp; Rollback</h3><p>5%→25%→100% 단계 승급, 단계별 bake time 후 승급한다. 지표 악화 시 즉시 0% 롤백한다.</p></div>
      </div>
      <h3>운영 최소 스키마(runbook)</h3>
      <table>
        <thead><tr><th>항목</th><th>필수 값</th><th>없으면</th></tr></thead>
        <tbody>
          <tr><td>Sev 분류</td><td>P1/P2/P3 기준과 예시</td><td>사건 우선순위 혼선</td></tr>
          <tr><td>on-call</td><td>담당자/백업/응답시간 SLA</td><td>복구 지연</td></tr>
          <tr><td>approval chain</td><td>approval_id, 만료시간, 재승인 조건</td><td>무승인 배포 위험</td></tr>
          <tr><td>rollback 절차</td><td>freeze→복구→검증→재개 순서</td><td>장애 확산</td></tr>
          <tr><td>drill 주기</td><td>월 1회 이상 복구훈련</td><td>문서만 있고 실행 불가</td></tr>
        </tbody>
      </table>

      <h3>운영 중단 조건과 kill switch</h3>
      <p>장기 실행 AI 작업은 비용, 품질, 권한, 외부 배포 리스크가 동시에 증가하므로 kill switch를 별도 운영 객체로 둔다. 발동 시 <code>pause_new_runs</code>, <code>cancel_queued_runs</code>, <code>stop_active_runs</code>, <code>disable_high_cost_models</code>, <code>revoke_external_publish</code>, <code>freeze_credentials</code> 중 필요한 조치를 수행한다.</p>
      <table>
        <thead><tr><th>SLI</th><th>예시 SLO</th><th>경보</th><th>자동 조치</th></tr></thead>
        <tbody>
          <tr><td><code>cost_burn_rate_1h</code></td><td>월 예산 대비 계획 burn의 2x 이하</td><td>2x 30분 지속 ticket, 4x 즉시 page</td><td>신규 큐 동결, 고급 모델 다운시프트</td></tr>
          <tr><td><code>checkpoint_restore_success_rate</code></td><td>99% 이상</td><td>2회 연속 실패 page</td><td>해당 shard 중단, 마지막 정상 checkpoint 복구</td></tr>
          <tr><td><code>resume_delay_p95</code></td><td>15분 이하</td><td>30분 초과 ticket, 60분 초과 page</td><td>워커 재시작, 큐 drain</td></tr>
          <tr><td><code>claim_defect_rate_high_risk</code></td><td>D등급 0건</td><td>1건 발생 block</td><td>외부 배포 금지</td></tr>
          <tr><td><code>human_approval_expired_count</code></td><td>0건</td><td>1건 발생 ticket</td><td>승인 만료 작업 자동 hold</td></tr>
        </tbody>
      </table>
      <div><strong>정책 라벨:</strong> <code>CD_ratio &gt; 0.35</code> 는 외부 표준이 아니라 본 문서의 임시 publish gate다. 과거 리뷰 데이터가 쌓이기 전까지는 보수적 정책으로 사용하고, 3회 이상 릴리스 회고 후 실제 결함률과 비교해 임계값을 재조정한다.</div>
    </section></article></template>

  <h1>SDD (1) — 기능 요구사항 → 구현</h1>
  <p>기능 스펙을 표준 형식(<strong>spec.md</strong>)으로 정형화하고, <strong>test-first</strong> 로 실패하는 테스트를 먼저 만든 뒤, 스펙에 근거해 <strong>최소 구현</strong> 을 합니다. Copilot이 만든 테스트도 사람이 검토합니다.</p>
