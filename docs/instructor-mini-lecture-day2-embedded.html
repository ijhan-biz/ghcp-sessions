    </tbody>
  </table>
  <div><strong>선정 기준:</strong> blind-v2 132 primary·35 external screen·29 confirmation attempts(12 stable)에서 세 번 모두 품질 gate를 통과한 후보를 비교했습니다. TTFT·p95·실제 청구액이 아니며 강의 당일 조직 정책과 세션 로그를 확인합니다. <a href="../aibuild-squad/output/260627_edu/edu_context/%ED%99%9C%EB%8F%99%EB%B3%84-%EB%AA%A8%EB%8D%B8-%EC%B6%94%EC%B2%9C-%EB%B3%B4%EA%B3%A0%EC%84%9C-2026-07-11.html" target="_blank" rel="noopener noreferrer">전체 근거 보기</a></div>
</section>

<section>
  <h2>미니강의 — SDD는 "검증 가능한 스펙 → 구현"</h2>
  <p>SDD(<span>SD-01</span>)는 요구사항을 정형화하고 Acceptance Criteria·Test Matrix로 <strong>검증 가능하게</strong> 만든 뒤 구현하는 방식입니다. 핵심은 순서입니다: <strong>스펙 → 테스트 → 구현</strong>. 구현을 먼저 하면 테스트가 구현을 따라가며 의미가 약해집니다.</p>
  <div>
    <span>spec.md</span> <span>→</span> <span>실패 테스트(test-first)</span> <span>→</span> <span>사람 검토</span> <span>→</span> <span>최소 구현</span> <span>→</span> <span>로컬 테스트</span>
  </div>
  <div><strong>RED의 이중 의미:</strong> 테스트 명령은 실패하지만 <code>d2-s4-red</code> checkpoint는 PASS할 수 있습니다. 이는 오류를 숨긴 것이 아니라 구현 전 테스트가 미구현 요구를 정확히 감지했다는 순서 증거입니다.</div>
</section>

<section>
  <h2>실습 1 — spec.md 정형화</h2>
  <div><div>spec.md 표준 형식 (<span>SD-07</span>)</div>
<pre><code># Feature: 집중 세션 분리 (예시)
## Context
- 비식별 스펙: 활동 이벤트 목록을 받아 유휴 간격 기준으로 집중 세션을 나눈(순수 로직)
## Requirements
- R1 유휴 간격이 임계 초과면 새 세션 / R2 임계 이하면 같은 세션(end 확장) / R3 무효 이벤트(start&gt;=end)는 제외
## Acceptance Criteria
- AC1 유휴 간격 초과 시 세션 분리 (정상)
- AC2 간격이 정확히 임계면 같은 세션 (경계)
- AC3 public API(sessionize) 시그니처 불변
## Tests First
- activity.test.js: 세션화 2건 (현재 skip)
## Constraints
- 외부 패키지 금지, 실제 OS 수집 금지(collector 주입), allowed: src/activity.js, test/activity.test.js</code></pre></div>
</section>

<section>
  <h2>실습 2 — test-first 구현</h2>
  <div><div>STEP 1 · 실패 테스트 먼저</div>
<pre><code>[작업] test/activity.test.js의 sessionize 테스트 2개에서 { skip: true }를 {}로 바꿔 skip만 해제하라.
[제약] 테스트 이름·assertion·fixture와 구현 코드는 수정하지 마라.
[검토] npm test가 sessionize 기대값에서 2건 실패해야 정상 RED다.
[출력] 실패한 테스트 이름 + 각 테스트가 검증하는 AC 매핑.</code></pre></div>
  <div><div>STEP 2 · 사람이 테스트 검토</div><p>활성화한 기존 테스트가 스펙을 제대로 검증하는지 <strong>동료/PL이</strong> 확인합니다. 검토 기준: ① AC와 <strong>1:1 매핑</strong> ② 정상·경계 케이스 <strong>분리</strong> ③ 실패 위치가 환경·import가 아닌 <strong>sessionize 기대값</strong>. 불일치하면 assertion을 약화하지 않고 stop 후 스펙·테스트 owner에게 확인하며, 일치하면 approve 후 STEP 3으로 진행합니다.</p></div>
  <div><div>STEP 3 · AI 첫 답 판단 후 최소 구현</div>
  <p>AI 첫 답은 정답이 아니라 후보입니다. <code>lab-work/implementation-decision.md</code> 에 수용/거부와 AC·테스트 근거를 먼저 기록합니다. 근거 없이 첫 답을 붙여 넣으면 checkpoint가 BLOCK됩니다.</p>
<pre><code>[작업] 방금 활성화한 테스트를 통과시킬 최소 변경만 구현하라.
[규칙] AC 1개만 통과시키는 최소 코드 — 여러 AC를 한 번에 구현 금지. 통과 후 다음 AC로.
[제약] public API 유지, 외부 패키지 금지, allowed files만 수정.
[멈춤] 구현 후 테스트 결과 + diff 요약 보고하고 멈춰.</code></pre></div>
  <div><div>STEP 4 · 로컬 게이트</div>
<pre><code>npm test        # 전체 유닛테스트 GREEN 확인
npm run gate   # lint + test + lab:selftest + policy-check</code></pre></div>
</section>

<section>
  <h2>참조 심화 — 에이전트 SDLC 경계 &amp; 추적성</h2>
  <h3>3층 책임 모델</h3>
  <div><span>기록 시스템(로컬 Git, PR 대체)</span> <span>→</span> <span>Copilot = 보조 레이어</span> <span>→</span> <span>사람 = 승인 경계</span></div>
  <div><strong>AI 레드라인:</strong> 에이전트는 <strong>merge·release·publish·rollback 승인</strong>, <strong>보안 go/no-go</strong>, <strong>아키텍처·데이터 결정</strong>, <strong>고객 데이터·secret 취급</strong> 을 할 수 없습니다. "AI 초안 → 사람 검토 → 정책 강제."</div>
  <h3>추적성 · 로컬 버전</h3>
  <p>원격 PR이 없으므로 <strong>스펙 ↔ 브랜치 ↔ 커밋 ↔ 로컬 체크 ↔ 리뷰어</strong> 를 패킷으로 연결합니다(요구사항 추적성 <span>SD-13</span>). 모든 변경이 어느 AC에서 왔는지 추적되어야 합니다.</p>
  <div><strong>BDD 브래킷:</strong> 단계를 <code>Given-When-Then</code> 문장으로 열고, <em>같은 문장 + 증거 링크</em> 로 닫습니다. AC는 <strong>SMART + 측정 source</strong> 가 명시되어야 합니다.</div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>skip만 해제해 구현 전 테스트가 요구사항 때문에 실패하는 RED를 확인한다.</li><li>AI 첫 답을 AC·테스트 근거로 수용·거부한 뒤 allowed files에 최소 구현한다.</li><li>RED와 GREEN을 각각 독립 evidence로 남긴다.</li></ul></div>
    <div><h3>RED 결과 예시</h3><pre><code>activity.test.js: 5 pass / 0 skip / 2 fail
실패 위치: sessionize 기대값
checkpoint d2-s4-red: PASS
구현 변경: 없음</code></pre></div>
    <div><h3>GREEN 결과 예시</h3><pre><code>판단: AI 후보 revise 후 수용
근거: AC1·AC2와 경계 테스트 일치
activity.test.js: 7 pass / 0 skip / 0 fail
checkpoint d2-s4-green: PASS</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> RED의 테스트 실패는 checkpoint 실패가 아닙니다. 구현 없이 요구사항 결손을 정확히 감지해야 RED checkpoint가 PASS하며, 구현 코드는 예시를 복사하지 않고 테스트 근거로 직접 완성합니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> spec.md + 실패 테스트(검토 완료) + 스펙 기반 최소 구현(allowed files 내).</div>
  <ul>
    <li>test-first 순서가 지켜졌는가?</li>
    <li>각 테스트가 AC와 매핑되는가?</li>
    <li>구현이 allowed files 안에서만 이루어졌는가?</li>
  </ul>
  <div><strong>컷라인:</strong> must-have AC 1개에 대한 실패 테스트 → 구현 → 통과 1사이클이면 통과입니다.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>
  <ul>
    <li>구현부터 하고 테스트를 나중에 → SDD가 아님. 테스트를 먼저.</li>
    <li>Copilot 테스트를 그대로 신뢰 → 반드시 사람이 검토합니다.</li>
  </ul>
  <div><strong>공유 포인트:</strong> "스펙 한 줄 ↔ 테스트 한 줄"의 추적성(<span>SD-13</span>) 사례. SDD의 가치를 가장 명확히 보여줍니다.</div>
</section>

<section>
  <h2>이 세션의 실행 코드 (Hands-on)</h2>
  <div><strong>test-first 핵심 실습</strong> — Day2 실습 프로젝트(새 창의 <code>sample-project-activity-log</code>)에서 실패 테스트를 먼저 켜고 구현합니다.</div>
<pre><code># 새 창의 sample-project-activity-log 통합 터미널에서
npm test         # baseline 5 pass / 2 skip(세션화 2건)
npm run lab -- start d2-s4-red
# test/activity.test.js 의 { skip: true } 2곳을 {}로 변경
npm run lab -- check d2-s4-red       # 테스트 FAIL · checkpoint PASS
npm run lab -- start d2-s4-green     # AI 첫 답 수용/거부 기록 starter
# sessionize 최소 구현 + implementation-decision.md 작성
npm run lab -- check d2-s4-green     # 판단 근거 + 7/0/0</code></pre>
  <p>진행 순서: 프로젝트 <code>README.md</code> · 프로젝트 열기: D2·S0 "VS Code 새 창에서 열기"</p>
</section>

  <div><strong>빌드업 연결:</strong> 여기서 만든 실패 테스트·최소 구현은 <strong>D2·S5 리뷰 패킷(evidence bundle)</strong> 의 입력이 됩니다(검증 기준: 검증 가능성).</div>

      <h2>4. 단계별 상세 사용법</h2>
      <h3>4-1. Intake: Issue를 agent-ready work item으로 만들기</h3>
      <div>
        <div><div>1</div><div><h3>Issue form을 표준화</h3><p>문제, 사용자 영향, 성공 기준, 제외 범위, 데이터 민감도, 테스트 기대값을 입력하게 한다. Copilot은 description을 요약하고 빠진 정보를 질문하는 데 사용한다.</p></div></div>
        <div><div>2</div><div><h3>Risk tier를 붙임</h3><p>문서/테스트/로깅 변경은 낮은 risk, 권한·데이터·배포·보안 변경은 높은 risk로 분류한다. 높은 risk는 cloud agent 자동 변경보다 plan-first와 human approval을 우선한다.</p></div></div>
        <div><div>3</div><div><h3>Acceptance criteria를 명시</h3><p>Copilot에게 “done”을 맡기지 않는다. 사람이 검증 가능한 acceptance criteria와 required checks를 만든 뒤 agent에게 구현 후보를 맡긴다.</p></div></div>
      </div>

      <h3>4-2. Planning: Repo context를 source-aware plan으로 바꾸기</h3>
      <table>
        <thead><tr><th>작업</th><th>Copilot 사용</th><th>Gate</th><th>산출물</th></tr></thead>
        <tbody>
          <tr><td>관련 코드 찾기</td><td>Chat/CLI/cloud agent에게 파일 후보, dependency, owner, test path를 찾게 한다.</td><td>근거 없는 파일 추정 금지</td><td>context manifest</td></tr>
          <tr><td>설계 옵션 비교</td><td>2~3개 대안을 trade-off, failure mode, rollback 기준으로 비교하게 한다.</td><td>Architecture owner review</td><td>ADR 초안</td></tr>
          <tr><td>테스트 계획</td><td>unit/integration/e2e/security/regression test 후보를 만들게 한다.</td><td>Test owner가 coverage gap 승인</td><td>test matrix</td></tr>
          <tr><td>작업 분할</td><td>PR 크기를 작게 나누고 merge 순서를 제안하게 한다.</td><td>각 PR 독립 rollback 가능</td><td>PR plan</td></tr>
        </tbody>
      </table>

      <h3>4-3. Implementation: GitHub 작업면 안에서 변경 만들기</h3>
      <div>
        <div><h3>IDE Copilot</h3><p>짧은 코드 작성, local refactor, test stub, 설명 요청에 적합하다. 민감정보와 대규모 파일 범위는 명시적으로 제외한다.</p></div>
        <div><h3>Copilot CLI</h3><p>터미널 작업, repo 탐색, 명령 초안, scripted workflow 설명에 적합하다. write/deploy/delete 명령은 사람 승인 gate를 둔다.</p></div>
        <div><h3>Cloud agent</h3><p>Issue 기반 구현, branch/PR 생성, test/lint 실행, 문서 업데이트 후보에 적합하다. repo/branch/PR 제한과 content exclusion caveat를 항상 표시한다.</p></div>
      </div>
    </section></article></template>

<template id="embedded-source-043"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C53</strong><span>SDLC 하네스 실제 사례</span><span>GitHub Spec Kit — /specify → /plan → /tasks → /implement</span></p><div><div><div>CASE C1 · 공식 저장소</div><h3>GitHub Spec Kit — /specify → /plan → /tasks → /implement</h3><div><span>Spec-driven</span> <span>슬래시 워크플로우</span> <span>30+ 에이전트 지원</span> <span>taskstoissues</span></div></div><div><p>📦 <b>공개 저장소:</b> <a href="https://github.com/github/spec-kit" target="_blank" rel="noopener noreferrer">github/spec-kit</a></p>
<p><b>개요.</b> <code>github/spec-kit</code> 는 에이전트를 <b>명세 우선</b> 레일에 태우는 툴킷이다. <code>specify init</code> 이 선택한 에이전트에 슬래시 커맨드(프롬프트 템플릿)를 설치하고, 에이전트는 <b>헌법→명세→계획→작업분해</b> 를 거치기 전엔 코드를 쓰지 않는다. 이것이 "workflow 층 하네스"의 정석이다.</p>
<h4>설치 · 워크플로우</h4>
<pre><code><span># 설치(고정 릴리스) 또는 일회성 실행</span>
uv tool install specify-cli --from git+https://github.com/github/spec-kit.git@vX.Y.Z
uvx --from git+https://github.com/github/spec-kit.git@vX.Y.Z specify init my-project

<span># 에이전트를 골라 프로젝트에 하네스 설치</span>
specify init my-project --integration copilot   <span># 또는 claude / codex / cursor-agent / gemini ...</span></code></pre><pre><code>/speckit.constitution   # 모든 개발을 지배하는 원칙/가이드라인 생성·갱신
/speckit.specify        # 기능 설명 -&gt; 구조화된 PRD(spec.md). feature 번호·git 브랜치 자동 생성
/speckit.clarify        # 미명세 영역 질의·해소 (plan 전 권장)
/speckit.plan           # spec + 헌법 제약 -&gt; 기술 아키텍처(data-model, contracts, research)
/speckit.tasks          # plan -&gt; 실행 가능한 tasks.md. 독립 작업은 [P] 병렬 표시
/speckit.analyze        # 산출물 간 일관성·커버리지 교차 분석
/speckit.checklist      # 요구사항 완결성·명확성·일관성 검증용 커스텀 체크리스트 생성
/speckit.implement      # tasks.md 전체 실행
/speckit.converge       # 코드베이스를 spec/plan/tasks와 대조해 남은 작업을 새 task로 추가
/speckit.taskstoissues  # 작업 목록 -&gt; GitHub Issues 로 변환(프로젝트관리 층과 연결)</code></pre>
<h4>생성되는 구조 = 폐루프의 기록물</h4>
<pre><code>my-project/
├── .specify/
│   ├── templates/              # SDD 커맨드 템플릿(오버라이드/preset/extension 우선순위 스택)
│   └── scripts/{bash,powershell}/
└── specs/
    └── 003-chat-system/        # /speckit.specify 가 만든 자동 번호 브랜치
        ├── spec.md             # user story·acceptance criteria
        ├── plan.md             # /speckit.plan
        ├── research.md         # (자동) 라이브러리 비교 등
        ├── data-model.md
        ├── contracts/          # API/이벤트 계약
        └── tasks.md            # [P] 병렬 마커 포함 실행 목록</code></pre>
<p><b>Agentic SDLC 매핑.</b> 헌법=거버넌스, spec=요구사항 기록, plan=설계, tasks=작업분해, implement=구현, taskstoissues=프로젝트관리 환류. spec을 git에 버전드로 남겨 <b>명세가 단일 기준(system of record)</b> 이 된다. 조직은 extension/preset으로 컴플라이언스 게이트·도메인 용어를 얹는다.</p>
<div><h4>팀 하네스 맥락 · 결과 · 에피소드</h4><ul><li><b>맥락:</b> SDD가 권력 구조를 뒤집음 — "코드가 명세를 섬긴다. PRD는 구현의 가이드가 아니라 <b>구현을 생성하는 원천</b>." <code>/speckit</code> 체인을 끝내기 전엔 코드를 못 씀.</li><li><b>결과:</b> 문서 사이트 기준 30+ 통합(2026-07-07 문서 기준 <b>33개 명명 에이전트</b> + Generic), 커뮤니티 <i>(자가보고)</i> 105 확장·60+ 저자·22 preset. 최신 v0.12.5.</li><li><b>에피소드:</b> spec-driven.md의 시간 비교 — 전통 방식 문서화 ~12시간 vs SDD 커맨드로 <b>15분에 명세+계획</b> 완성. (참고: GitHub 엔지니어링 블로그 URL은 조사 시점 미발견 — 저장소·docs가 1차 근거.)</li></ul><p>💰 <b>토큰 절약 포인트:</b> <b>명세를 파일로 고정</b> 해 "매번 다시 설명하는" 토큰을 없앤다. 헌법·spec·plan·tasks를 <code>specs/</code> 에 버전드로 남기면, 세션이 바뀌어도 에이전트가 요구사항·아키텍처·작업분해를 <b>재서술 없이 단일 기준(system of record)으로 재사용</b> 한다 — 긴 요구사항을 매 대화에서 프롬프트로 반복 입력할 필요가 없다. 또 <code>/speckit</code> 체인을 끝내기 전엔 코드를 못 쓰게 강제하므로, 명세 없이 잘못 구현했다가 <b>버리고 다시 짜는 재작업 토큰</b> 을 앞단에서 차단한다.</p><p><b>보강 출처</b> · web: github.com/github/spec-kit(spec-driven.md)·github.github.io/spec-kit · 내부: 050·024</p></div><div><b>출처</b> · github.com/github/spec-kit(README·spec-driven.md·docs/installation·docs/reference/integrations) · github.github.io/spec-kit. <span>참고</span> 별도 GitHub 엔지니어링 블로그 URL은 조사 시점 404 — 저장소를 1차 근거로 인용. 지원 에이전트 30+.</div><p><a href="../../../ref/harness-gen-output/053-agentic-sdlc-harness-engineering-real-cases-2026-07-10.html#toc" target="_blank" rel="noopener noreferrer">↑ 목차</a></p>
</div></div></article></template>

    <h2><span>8</span> 출처 기반 검증</h2>
    <p>AI 답변에 출처가 붙었다고 해서 그 답이 자동으로 사실이 되는 것은 아닙니다. Grounding/RAG는 답변을 승인된 자료에 묶어 정확도를 높이는 구조지만, 검색 품질, 문서 최신성, 권한, citation 품질에 따라 결과가 달라집니다.</p>
    <div>
      <div><span>CHECK 1</span> <h3>근거 출처를 요구한다</h3><p>“교재 페이지, 공식 문서, DOI, 정책 문서 중 하나에 근거를 연결해줘. 모르면 모른다고 말해줘.”라고 요청합니다.</p></div>
      <div><span>CHECK 2</span> <h3>원문을 직접 본다</h3><p>AI가 준 링크의 제목, 날짜, 연구 대상, 한계를 확인합니다. DOI나 기관 보고서는 접근 제한이 있을 수 있으므로 abstract 또는 landing page를 확인합니다.</p></div>
      <div><span>CHECK 3</span> <h3>내 설명으로 다시 쓴다</h3><p>출처 확인 뒤에도 복붙하지 말고 자기 언어로 재설명합니다. 이것이 Feynman loop의 마지막 단계입니다.</p></div>

<template id="embedded-source-046"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>D2S5</strong><span>과정 D2·S5 · 증거·통합</span><span>SDD (2) — 통합 &amp; 유닛테스트 · 리뷰 패킷</span></p><main>


<header>
  <div>DAY 2 · SESSION 5 · 15:10–16:20 (70m)</div>
  <h1>SDD (2) — 통합 &amp; 유닛테스트 · 리뷰 패킷</h1>
  <p>기능을 통합 관점에서 점검하고 유닛테스트를 보강한 뒤, "동작한다"가 아니라 <strong>증거와 되돌림 경로가 있는</strong> 상태로 마무리합니다. PR을 대신하는 <strong>local review packet</strong> 을 제출물로 만듭니다.</p>
  <div><span><strong>HE-03</strong> 로컬 게이트</span> <span><strong>HE-18</strong> Evidence bundle</span> <span><strong>HE-15</strong> Local review packet</span> <span><strong>HE-10</strong> Rollback path</span> <span><strong>HE-16</strong> No-cloud attestation</span></div>
</header>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li>유닛테스트를 보강하고 통합 관점(주변 영향)을 점검한다.</li>
    <li><strong>evidence bundle</strong> (변경 요약·테스트·정책체크·diff·리스크)을 만든다(<span>HE-18</span>).</li>
    <li><strong>rollback note</strong> 와 <strong>no-cloud attestation</strong> 을 포함한 <strong>local review packet</strong> 을 제출한다(<span>HE-15</span>).</li>
  </ul>
</section>

<section>
  <h2>이 세션의 활동별 권장 모델</h2>
  <table>
    <caption>D2·S5 활동 · 책임 주체 · 권장 모델</caption>
    <thead><tr><th>활동</th><th>주체·과업군</th><th>권장 모델</th><th>한 줄 이유</th></tr></thead>
    <tbody>
      <tr><td>evidence·rollback·provenance 요약</td><td>AI 보조 · F4</td><td><strong>Claude Sonnet 5</strong></td><td>결함·근거 검토를 3회 품질 gate로 재현</td></tr>
      <tr><td>gate·packet 생성</td><td>도구 · N0</td><td><strong>모델 미사용</strong></td><td>결정론적 gate와 packet 명령으로 증거 생성</td></tr>
      <tr><td>PL 승인</td><td>사람 · N0</td><td><strong>모델 미사용</strong></td><td>발행·적용 책임은 PL이 승인</td></tr>
    </tbody>
  </table>
  <div><strong>선정 기준:</strong> blind-v2 132 primary·35 external screen·29 confirmation attempts(12 stable)에서 세 번 모두 품질 gate를 통과한 후보를 비교했습니다. TTFT·p95·실제 청구액이 아니며 강의 당일 조직 정책과 세션 로그를 확인합니다. <a href="../aibuild-squad/output/260627_edu/edu_context/%ED%99%9C%EB%8F%99%EB%B3%84-%EB%AA%A8%EB%8D%B8-%EC%B6%94%EC%B2%9C-%EB%B3%B4%EA%B3%A0%EC%84%9C-2026-07-11.html" target="_blank" rel="noopener noreferrer">전체 근거 보기</a></div>
</section>

<section>
  <h2>미니강의 — PR 없이도 "리뷰 가능한 상태"를 만든다</h2>
  <p>GitHub PR이 없는 환경에서 리뷰어가 볼 수 있도록 제출물을 <strong>패킷</strong> 으로 묶습니다(<span>HE-15</span>). 패킷은 spec.md·diff·test log·정책/수동 게이트 결과·rollback note·no-cloud attestation으로 구성됩니다. 이것이 Day2의 핵심 산출물이자 수료 필수 항목(<span>EV-09</span>)입니다.</p>
</section>

<section>
  <h2>실습 — 검증 → 패킷</h2>
  <div><div>STEP 1 · 검증 명령</div>
<pre><code>npm test
node scripts/policy-check.mjs
git diff --stat
git diff -- src/activity.js test/activity.test.js</code></pre></div>
  <div><div>STEP 2 · Evidence Bundle (<span>HE-18</span>)</div>
  <ul>
    <li>변경 요약: 어떤 AC를 위해 어떤 파일을 바꿨는가</li>
    <li>테스트 결과: 실행 명령·통과/실패·실패 원인</li>
    <li>정책 체크 결과: 금지 파일/secret/외부 패키지 여부</li>
    <li>리스크: 남은 known gap, manual check 필요 여부</li>
  </ul></div>
  <div><div>STEP 2.5 · Execution Provenance와 학습부채</div>
  <p><code>npm run packet</code> 은 <strong>CLEAN</strong>, runner recover의 <strong>FALLBACK</strong>, solved checkpoint와 일치한 <strong>REFERENCE-MATCH</strong> 를 구분합니다. FALLBACK/REFERENCE-MATCH이면 사유, 부채 owner·due, D+7 직접 재구현 검증을 채워야 합니다.</p></div>
  <div><div>STEP 3 · Rollback Note (<span>HE-10</span> ·<span>HE-11</span>)</div>
<pre><code>## Rollback Note
- Trigger: AC 회귀 / 테스트 실패 / 금지 파일 변경 감지
- Owner: [담당자/PL]
- Action: git restore [files] 또는 해당 local commit revert
- Verify: npm test &amp;&amp; node scripts/policy-check.mjs
- Completion: baseline green, 스펙 v1 상태로 복구</code></pre></div>
  <div><div>STEP 4 · Local Review Packet 묶기</div>
  <p>spec.md + diff + test log + 게이트 결과 + rollback note + <strong>no-cloud attestation</strong> (<span>HE-16</span>: Codespaces·PR·Actions 미사용 선언)을 한 폴더로.</p></div>
  <div><div>STEP 5 · P-B(리드/PL) 승인 게이트</div>
  <p>PR이 없으므로 승인 신호를 <strong>명시적으로</strong> 남깁니다: 패킷을 공유 폴더/Git tag로 전달 → 리드가 <strong>approve</strong> (커밋 메시지나 <code>APPROVALS.log</code> 에 승인자·일시 기록) · <strong>request-changes</strong> (<code>.review/feedback.md</code> 에 사유·개선 방향) · <strong>block</strong> (사유 + 에스컬레이션). 승인 기록이 없는 변경은 '리뷰 완료'로 보지 않습니다.</p></div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>테스트·policy·diff·리스크를 같은 revision의 evidence로 묶는다.</li><li>CLEAN/FALLBACK/REFERENCE-MATCH 경로와 남은 부채를 숨기지 않는다.</li><li>rollback trigger·owner·restore action·recovery check를 작성한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>gate: PASS
revision: &lt;local commit&gt;
provenance: CLEAN
activity checkpoint: 7 pass / 0 skip / 0 fail
full npm test: PASS
policy: PASS
rollback owner: 기능 담당자
trigger: gate 회귀 또는 AC 불일치
debt: none</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> FALLBACK을 사용했다면 <code>provenance: FALLBACK</code> 과 D+7 재구현 owner·due를 적는 것이 올바른 결과입니다. CLEAN처럼 보이게 만드는 것이 목표가 아닙니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물</h2>
  <div><strong>산출물:</strong> local review packet(evidence bundle·CLEAN/FALLBACK/REFERENCE-MATCH provenance·학습부채·rollback owner·no-cloud attestation 포함).</div>
  <table>
    <caption>리뷰 패킷 go/no-go 기준</caption>
    <thead><tr><th>패킷 항목</th><th>go</th><th>no-go</th></tr></thead>
    <tbody>
      <tr><td>구현</td><td>테스트 통과·diff 설명 가능</td><td>테스트 실패 또는 diff 설명 불가</td></tr>
      <tr><td>게이트</td><td>lint/test/lab:selftest/policy-check 실행됨</td><td>게이트 없음</td></tr>
      <tr><td>rollback</td><td>되돌림 명령·owner 명시</td><td>없음</td></tr>
      <tr><td>provenance</td><td>CLEAN/FALLBACK/REFERENCE-MATCH·비-CLEAN 부채 owner/due 명시</td><td>FALLBACK·REFERENCE-MATCH 숨김 또는 미작성 placeholder</td></tr>
    </tbody>
  </table>
  <div><strong>컷라인:</strong> 테스트 1개 통과 + policy-check 1회 + rollback note 1개 = 최소 수료 경로(<span>EV-10</span>).</div>
</section>

<section>
  <h2>참조 심화 — 운영 지표 · 롤백 드릴 · 발행 게이트</h2>
  <h3>로컬 버전 SLI/SLO</h3>
  <table>
    <caption>로컬 SLI/SLO</caption>
    <thead><tr><th>지표</th><th>목표</th></tr></thead>
    <tbody>
      <tr><td>변경 추적성(스펙·브랜치·체크·리뷰어)</td><td>100%</td></tr>
      <tr><td>고위험 변경 사람 리뷰</td><td>100%</td></tr>
      <tr><td>릴리스 후보 checker pass</td><td>100%</td></tr>
      <tr><td>민감정보(secret·고객·비공개) 노출</td><td>0</td></tr>
      <tr><td>인시던트 학습(회고+checker 후속)</td><td>100%</td></tr>
    </tbody>
  </table>
  <h3>롤백 드릴 리허설</h3>
  <p>release-readiness 진입 시 <strong>dry-run</strong> 으로 MTTR·owner·신호(metric)를 기록합니다. 되돌림을 "처음" 해보는 일이 없게 합니다.</p>
  <div><strong>발행 게이트 hold:</strong> runbook·승인·지표 중 하나라도 없으면 <strong>내부 데모용으로만</strong>. <code>CD_ratio &gt; 0.35</code> (결함/주장 비율)이면 발행 block.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>
  <ul>
    <li>"테스트 통과"로 끝냄 → 증거·롤백이 없으면 리뷰 불가. 패킷까지 만듭니다.</li>
    <li>rollback note를 형식적으로 → 실제 명령과 owner가 있어야 의미가 있습니다.</li>
  </ul>
  <div><strong>공유 포인트:</strong> "게이트가 잡아낸 위반 1건"과 "되돌림에 걸린 시간". 검증 문화의 효과를 수치로 공유하면 설득력이 큽니다.</div>
</section>

<section>

<template id="embedded-source-047"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>H21</strong><span>하네스 역사와 핵심 개념</span><span>5. Operating Model</span></p><section>
      <h2>5. Operating Model</h2>
      <p>이 저장소의 하네스 운영은 문서를 예쁘게 만드는 절차가 아니라, 반복 가능한 발행 루프다. 특히 고객-facing 자료는 “생성한 뒤 검토”가 아니라 “근거 경계와 실패 조건을 먼저 고정한 뒤 생성”으로 이동한다.</p>
      <div>
        <div>
          <h3>Recommended Loop</h3>
          <ol>
            <li><strong>Read</strong>: ref, output, ADR, scripts, rounds에서 관련 corpus를 찾는다.</li>
            <li><strong>Analyze</strong>: Fact, Interpretation, Forecast와 source type을 분리한다.</li>
            <li><strong>Learn</strong>: 반복되는 실패와 금지 표현을 checker 조건으로 바꾼다.</li>
            <li><strong>Fix</strong>: HTML, source set, checker, package script를 함께 보정한다.</li>
            <li><strong>Result</strong>: PASS/FAIL, 잔여 리스크, reviewer action을 남긴다.</li>
          </ol>
        </div>
        <div>
          <h3>Operating Rules</h3>
          <ul>
            <li>must-have 제약은 자연어 설명으로만 두지 않고 checker에 넣는다.</li>
            <li>source set은 보고서의 부록이 아니라 report wording rule의 입력이다.</li>
            <li>하네스 실패는 품질 사건이며, 우회가 아니라 원인 기록과 수정 대상이다.</li>
            <li>외부 공유 전에는 product owner와 research owner가 release-time recheck를 완료한다.</li>
          </ul>
        </div>
      </div>
      <div>이 문서 자체의 gate는 <code>check:harness-history-report</code> 다. checker는 구조, 필수 섹션, source boundary, 금지 과장, SLO/rollback 표, package wiring을 확인한다.</div>
    </section></article></template>

<template id="embedded-source-049"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C53</strong><span>SDLC 하네스 실제 사례</span><span>OpenHands — Docker ActionExecutor + append-only EventStream</span></p><div><div><div>CASE B2 · 공식 docs + SDK</div><h3>OpenHands — Docker ActionExecutor + append-only EventStream</h3><div><span>Docker 런타임 격리</span> <span>불변 이벤트로그</span> <span>Skills</span> <span>SecurityAnalyzer</span></div></div><div><p>📦 <b>공개 저장소:</b> <a href="https://github.com/OpenHands/OpenHands" target="_blank" rel="noopener noreferrer">OpenHands/OpenHands</a></p>
<p><b>개요.</b> OpenHands(구 OpenDevin)는 에이전트를 <b>Docker 컨테이너 안의 ActionExecutor</b> 에서만 실행한다. 에이전트가 낸 <code>ActionEvent</code> 는 EventStream을 거쳐 컨테이너에서 실행되고 <code>ObservationEvent</code> 로 돌아온다. 상태는 <b>불변(append-only) 이벤트 로그</b> 로만 남아 관측·재현·중단/재개가 쉽다.</p>
<h4>하네스 ① 실행 격리 — Docker 런타임</h4>
<div>
  <span>Agent</span> <span>→ ActionEvent →</span>
  <span>EventStream</span> <span>→</span>
  <span>Docker: ActionExecutor(bash·browser·jupyter)</span> <span>→ ObservationEvent →</span>
  <span>Agent</span>
</div>
<p>Docker가 하네스인 이유: ① 보안(호스트로 탈출 불가) ② 일관성 ③ 리소스 한도 ④ 재현성. 이미지는 version/lock/source 3-해시 태깅으로 캐시 효율화.</p>
<pre><code><span>export</span> PROJECTS_PATH=<span>"<span>$HOME</span>/projects"</span>
<span>mkdir</span> -p <span>"<span>$PROJECTS_PATH</span>"</span> <span>"<span>$HOME</span>/.openhands"</span>
docker run -it --<span>rm</span> \
  -p 8000:8000 \
  -v <span>"<span>$HOME</span>/.openhands:/home/openhands/.openhands"</span> \
  -v <span>"<span>${PROJECTS_PATH}</span>:/projects"</span> \
  ghcr.io/openhands/agent-canvas:1.0.0-rc.11</code></pre>
<h4>하네스 ② 관측/복구 — 이벤트 기반 stateless 루프</h4>
<p>매 <code>step()</code> 은 원자적이고 상태가 없다. 컨텍스트가 넘치면 <code>CondensationRequest</code> 로 압축한다. 모든 이벤트는 불변 Pydantic 모델이라 그대로 감사 로그이자 재개 지점이 된다.</p>
<pre><code>step() called
  |- Pending actions? -&gt; execute -&gt; return
  |- Has condenser? -&gt; condenser.condense(event_history)
  |     |- Condensation -&gt; emit CondensationSummaryEvent -&gt; return
  |     \- View -&gt; use condensed events for LLM query
  |- Query LLM
  |     \- Context window exceeded? -&gt; emit CondensationRequest -&gt; return
  |- Parse response: tool calls -&gt; ActionEvent(s) ; text -&gt; MessageEvent
  |- Confirmation needed? -&gt; WAITING_FOR_CONFIRMATION -&gt; return
  \- Execute tools -&gt; ObservationEvent(s)</code></pre>
<h4>하네스 ③ 컨텍스트 — Skills</h4>
<p>세 층: ① 항상 로드(repo root <code>AGENTS.md</code>) ② 키워드 트리거 ③ 온디맨드 <code>SKILL.md</code> (progressive disclosure). 파일 기반 서브에이전트도 지원.</p>
<pre><code><span>from</span> openhands.sdk.context <span>import</span> Skill, KeywordTrigger
Skill(
    name=<span>"encryption-helper"</span>,
    content=<span>"Use the encrypt.sh script to encrypt messages."</span>,
    trigger=KeywordTrigger(keywords=[<span>"encrypt"</span>, <span>"decrypt"</span>]),
)
<span># 트리거되면 유저 메시지에 주입:</span>
<span># &lt;EXTRA_INFO&gt; ... Skill location: /path/to/encryption-helper ... &lt;/EXTRA_INFO&gt;</span></code></pre><pre><code>---
name: code-reviewer
description: &gt;
  Reviews code for quality, bugs, and best practices.
  <span><span>&lt;<span>example</span>&gt;</span></span>Review this pull request for issues<span><span>&lt;/<span>example</span>&gt;</span></span>
tools:
<span>  -</span> file<span>_editor
  - terminal
model: inherit
---
# Code Reviewer
1. Correctness (bugs, off-by-one, race conditions)
2. Style  3. Performance  4. Security (injection, hardcoded secrets)
Keep feedback concise; for each issue, suggest a fix.</span></code></pre>
<p>검증 게이트로 <code>SecurityAnalyzer</code> 가 실행 전 <code>ActionEvent</code> 의 <code>security_risk</code> 를 판정하고, 사용자 확인이 필요한 액션은 <code>UserRejectObservation</code> 으로 거부될 수 있다.</p>
<div><h4>팀 하네스 맥락 · 결과 · 에피소드</h4><ul><li><b>맥락:</b> 연구 프레임워크 <b>OpenDevin → 상용 All-Hands AI</b> 로 진화. Docker 컨테이너 격리가 핵심 — 샌드박스 없이 돌리면 "에이전트가 파일시스템 전체 접근" 경고. <b>ACP</b> 로 Claude Code·Codex·Gemini 등 서드파티 에이전트를 백엔드로 연결.</li><li><b>결과:</b> 논문 "OpenHands: An Open Platform for AI Software Developers as Generalist Agents"(arXiv:2407.16741). 가장 별 많은 코딩 에이전트 OSS 중 하나(2026-07-07 기준 약 <b>7.9만 별</b>, 79,736).</li><li><b>에피소드:</b> 두-모드 설계(비샌드박스 로컬 vs Docker) 자체가 교훈 — 초기 배포서 에이전트가 <b>호스트 파일을 예기치 않게 수정</b> 한 경험이 "Docker 격리 기본"으로 이어짐.</li></ul><p>💰 <b>토큰 절약 포인트:</b> <b>이벤트 로그를 압축·외부화</b> 해 컨텍스트를 얇게 유지한다. 대화·액션 이력이 컨텍스트 창을 넘치려 하면 <code>CondensationRequest</code> 를 내보내 <b>핵심 사건·결정만 남기고 압축</b> (<code>CondensationSummaryEvent</code>)한다. 서브에이전트나 도구가 만든 <b>큰 산출물은 파일 아티팩트로 저장하고 대화에는 경량 참조(경로)만</b> 넘겨, 거대한 결과가 매 턴 대화이력에 복사되며 토큰을 갉아먹는 것을 막는다. 스킬은 항상로드(AGENTS.md)·키워드 트리거·온디맨드 <code>SKILL.md</code> 의 <b>progressive disclosure</b> 로 필요할 때만 펼쳐진다.</p><p><b>보강 출처</b> · web: github.com/OpenHands/OpenHands · arXiv:2407.16741</p></div><div><b>출처</b> · docs.openhands.dev/openhands/usage/architecture/runtime · /sdk/arch/agent · /sdk/arch/events · /sdk/guides/skill · /agent-file-based · /custom-tools. <span>참고</span> 저장소 <code>All-Hands-AI/OpenHands</code> →<code>OpenHands/OpenHands</code>, 2025–26 대규모 리라이트로 구 <code>.openhands/microagents/*.md</code> 는 legacy.</div><p><a href="../../../ref/harness-gen-output/053-agentic-sdlc-harness-engineering-real-cases-2026-07-10.html#toc" target="_blank" rel="noopener noreferrer">↑ 목차</a></p>
</div></div></article></template>

<header>

  <h1>Skill 사용 및 커스터마이징 — 나만의 재사용 솔루션을 만든다</h1>
  <p>오늘 만든 프롬프트·제약·워크플로를 매번 새로 쓰지 않도록 <strong>Custom Skill / Custom Agent</strong> 로 묶습니다. 이것이 이 과정의 결정체 — <strong>에이전트로 동작하는 자신만의 솔루션</strong> 입니다.</p>
  <div><span><strong>CF-08</strong> Custom Skill/Agent</span> <span><strong>PT-11</strong> 프롬프트 템플릿</span> <span><strong>CF-05</strong> Fleet</span> <span><strong>CF-10</strong> Model routing</span> <span><strong>EV-09</strong> 필수 수료</span></div>
</header>

<section>
  <h2>학습 목표</h2>
  <ul>
    <li><strong>Skill</strong> (절차·지식 재사용)과 <strong>Custom Agent</strong> (역할·도구·모델까지 묶음)의 차이를 이해한다.</li>
    <li>본인 반복 업무를 <strong>목적·입력·절차·금지·출력</strong> 구조의 Custom Skill로 정형화한다(<span>CF-08</span>).</li>
    <li>Fleet 안에서 역할별 Custom Agent와 모델 기준·도구 범위를 정한다.</li>
  </ul>
</section>

    <caption>D2·S6 활동 · 책임 주체 · 권장 모델</caption>

<section>
  <h2>미니강의 — Skill은 절차, Agent는 역할까지</h2>
  <p><strong>Skill</strong> 은 "이 반복 업무를 이렇게 한다"는 절차·지식을 MD로 재사용하는 단위입니다. <strong>Custom Agent</strong> 는 거기에 <strong>역할·노출 도구·모델 기준</strong> 까지 묶습니다. D2·S3에서 설계한 본인 워크플로를 여기서 자산으로 굳힙니다.</p>
  <div><strong>설계 질문:</strong> 어떤 반복 업무를 줄이나? 입력은? 절대 하면 안 되는 일은? 완료 산출물과 pass/revise/block 기준은? Fleet에서 어떤 역할인가? 노출/비노출 도구는?</div>
</section>

<section>
  <h2>실습 1 — Custom Skill 작성 (<span>CF-08</span>)</h2>
  <div><div>예: 기능 스펙 SDD 보조 Skill</div>
<pre><code># 기능 스펙 SDD 보조 Skill
## 목적
비식별 기능 스펙을 User Story·AC·Test Matrix·구현 계획으로 정리한다.
## 입력
- Feature Spec Pack / Context Manifest / 현재 테스트 결과
## 절차
1. 민감정보/고객 데이터 확인  2. User Story·AC를 SMART하게
3. allowed/blocked 분리  4. test-first 계획  5. human gate 표시
## 금지
- 고객명/계정/secret 추정 · 외부 패키지 추가 제안 · 승인 없는 운영/배포/삭제
## 출력
- AC 표 · Context Manifest · Test Matrix · Plan · Risk/Gate · Rollback Note</code></pre></div>
</section>

  <h3>단계별 모델 계층(토큰 효율)</h3>
  <div><span>명세=GPT-5.6 Luna</span> <span>→</span> <span>계획=모델 미사용</span> <span>→</span> <span>구현=GPT-5.4 mini</span> <span>→</span> <span>리뷰=Claude Sonnet 5</span> <span>→</span> <span>gate=모델 미사용</span></div>
  <p>모델 등급을 추정으로 배치하지 않고, 각 과업의 품질 gate와 실제 관측 완료시간·추정 비용으로 라우팅합니다. 합의된 계획을 구현 단계에서 다시 풀지 않아 컨텍스트와 비용을 줄입니다.</p>
  <div><strong>핵심 원칙:</strong> 표준 에이전트엔 <code>model:</code> 을 명시해 UI 기본값 누수를 막고, <strong>UI model picker 표시와 실제 호출 모델이 다를 수 있으니 세션 로그로 확인</strong> 합니다(<code>~/.copilot/session-state/&lt;id&gt;/events.jsonl</code>). 안 쓰는 MCP/도구는 컨텍스트·비용을 늘리므로 <code>tools:</code> 로 좁힙니다.</div>
  <div><strong>관측성:</strong> 토큰 단위 상세는 OpenTelemetry <code>gen_ai.usage.*</code> (input/output/reasoning tokens), 비용 원장은 Billing/Usage API(집계, 토큰 단위 아님). hook(preToolUse/postToolUse)은 정책·감사용이지 토큰 집계용이 아니며, 토큰/secret을 로그에 남기지 않습니다.</div>
</section>

<section>
  <h2>실습에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>반복 업무를 목적·입력·절차·금지·출력 계약으로 정형화한다.</li><li>입력 1개를 넣어 기대 출력 1개가 나오는 동작 예시를 확인한다.</li><li>역할·도구 권한이 필요할 때만 Custom Agent/Fleet으로 확장한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>목적: 변경 전 evidence 누락 점검
입력: spec + diff + test log
절차: 범위→AC→gate→rollback 확인
금지: prod write, secret 추정
출력: pass/revise/block + 누락 목록
동작 예시: 합성 입력 1건 → revise 1건
routing: PASS</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> 추상적인 “리뷰를 잘한다”가 아니라 실제 입력과 출력 모양이 있어야 재사용할 수 있습니다. 모델명보다 절차·도구·검증 책임이 먼저입니다.</div>
</section>

<section>
  <h2>체크포인트 &amp; 산출물 (수료 필수)</h2>
  <div><strong>산출물:</strong> 본인 업무용 <strong>Custom Skill 1개</strong> (목적·입력·절차·금지·출력) + Custom Agent/Fleet 운영 기준. 이는 수료 필수 항목입니다(<span>EV-09</span>).</div>
  <ul>
    <li>Skill에 입력·절차·금지·출력이 모두 있는가?</li>
    <li>팀의 반복 업무에 바로 재사용 가능한가(추상적 지침이 아니라)?</li>
    <li>Fleet 역할별 도구/중단 조건이 분리되었는가?</li>
  </ul>
  <div><strong>여기까지 오면:</strong> 여러분은 "Copilot에게 코드를 맡기는" 단계를 넘어, <strong>에이전트로 동작하는 자신만의 솔루션</strong> 을 손에 쥔 것입니다. 다음 세션은 이걸 팀에 나누는 시간입니다.</div>
</section>

<section>
  <h2>흔한 실수 &amp; 공유 포인트</h2>
  <ul>
    <li>추상적 지침만 적음 → 재사용 불가. 입력/출력/금지를 구체적으로.</li>
    <li>모든 도구를 노출 → 보안·컨텍스트 낭비. 필요한 도구만.</li>
  </ul>
  <div><strong>공유 포인트:</strong> S7에서 이 Skill을 <strong>30초 시연</strong> 할 수 있게 입력 1개와 기대 출력 1개를 준비하세요.</div>
</section>

<section>
  <h2>이 세션의 실행 코드 (Hands-on)</h2>
  <div><strong>단계별 모델 라우팅 + Skill/Agent 자산:</strong></div>
<pre><code># (새 창) sample-project-activity-log 터미널에서
npm run lab -- start d2-s6   # lab-work/my-skill.md 빈 구조 생성
# 목적·입력·절차·금지·출력·동작 예시를 직접 작성
npm run routing  # 단계별 모델 라우팅 데모(routeModel)
npm run lab -- check d2-s6
# 참고 예시: skills/sdd-skill.md</code></pre>
  <p>전체 실습 지도: <code>README.md</code></p>
</section>

  <div><strong>컷라인(최소 완료 <span>EV-10</span>):</strong> 동작 예시 1개가 딸린 <strong>Custom Skill 1개</strong> (목적·입력·절차·금지·출력)면 수료 통과입니다. Custom Agent·Fleet 표는 초안이면 충분합니다.</div>

<template id="embedded-source-055"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>M12</strong><span>멀티에이전트 하네스 도구 보고서</span><span>Cautious Classification</span></p><section>

        <article><h3>Superpowers</h3><p><strong>Superpowers = community skills/methodology framework</strong>. 개발 절차를 agent skill처럼 재사용하는 접근으로 읽는다. 팀 적용 시 skill owner, version pinning, license, allowed directories, prompt/skill version, eval coverage를 확인한다.</p><p>Source ID: SRC-SUPERPOWERS-REPO</p></article>
        <article><h3>GStack / g-stack / gstack</h3><p><strong>GStack = community Claude Code role/team stack</strong>. 역할 기반 ideation, review, QA, ship 같은 흐름을 묶는 community stack으로 본다. npm link는 registry-recheck-required로 낮춘다.</p><p>Source ID: SRC-GSTACK-REPO, SRC-GSTACK-NPM-RECHECK</p></article>
        <article><h3>Compound Engineering</h3><p><strong>Compound Engineering = Compound AI Systems 기반 architecture method, not product</strong>. 단일 모델 성능보다 여러 모델 호출, retrieval, tool, evaluator, cache, router를 시스템으로 묶는 설계 원칙으로 사용한다.</p><p>Source ID: SRC-COMPOUND-AI-SYSTEMS-BAIR</p></article>
      </div>
      <div>금지선: Superpowers 또는 GStack을 vendor-native offering처럼 말하지 않는다. Compound Engineering을 managed product로 말하지 않는다. 보안, 비용, 품질 효과는 환경 의존적이다.</div>

  <h2>활동에서 기대하는 바와 결과 예시</h2>
  <div>
    <div><h3>기대하는 바</h3><ul><li>대표 여부와 무관하게 전원이 같은 3장·handoff·현업 액션을 제출한다.</li><li>스펙→프롬프트→계획→테스트→검증→rollback→Skill 체인을 설명한다.</li><li>교육 GO, 실제 적용 GO, provenance와 D+7 부채를 분리 판정한다.</li></ul></div>
    <div><h3>결과 예시</h3><pre><code>3장: 문제 / Before-After / Skill 동작 예시
PL handoff: 5칸 완료
현업 액션: 3개 + owner
checkpoint: 16 / 16
provenance: CLEAN / FALLBACK / REFERENCE-MATCH 중 packet과 같은 값
교육 산출물: GO
실제 적용: NO-GO — 별도 승인 필요</code></pre></div>
  </div>
  <div><strong>예시 해석:</strong> 발표를 하지 않아도 제출물 기준은 같습니다. FALLBACK·REFERENCE-MATCH는 D+7 재검증 owner·due·검증 방법을 함께 남깁니다. <code>16/16</code> 은 교육 체인의 완료 증거이며 실제 시스템 배포 준비를 뜻하지 않습니다.</div>
</section>

<section>
  <h2>수료의 의미</h2>
  <div>이 과정을 마친 여러분은 ① 좋은 입력을 만들고, ② 에이전트를 게이트로 통제하며, ③ 검증 가능한 변경을 내고, ④ <strong>자신만의 재사용 솔루션</strong> 을 만들고, ⑤ 그 경험을 <strong>팀에 공유</strong> 할 수 있습니다. 다음은 D+7 클리닉에서 실제 업무에 적용한 결과를 가지고 다시 만납니다.</div>
  <div><strong>마지막 당부:</strong> 외부 공유 전에는 제품 기능·Agent 도구/설정·모델명·조직 보안 정책을 공식 문서와 테넌트 설정으로 재확인하세요. Harness PASS는 구조 검증이지 사실/보안/배포 승인이 아닙니다.</div>
</section>

<template id="embedded-source-062"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L41</strong><span>AI 보조 효과적 학습 가이드</span><span>1핵심 관점</span></p><section>
    <h2><span>1</span> 핵심 관점</h2>
    <p>AI를 학습에 잘 쓰는 핵심은 <strong>먼저 스스로 떠올리고, 그다음 AI로 점검하는 순서</strong> 를 지키는 것입니다. AI가 바로 설명을 대신 쓰면 편하지만, 학습자에게 필요한 검색 연습(retrieval practice), 생성 효과, 오류 감지 기회가 줄어듭니다. 또한 어떤 AI 사용법이 도움이 되는지는 <strong>학습자가 지금 어느 숙련 단계에 있는지</strong> 에 따라 달라지므로, 이 문서는 Dreyfus 스킬 습득 5단계를 학습 단계 지도로 함께 사용합니다.</p>
    <div>
      먼저 스스로 설명하고, 그다음 AI 답변과 비교한다. AI는 내 생각을 넘겨받는 도구가 아니라, 내 설명의 빈틈을 드러내는 상대역이다.
      <cite>— 이 문서의 운영 원칙</cite>
    </div>
    <div>
      <div><h3>AI가 잘하는 일</h3><p>질문 만들기, 힌트 제공, 비유 제안, 오개념 탐지, 변형 문제 생성, 복습 일정 제안.</p></div>
      <div><h3>학습자가 해야 할 일</h3><p>먼저 설명하기, 자기 풀이 쓰기, 원자료 확인하기, 오류 기록하기, 다시 설명하기.</p></div>
      <div><h3>금지선</h3><p>제출물 대필, 개인정보 입력, 출처 없는 답 확정, 평가 과제의 최종 판단 위임.</p></div>
    </div>
    <div>
      <div>가장 중요한 경고</div>
      <p>AI에게 답을 대신 맡기면 생성 효과와 인출 연습이 줄어 학습을 해칠 수 있다. 따라서 AI 답변은 <strong>내가 쓴 설명을 비교·개선하는 두 번째 단계</strong> 에 놓는 것이 안전합니다.</p>
    </div>
  </section></article></template>
<template id="embedded-source-063"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>S50</strong><span>에이전트형 SDLC 단계 매핑</span><span>7. 도출 인사이트</span></p><section>
      <h2>7. 도출 인사이트</h2>
      <ol>
        <li><strong>하네스부터, 모델도 함께.</strong> 에이전트 산출물의 불안정은 상당 부분 명세·통제·검증의 부재에서 오지만, 모델 선택·추론·tool-use 견고성도 큰 축이다 — 둘 다 투자 대상이다.</li>
        <li><strong>BDD/DDD만으로 부족 → RE·ADR.</strong> 행동 예시(BDD)와 도메인 경계(DDD)만으로는 승인·변경 추적·결정 이유가 자동 해결되지 않는다. 요구공학과 결정 기록이 에이전트 시대에 더 중요해진다.</li>
        <li><strong>테스트를 재설계.</strong> 일부 팀 경험상 AI가 mock-heavy(런던식) 테스트를 선호할 수 있다. state/result 중심·계약 기반 검증을 명시적으로 설계한다.</li>
        <li><strong>비용·보안·정책을 shift-left.</strong> FinOps·Threat Modeling·Policy-as-Code를 설계·배포로 당긴다. 단 비용은 설계뿐 아니라 사용량·운영 행태·거버넌스에도 강하게 연동된다.</li>
        <li><strong>사람 검토는 자율성의 안전장치.</strong> Autopilot이어도 merge/deploy는 repository policy와 human review 게이트를 통과한 뒤에만 가능하다.</li>
        <li><strong>운영→Spec 폐루프가 핵심.</strong> 관측 결과가 명세로 되돌아오지 않으면 Agentic SDLC는 단발 자동화에 그친다.</li>
        <li><strong>정답 방법론은 없다.</strong> 라이프사이클의 병목을 보고 필요한 층위 개념을 조합한다(아래 7장).</li>
      </ol>
    </section></article></template>
<template id="embedded-source-064"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>L41</strong><span>AI 보조 효과적 학습 가이드</span><span>4Feynman explain-then-compare loop</span></p><section>
    <h2><span>4</span> Feynman explain-then-compare loop</h2>
    <p>기존 파인만 학습법은 “쉽게 설명한다 → 막힌 부분을 찾는다 → 다시 배운다 → 더 단순화한다”는 루프입니다. AI를 넣을 때도 순서는 바뀌면 안 됩니다. 핵심 marker는 <strong>Feynman explain-then-compare loop</strong> 입니다.</p>
    <div>
      <div>
        <span>STEP 1</span>
        <h3>백지 설명</h3>
        <p>책과 AI를 닫고, 개념을 5~8문장으로 씁니다. 예제 하나를 직접 풉니다. 이 단계가 없으면 AI 사용은 학습보다 요약 소비에 가까워집니다.</p>
      </div>
      <div>
        <span>STEP 2</span>
        <h3>AI에게 질문자 역할 부여</h3>
        <p>내 설명을 붙여 넣고 “12살 학생도 이해할 수 있는지, 모호한 단어 3개와 왜 그런지 질문 5개를 만들어 달라”고 요청합니다. AI가 새 설명을 대신 쓰지 않게 합니다.</p>
      </div>
      <div>
        <span>STEP 3</span>
        <h3>원자료로 검증</h3>
        <p>AI의 지적을 교재, 강의, 공식 문서와 대조합니다. 막힌 부분을 표시하고 원자료로 돌아간다. 확인되지 않은 답변은 “가설”로 남깁니다.</p>
      </div>
      <div>
        <span>STEP 4</span>
        <h3>다시 설명하고 카드화</h3>
        <p>수정한 설명을 더 짧게 쓰고, AI에게 변형 문제와 플래시카드 3개를 만들게 합니다. 다음 복습 날짜를 정합니다.</p>
      </div>
    </div>
    <div>
      <h3>프롬프트 예시</h3>
      <p><code>아래는 내가 백지에서 쓴 설명이야. 답을 새로 써주지 말고, 내가 애매하게 쓴 부분 3개, 확인해야 할 전제 3개, 12살 학생이 물을 질문 5개만 만들어줘. 마지막에 내가 원자료로 확인할 체크리스트를 줘.</code></p>
    </div>
  </section></article></template>
<template id="embedded-source-065"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>W17</strong><span>Copilot 고급 업무 흐름 가이드</span><span>15. Learning Loop</span></p><section><h2>15. Learning Loop</h2><p>Copilot을 단순 코드 생성기가 아니라 학습 파트너로 쓰려면 “왜 이 결정을 했는지, 어떤 대안을 버렸는지, 어떤 테스트가 이 결정을 지지하는지”를 설명하게 한다. 다만 설명은 검증 결과가 아니므로 test, lint, PR review와 분리한다.</p></section></article></template>
<template id="embedded-source-066"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>C53</strong><span>SDLC 하네스 실제 사례</span><span>Compound Engineering — 매 작업이 다음 작업을 쉽게 만든다</span></p><div><div><div>CASE C3 · 저자 가이드 + 플러그인</div><h3>Compound Engineering — 매 작업이 다음 작업을 쉽게 만든다</h3><div><span>자기개선 루프</span> <span>/ce-compound</span> <span>docs/solutions/</span> <span>29 skills·0 agents</span></div></div><div><p>📦 <b>공개 저장소:</b> <a href="https://github.com/EveryInc/compound-engineering-plugin" target="_blank" rel="noopener noreferrer">EveryInc/compound-engineering-plugin</a></p>
<p><b>개요.</b> Every의 Kieran Klaassen이 정리한 방법론. 핵심 철학: <em>"각 엔지니어링 작업 단위는 다음 단위를 더 쉽게 만들어야 한다"</em>. 기능은 복잡도를 더하는 게 아니라 <b>시스템에 능력을 가르치고</b>, 버그 수정은 그 부류의 미래 버그를 없애며, 패턴은 도구로 성문화된다. Every는 이 방식으로 6개 제품을 대부분 1인 엔지니어링 팀으로 운영한다고 주장한다. <span>검증 필요</span> 자가 보고.</p>
<h4>7단계 메인 루프</h4>
<div>
  <span>Ideate</span> <span>→</span> <span>Brainstorm</span> <span>→</span>
  <span>Plan</span> <span>→</span> <span>Work</span> <span>→</span>
  <span>Review</span> <span>→</span> <span>Polish</span> <span>→</span>
  <span>Compound</span> <span>↺</span>
</div>
<h4>핵심 = Compound 단계(학습 환류) — 명시적 자기개선 하네스</h4>
<p><code>/ce-compound</code> 가 Full 모드에서 <b>3개 병렬 서브에이전트</b> (context analyzer · solution extractor · related-docs finder, 옵션으로 session historian)를 띄워, 방금 해결한 문제를 <b>검색 가능한 마크다운</b> 으로 <code>docs/solutions/</code> 에 남기고 <b><code>AGENTS.md</code> /<code>CLAUDE.md</code> 를 갱신</b> 한다. 이게 "harness engineering"의 문자 그대로의 구현 — 에이전트가 <b>자기 운영 지침을 스스로 쓴다</b>.</p>
<pre><code>your-project/
├── AGENTS.md or CLAUDE.md          # 매 세션 읽는 가장 중요한 파일(선호·패턴·컨텍스트)
├── .compound-engineering/config.local.yaml
└── docs/
    ├── brainstorms/                # /ce-brainstorm 요구사항
    ├── plans/                      # /ce-plan 구현계획
    └── solutions/                  # /ce-compound 제도적 지식
        ├── performance-issues/  ├── security-issues/  ├── database-issues/
        ├── architecture-patterns/ ├── conventions/    └── best-practices/</code></pre><pre><code><span># Claude Code</span>
/plugin marketplace add EveryInc/compound-engineering-plugin
/plugin install compound-engineering

<span># /ce-compound-refresh : CLAUDE.md 의 낡은/중복/구식 학습을 정리(keep/update/merge/archive)</span></code></pre>
<p>플러그인 규모는 GitHub README 기준 <b>29 스킬 · standalone agent 0개</b> (리뷰 렌즈·리서처 등은 스킬 내부 프롬프트 자산으로 포함되며, every.to 마케팅 문구는 "40+ agents·35+ skills"로 표기). 저자는 "첫 시도 95%는 쓰레기, 둘째도 50% — 이건 실패가 아니라 프로세스"라며 <b>산출물보다 산출물을 만드는 시스템</b> 이 가치라고 본다.</p>
<div><h4>팀 하네스 맥락 · 결과 · 에피소드</h4><ul><li><b>맥락:</b> Every의 이메일 AI <b>"Cora"</b> 를 밑바닥부터 만들며 나온 방법론 — "각 엔지니어링 단위는 다음 단위를 더 쉽게 만들어야 한다".</li><li><b>결과:</b> <i>(자가보고)</i> Every는 Cora·Monologue·Proof·Sparkle·Spiral·every.to <b>6개 제품을 대부분 1인 엔지니어링 팀</b> 으로 운영. <i>(내부 042)</i> 인간이 방향, AI가 구현·실험·리뷰·분석하는 반폐쇄형 R&amp;D 자동화 루프.</li><li><b>에피소드:</b> "첫 시도는 <b>95%가 쓰레기</b>, 둘째도 50% — 이건 실패가 아니라 프로세스." 심리적 장벽도 명시 — "내가 만든 게 맞나? 계획·리뷰·품질 보증이 곧 일이다. 사고는 네가 했고 AI는 타이핑만." (참고: 출시 글은 <code>/ce-compound</code> 를 6서브에이전트 흐름으로 소개하나, 플러그인 구현은 3병렬+옵션.)</li></ul><p>💰 <b>토큰 절약 포인트:</b> <b>학습을 성문화해 "다음 작업이 다시 유도하지 않게"</b> 하는 복리적 절감이다. <code>/ce-compound</code> 가 방금 해결한 문제·패턴을 <code>docs/solutions/</code> 와 <code>CLAUDE.md</code> 에 <b>검색 가능한 지식으로 적어</b> 두면, 이후 세션은 같은 배경을 처음부터 재수집·재추론하지 않고 그 문서를 참조한다 — 반복될수록 토큰당 산출이 커진다. 동시에 <code>/ce-compound-refresh</code> 로 낡은·중복 학습을 정리(keep/update/merge/archive)해 지침 파일이 비대해지며 <b>매 세션 주입 토큰이 늘어나는 것</b> 을 막아 균형을 잡는다.</p><p><b>보강 출처</b> · web: every.to/p/compound-engineering · 내부: 042·024</p></div><div><b>출처</b> · every.to/compound-writing/compound-engineering(Updated May 2026) · github.com/EveryInc/compound-engineering-plugin · cora.computer. <span>아키텍처 주장</span> 성과·인원 규모는 저자 자가 보고.</div><p><a href="../../../ref/harness-gen-output/053-agentic-sdlc-harness-engineering-real-cases-2026-07-10.html#toc" target="_blank" rel="noopener noreferrer">↑ 목차</a></p>
</div></div></article></template>
<template id="embedded-source-067"><article class="embedded-source-copy"><p class="embedded-source-meta"><strong>M24</strong><span>멀티에이전트 하네스 엔지니어링 보고서</span><span>도구·방법론 비교표</span></p><section><h2>도구·방법론 비교표</h2><table>
            <thead>
              <tr>

function visual(v){const items=v.items.map(x=>'<div class="visual-item"><strong>'+esc(x.label)+'</strong><span>'+esc(x.detail)+'</span></div>').join('');return '<div class="visual '+esc(v.type)+'" style="--count:'+v.items.length+'"><p class="visual-title">'+esc(v.title)+'</p><div class="visual-items">'+items+'</div></div>'}
function markup(s){const links=s.sources.map(id=>'<a class="tag embedded-source-link" href="'+sourceHref(s.id,id)+'" data-embedded-source="'+esc(s.id+'|'+id)+'" target="_blank" rel="noopener noreferrer" title="'+esc(SOURCES[id].title)+' · 내장 근거 열기">'+esc(id)+'</a>').join('');const caveats=s.caveats.map(id=>'<span class="tag caveat">'+esc(id)+'</span>').join('');const terms=s.terms?.length?'<div class="term-line">'+s.terms.map(x=>'<span class="term"><strong>'+esc(x[0])+'</strong>('+esc(x[1])+')</span>').join('')+'</div>':'';const caseStrip=s.caseStudy?'<div class="case-strip"><strong>REF CASE · '+esc(s.caseStudy.name)+'</strong><span>'+esc(s.caseStudy.text)+'</span></div>':'';const close=s.question?'<div class="teaching-close"><strong>청중 질문 · '+esc(s.question)+'</strong><span>학습자 활동 인계 · '+esc(s.handoff)+'</span></div>':'';const classes='slide content'+(s.caseStudy?' has-case':'')+(s.question?' has-close':'');return '<article class="'+classes+'" data-slide-id="'+esc(s.id)+'"><div class="section-rail"></div><header class="slide-head"><p class="kicker">'+esc(s.session)+' · '+esc(s.phase)+'</p>'+terms+'<h1 class="title">'+esc(s.title)+'</h1><p class="claim">'+esc(s.claim)+'</p></header><div class="slide-body"><ul class="bullets">'+s.bullets.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="visual-column">'+visual(s.visual)+caseStrip+close+'</div></div><footer class="slide-foot"><div class="source-tags">'+links+'</div><div class="caveat-tags">'+caveats+'</div></footer></article>'}
function notes(s){const links=s.sources.map(id=>'<li><a class="embedded-source-link" href="'+sourceHref(s.id,id)+'" data-embedded-source="'+esc(s.id+'|'+id)+'" target="_blank" rel="noopener noreferrer"><strong>'+id+'</strong> · '+esc(SOURCES[id].title)+'</a></li>').join('');const cv=s.caveats.length?'<h3>경계</h3><ul>'+s.caveats.map(id=>'<li><strong>'+id+'</strong> · '+esc(CAVEATS[id])+'</li>').join('')+'</ul>':'';notesContent.innerHTML='<h3>강사 발화</h3><p>'+esc(s.cue)+'</p>'+(s.caseStudy?'<h3>ref 사례</h3><p><strong>'+esc(s.caseStudy.name)+'</strong> · '+esc(s.caseStudy.text)+'</p>':'')+(s.question?'<h3>청중 질문</h3><p>'+esc(s.question)+'</p><h3>활동 인계</h3><p>'+esc(s.handoff)+'</p>':'')+'<h3>참조 링크</h3><ul>'+links+'</ul>'+cv}
function render(){const s=SLIDES[current];stage.innerHTML=markup(s);counter.textContent=String(current+1).padStart(2,'0')+' / '+SLIDES.length;chapterLabel.textContent=s.session+' · '+s.phase;progressFill.style.width=((current+1)/SLIDES.length*100)+'%';prevButton.disabled=current===0;nextButton.disabled=current===SLIDES.length-1;document.title=String(current+1).padStart(2,'0')+' · '+s.title+' — '+DAY;history.replaceState(null,'','#'+s.id);notes(s);document.querySelectorAll('.thumb').forEach((x,i)=>x.classList.toggle('current',i===current))}
function go(i){current=Math.max(0,Math.min(SLIDES.length-1,i));render()}function hash(){const id=location.hash.slice(1),i=SLIDES.findIndex(x=>x.id===id);if(i>=0)current=i;render()}function close(){overview.classList.remove('open');help.classList.remove('open');notesDrawer.classList.remove('open')}
function buildOverview(){document.querySelector('#overview-groups').innerHTML=SESSION_GROUPS.map(g=>'<section class="overview-group"><h3>'+g+'</h3><div class="thumb-grid">'+SLIDES.map((s,i)=>({s,i})).filter(x=>x.s.session===g).map(x=>'<button class="thumb" type="button" data-i="'+x.i+'"><small>'+String(x.i+1).padStart(2,'0')+' · '+x.s.phase+'</small><strong>'+esc(x.s.title)+'</strong></button>').join('')+'</div></section>').join('');document.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>{go(Number(b.dataset.i));close()}))}
function buildPrint(){document.querySelector('#print-root').innerHTML=SLIDES.map(s=>'<div class="print-slide">'+markup(s)+'</div>').join('')}
prevButton.addEventListener('click',()=>go(current-1));nextButton.addEventListener('click',()=>go(current+1));document.querySelector('#overview-button').addEventListener('click',()=>overview.classList.add('open'));document.querySelector('#notes-button').addEventListener('click',()=>notesDrawer.classList.toggle('open'));document.querySelector('#theme-button').addEventListener('click',()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark');document.querySelector('#print-button').addEventListener('click',()=>window.print());document.querySelector('#help-button').addEventListener('click',()=>help.classList.add('open'));document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',close));window.addEventListener('hashchange',hash);window.addEventListener('keydown',e=>{if(!sourceViewer.hidden)return;if(e.key==='Escape')return close();if(e.key.toLowerCase()==='o')return overview.classList.toggle('open');if(e.key.toLowerCase()==='n')return notesDrawer.classList.toggle('open');if(e.key.toLowerCase()==='t')return document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';if(e.key.toLowerCase()==='p'){e.preventDefault();return window.print()}if(e.key==='Home')return go(0);if(e.key==='End')return go(SLIDES.length-1);if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();return go(current+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}});buildOverview();buildPrint();hash();
</script></body></html>
