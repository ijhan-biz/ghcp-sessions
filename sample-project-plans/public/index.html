<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plans — 칸반 보드</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">📋 Plans</div>
      <div class="side-section">
        <div class="side-head">
          <span>보드</span>
          <button id="newBoardBtn" class="mini">+ 새 보드</button>
        </div>
        <ul id="boardList" class="board-list"></ul>
      </div>
      <div class="side-foot">완성본 예시 · Trello 유형 칸반<br />zero-dependency Node + vanilla JS</div>
    </aside>

    <main id="main">
      <header id="topbar">
        <h1 id="boardTitle" title="더블클릭하여 이름 변경">보드를 선택하세요</h1>
        <div class="top-actions">
          <input id="search" type="search" placeholder="카드 검색…" autocomplete="off" />
          <select id="dueFilter" title="마감 필터">
            <option value="">마감: 전체</option>
            <option value="overdue">지남</option>
            <option value="set">있음</option>
            <option value="none">없음</option>
            <option value="complete">완료</option>
          </select>
          <button id="membersBtn" class="btn" hidden>멤버</button>
          <button id="labelsBtn" class="btn" hidden>라벨</button>
          <button id="archiveBoardBtn" class="btn" hidden>보관</button>
        </div>
      </header>
      <section id="board" class="board"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="popRoot"></div>
  <div id="toast" class="toast"></div>

  <script src="/app.js" type="module"></script>
</body>
</html>
